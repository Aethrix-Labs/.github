name: design-to-planning (callable)

# Headless planning of ONE feature spec into one milestone in docs/planning.json.
# A product's thin .github/workflows/design-to-planning.yml `uses:` this. It fires on a
# merge to main that moves docs/specs/FEATURE_<slug>.md to `status: planning` (the
# design-import PR's merge, or a `design: none` handoff), or on the hub's Plan button.
# Flow: preflight (spec status, import checks) -> map design/spec to code -> plan ONE
# milestone -> plan-reviewer (fresh subagent, up to 3 passes) -> commit the plan
# (docs/planning.json, the spec's `implementing` status, and the routing-board row when
# one is materialized) via ci-commit (doc-only, auto-ships on green). The autonomous
# implementer loop builds it; this skill never implements.
#
# Requires the design-to-planning bundle vended to fleet-skills `ci/design-to-planning/`,
# reached here at .fleet-ci/ci/design-to-planning/. Its "Headless mode" section defines
# the inputs, the phase and run-id breadcrumbs, the escalation packets and the commit
# path this file matches.
#
# Concurrency is shared with lite-planner-callable (group plan-edit-<repo>) because both
# append a milestone to docs/planning.json. Residual risk, not solved here: a second run
# can start before the first run's PR merges. The two PRs then conflict on planning.json
# and the second fails at commit. That is visible, not silent: the failure guard below
# files a design-to-planning-failed entry.

on:
  workflow_call:
    inputs:
      product_slug:
        description: "Product slug (defaults to repo basename)."
        type: string
        required: false
        default: ""
      spec_slug:
        description: "Slug of the feature spec to plan: docs/specs/FEATURE_<spec_slug>.md."
        type: string
        required: true
      hub_url:
        description: "Hub base URL for the queue POST. Defaults to https://sethgibson.com."
        type: string
        required: false
        default: "https://sethgibson.com"
      model:
        description: "Claude model for the agent: an alias (sonnet|opus|haiku|fable) or an exact id. Chosen per run by the hub; the default is the pre-parameterization pin."
        type: string
        required: false
        default: "claude-sonnet-5-5"
      effort:
        description: "Reasoning effort for the agent: low|medium|high|xhigh|max. Chosen per run by the hub."
        type: string
        required: false
        default: "medium"
      runner_label:
        description: "Self-hosted runner label (STANDARDS §9 surface routing). 'fleet' = PC. Planning is read-and-write on docs only and needs no device, so 'fleet-mac' is only ever a spill-over choice, never a requirement."
        type: string
        required: false
        default: "fleet"

permissions:
  contents: write       # commit the plan edit (docs/planning.json, the spec, the routing board; doc-only auto-ship)
  pull-requests: write  # ci-commit opens the PR
  id-token: write       # required by anthropics/claude-code-action@v1

concurrency:
  # Serialize per product so two runs can't race the plan edit (docs/planning.json). The group is
  # shared with lite-planner-callable, which appends a milestone to the same file.
  group: plan-edit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  design-to-planning:
    # Self-hosted runner, label set per dispatch (STANDARDS §9): 'fleet' (default) is the Fleet
    # PC (WSL2); 'fleet-mac' only when the hub spills over. No `linux` label on purpose: the Mac
    # has none, and only PC instances carry `fleet` (STANDARDS §28.1). See
    # ~/products/docs/SELF_HOSTED_RUNNER.md.
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    # STANDARDS §28.6. Same budget as lite-planner: --max-turns 180 is ~60m at the implementer's
    # worst observed ~20s/turn, so a legitimately long plan is never cut off.
    timeout-minutes: 60
    env:
      # One source for the turn cap: the agent step's --max-turns and the failure guard's
      # "did it run out of turns?" test both read it, so they cannot drift apart.
      AGENT_MAX_TURNS: "180"
    steps:
      - uses: actions/checkout@v4        # consumer repo at $GITHUB_WORKSPACE
        with:
          fetch-depth: 0                 # planner reads code + git history

      - uses: actions/checkout@v4        # fleet-skills (CI skills under ci/)
        with:
          repository: Aethrix-Labs/fleet-skills
          path: .fleet-ci
          ref: main
          token: ${{ secrets.FLEET_SKILLS_PAT }}

      - name: Set up gh CLI
        run: gh --version

      - name: Configure git for commits
        run: |
          git config user.name  "design-to-planning[bot]"
          git config user.email "design-to-planning@aethrix-labs.local"

      - name: Resolve model and effort
        id: models
        # The /settings dropdown is the only control for design-to-planning. The hub's Plan dispatch
        # already sends its /settings value as inputs.model/effort. A push-started run does not: the
        # caller's `redispatch` job starts it with `gh workflow run` under GITHUB_TOKEN, so the actor
        # is github-actions and the inputs are just the YAML defaults (real-estate-manager run
        # 39032124503 ran on sonnet/medium instead of the /settings value). Only that actor asks the
        # hub; any other actor (the hub's Plan dispatch, a manual Actions run) keeps its inputs.
        env:
          RUN_ACTOR: ${{ github.actor }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_EFFORT: ${{ inputs.effort }}
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          DTP_HUB_URL: ${{ inputs.hub_url }}
        run: |
          MODEL="$INPUT_MODEL"
          EFFORT="$INPUT_EFFORT"
          SOURCE="inputs"

          if [ "$RUN_ACTOR" = "github-actions[bot]" ]; then
            HUB="${DTP_HUB_URL:-https://sethgibson.com}"
            HUB_MODEL=""; HUB_EFFORT=""; WHY=""
            if [ -z "$AUTONOMOUS_TICK_TOKEN" ]; then
              WHY="AUTONOMOUS_TICK_TOKEN is not set"
            elif ! command -v jq >/dev/null 2>&1; then
              WHY="jq is not on PATH"
            elif ! BODY="$(curl -fsS --max-time 10 \
                -H "Authorization: Bearer $AUTONOMOUS_TICK_TOKEN" \
                "${HUB}/api/agent-models/design-to-planning")"; then
              WHY="the hub call failed"
            else
              HUB_MODEL="$(printf '%s' "$BODY" | jq -r '.model // empty' 2>/dev/null || true)"
              HUB_EFFORT="$(printf '%s' "$BODY" | jq -r '.effort // empty' 2>/dev/null || true)"
              # These land in claude_args: shape-check them (DECISIONS 2026-10-13 / STANDARDS §14).
              if ! printf '%s' "$HUB_MODEL" | grep -Eq '^[a-z0-9.-]+$'; then
                WHY="the hub returned an invalid model"
              else
                case "$HUB_EFFORT" in
                  low|medium|high|xhigh|max) ;;
                  *) WHY="the hub returned an invalid effort" ;;
                esac
              fi
            fi

            if [ -z "$WHY" ]; then
              MODEL="$HUB_MODEL"
              EFFORT="$HUB_EFFORT"
              SOURCE="hub"
            else
              echo "::warning::design-to-planning-callable: ${WHY}; falling back to inputs.model/inputs.effort (${MODEL}, ${EFFORT})"
            fi
          fi

          echo "::notice::design-to-planning-callable: model=${MODEL} effort=${EFFORT} source=${SOURCE}"
          {
            echo "model=${MODEL}"
            echo "effort=${EFFORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI (job-private HOME)
        # Pre-installs the CLI under a job-private HOME so concurrent jobs do not collide in the
        # shared ~/.claude/downloads (2026-10-09: 3 of 5 simultaneous dev-watchdog runs failed with
        # `Checksum verification failed`). Why, and what the fallback is: implementer-callable.yml's
        # step of the same name. Same script in every callable; change them together.
        id: claude-cli
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          CLI_HOME="$RUNNER_TEMP/claude-cli-home"
          PIN_SRC="$RUNNER_WORKSPACE/../_actions/anthropics/claude-code-action/v1/src/entrypoints/run.ts"
          fall_back() {
            echo "::warning::claude-cli pre-install skipped: $1. claude-code-action will install the CLI itself into the shared ~/.claude/downloads, where a concurrent job can make that fail with 'Checksum verification failed'."
            exit 0
          }
          VERSION="$(sed -n 's/.*claudeCodeVersion = "\([0-9][0-9.]*\)".*/\1/p' "$PIN_SRC" 2>/dev/null | head -n 1)" || VERSION=""
          [ -n "$VERSION" ] || fall_back "could not read the pinned CLI version from $PIN_SRC"
          rm -rf "$CLI_HOME"
          mkdir -p "$CLI_HOME" || fall_back "could not create $CLI_HOME"
          for ATTEMPT in 1 2 3; do
            env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_CACHE_HOME -u XDG_STATE_HOME -u CLAUDE_CONFIG_DIR HOME="$CLI_HOME" \
              bash -c 'set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash -s -- "$1"' _ "$VERSION" && break
            echo "claude-cli pre-install: attempt $ATTEMPT failed"
            [ "$ATTEMPT" -lt 3 ] && sleep 5
          done
          BIN="$CLI_HOME/.local/bin/claude"
          [ -x "$BIN" ] || fall_back "the installer left no executable at $BIN"
          GOT="$(env HOME="$CLI_HOME" "$BIN" --version 2>/dev/null | head -n 1)" || true
          case "$GOT" in
            "$VERSION"*) ;;
            *) fall_back "$BIN reports '$GOT', not the pinned $VERSION" ;;
          esac
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "claude-cli pre-install: $GOT at $BIN (installer HOME was $CLI_HOME)"

      - name: Run design-to-planning agent
        id: agent
        uses: anthropics/claude-code-action@v1
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          DTP_PRODUCT_SLUG: ${{ inputs.product_slug }}
          DTP_HUB_URL: ${{ inputs.hub_url }}
          DTP_SPEC_SLUG: ${{ inputs.spec_slug }}
        with:
          # Set by the pre-install step above; empty means it fell back and the action installs itself.
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running as the design-to-planning agent in CI, headless.

            Read `.fleet-ci/ci/design-to-planning/SKILL.md` and follow its Headless
            mode exactly for spec $DTP_SPEC_SLUG (docs/specs/FEATURE_$DTP_SPEC_SLUG.md).

            Plan one milestone, run the plan-reviewer loop per lite-planner Step 3's
            CI venue (`.fleet-ci/ci/lite-planner/SKILL.md`), commit through
            `.fleet-ci/ci/ci-commit/SKILL.md`. Do not implement.

            Runtime context:
            - Working directory has the full consumer repo (fetch-depth: 0).
            - Product slug: $DTP_PRODUCT_SLUG (or derive from $GITHUB_REPOSITORY).
            - Hub base URL: $DTP_HUB_URL.
          claude_args: |
            --model ${{ steps.models.outputs.model }}
            --effort ${{ steps.models.outputs.effort }}
            --max-turns ${{ env.AGENT_MAX_TURNS }}
            --allowedTools Read,Bash,Write,Edit,Glob,Grep
            # --max-turns 180 matches lite-planner-callable and implementer-callable: the
            # same commit tax (plan-reviewer up to 3 passes -> ci-commit -> canonical-doc-update
            # -> tier-classify) plus codebase mapping of the spec and design. The durable fix
            # for a long run is the skill's bounded reading and the plan-reviewer's margin
            # sizing, not raising the cap further.

      - name: Emit failure queue entry on agent death
        # The agent step failed before its own exit path — surface it in the decision queue so a
        # spec that reached `planning` doesn't sit unplanned. The cause is read off the agent's
        # result object, not assumed.
        id: failure-entry
        if: failure() && steps.agent.outcome == 'failure'
        env:
          # The action's transcript (a JSON array of SDK messages; the last `result` message carries
          # subtype / is_error / num_turns). Empty when the action died before writing it.
          AGENT_EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          # The agent step's outcome and who started the run, for the pre-flight cause (the action
          # refuses bot actors).
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          RUN_ACTOR: ${{ github.actor }}
          RUN_ACTOR_TYPE: ${{ github.event.sender.type }}
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          DTP_PRODUCT_SLUG: ${{ inputs.product_slug }}
          DTP_HUB_URL: ${{ inputs.hub_url }}
          DTP_SPEC_SLUG: ${{ inputs.spec_slug }}
        run: |
          SLUG="${DTP_PRODUCT_SLUG:-$(basename "$GITHUB_REPOSITORY")}"
          HUB="${DTP_HUB_URL:-https://sethgibson.com}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # The spec slug is interpolated into the JSON body below and into the Plan interactively
          # prompt; keep it to a plain slug.
          SPEC="$(printf '%s' "${DTP_SPEC_SLUG:-}" | tr -cd 'A-Za-z0-9._-' | head -c 128)"
          [ -n "$SPEC" ] || SPEC="unknown"
          PLAN_PROMPT="/fleet-skills:design-to-planning ${SPEC}"

          # Phase breadcrumb — the agent overwrites this single-line marker at each
          # phase boundary (design-to-planning SKILL.md "Headless mode"). On a
          # max-turns/crash death the agent never reached its exit path, so this
          # file is the only signal for WHERE it died. Localizes the failure to a
          # phase (preflight | mapping | planning | adversary | committing) instead of
          # a bare death. Absent → "unknown". Mirrors lite-planner-callable's handler.
          PHASE_FILE="${GITHUB_WORKSPACE:-.}/.design-to-planning-phase"
          LAST_PHASE="unknown"
          if [ -f "$PHASE_FILE" ]; then
            LAST_PHASE="$(tr -d '\r\n' < "$PHASE_FILE" | head -c 200)"
          fi
          echo "::notice::design-to-planning-callable: workflow failed at phase=${LAST_PHASE}"

          # Run-id breadcrumb — written by the skill at the moment it mints the loop's run_id
          # (STANDARDS §18.1a), named after the agent like the phase marker above. The packet carries
          # it so the queue entry cross-links to the agent's activity trail. Absent, empty or
          # malformed → omit the field and say so in `attempts`. NEVER substitute $GITHUB_RUN_ID:
          # that names the workflow run, not the agent's loop, and a packet keyed to the wrong
          # identifier space reads as a confident empty trail.
          RUN_ID_FILE="${GITHUB_WORKSPACE:-.}/.design-to-planning-run-id"
          AGENT_RUN_ID=""
          if [ -f "$RUN_ID_FILE" ]; then
            AGENT_RUN_ID="$(tr -d '\r\n' < "$RUN_ID_FILE" | head -c 128)"
          fi
          RUN_ID_FIELD=""
          RUN_ID_NOTE=""
          case "$AGENT_RUN_ID" in
            "")
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.design-to-planning-run-id) was missing or empty, so this entry carries no run_id and is not linked to an activity trail." ;;
            *[!A-Za-z0-9_-]*)
              # Interpolated into the JSON body below; anything outside a plain id is not trusted.
              AGENT_RUN_ID=""
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.design-to-planning-run-id) was malformed, so this entry carries no run_id and is not linked to an activity trail." ;;
            *)
              RUN_ID_FIELD="\"run_id\": \"$AGENT_RUN_ID\"," ;;
          esac

          # What the agent step actually reported. claude-code-action writes its transcript to
          # $RUNNER_TEMP/claude-execution-output.json and prints a {"type":"result", ...} object to the
          # log. Asserting "max-turns, crash, or infra" without looking names a cause the log can
          # contradict, so branch on the result object; where it cannot be read, say so.
          #   max-turns   subtype error_max_turns, or num_turns at/near the cap
          #   crash       is_error true, a non-success subtype, or no result object in the transcript
          #   clean-exit  subtype success, is_error false, turns well under the cap
          #   pre-flight  the agent step failed and no transcript exists: the action died in its own setup,
          #               before the agent started
          #   unknown     a transcript exists but jq is unavailable or a field would not parse
          EXEC_FILE="${AGENT_EXECUTION_FILE:-}"
          if [ -z "$EXEC_FILE" ]; then
            EXEC_FILE="${RUNNER_TEMP:-}/claude-execution-output.json"
          fi
          CAP="${AGENT_MAX_TURNS:-}"
          case "$CAP" in ""|*[!0-9]*) CAP="" ;; esac
          R_KIND=""; R_SUBTYPE=""; R_ERR=""; R_TURNS=""; R_BG=""; R_DONE=""; R_STOP=""
          if [ -f "$EXEC_FILE" ] && command -v jq >/dev/null 2>&1; then
            R_LINE="$(jq -r -s '
                [.[] | if type == "array" then .[] else . end | select(type == "object" and .type == "result")] | last
                | if . == null then "none"
                  else ["result", (.subtype | tostring), (.is_error | tostring), (.num_turns | tostring),
                       ((.subagent_stats | objects | .started_in_background | numbers) // "" | tostring),
                       ((.subagent_stats | objects | .completed | numbers) // "" | tostring),
                       ((.stop_reason | strings) // "")] | join("|")
                  end' "$EXEC_FILE" 2>/dev/null || true)"
            IFS='|' read -r R_KIND R_SUBTYPE R_ERR R_TURNS R_BG R_DONE R_STOP <<< "$R_LINE" || true
            # These land in the JSON body below: keep them to plain tokens.
            R_SUBTYPE="$(printf '%s' "$R_SUBTYPE" | tr -cd 'A-Za-z0-9_-' | head -c 64)"
            case "$R_ERR" in true|false) ;; *) R_ERR="" ;; esac
            case "$R_TURNS" in ""|*[!0-9]*) R_TURNS="" ;; esac
            # subagent_stats is absent on older transcripts: absent or unparseable is no evidence, never 0.
            case "$R_BG" in ""|*[!0-9]*) R_BG="" ;; esac
            case "$R_DONE" in ""|*[!0-9]*) R_DONE="" ;; esac
            R_STOP="$(printf '%s' "$R_STOP" | tr -cd 'A-Za-z0-9_-' | head -c 32)"
          fi
          CAUSE="unknown"
          BG_WAIT=""
          if [ "$R_KIND" = "none" ]; then
            CAUSE="crash"
          elif [ "$R_KIND" = "result" ]; then
            if [ "$R_SUBTYPE" = "error_max_turns" ] || { [ -n "$R_TURNS" ] && [ -n "$CAP" ] && [ "$R_TURNS" -ge $((CAP * 9 / 10)) ]; }; then
              CAUSE="max-turns"
            elif [ "$R_ERR" = "true" ] || { [ -n "$R_SUBTYPE" ] && [ "$R_SUBTYPE" != "success" ]; }; then
              CAUSE="crash"
            elif [ "$R_SUBTYPE" = "success" ] && [ "$R_ERR" = "false" ] && [ -n "$R_TURNS" ] && [ -n "$CAP" ]; then
              CAUSE="clean-exit"
              # Sub-flag, not a fifth cause: the agent dispatched subagents in the background, none had
              # completed, and it ended its turn waiting (STANDARDS 28.6). Needs both fields present.
              if [ -n "$R_BG" ] && [ -n "$R_DONE" ] && [ "$R_BG" -ge 1 ] && [ "$R_DONE" -eq 0 ]; then
                BG_WAIT=1
              fi
            fi
          fi
          # Pre-flight: the agent step failed and no transcript exists, so the action died in its own
          # setup (token exchange, trigger or actor checks) before the agent started. A transcript that
          # exists but cannot be parsed is not this case; it stays `unknown`. The action's own error line
          # cannot be quoted from here: check-run annotations are filled in only when the job completes
          # (annotations_count is 0 and the job-logs endpoint returns 404 while it runs, probed
          # 2026-10-18), so the entry sends the reader to the agent step's log. What this step can say
          # without guessing is who started the run, which is what the action's actor check reads.
          PF_ATTEMPT=""; PF_RECO=""
          if [ "$CAUSE" = "unknown" ] && [ "${AGENT_OUTCOME:-}" = "failure" ] && [ ! -f "$EXEC_FILE" ]; then
            CAUSE="pre-flight"
            # Interpolated into the JSON body below: a plain login, capped.
            PF_ACTOR="$(printf '%s' "${RUN_ACTOR:-}" | tr -cd 'A-Za-z0-9_.[]-' | head -c 64)"
            PF_BOT=""
            if [ "${RUN_ACTOR_TYPE:-}" = "Bot" ]; then
              PF_BOT=" This run was started by the bot actor ${PF_ACTOR:-unknown}, and claude-code-action refuses bot actors unless allowed_bots is set; if the agent step's log says 'Workflow initiated by non-human actor', that is the cause."
            fi
            PF_ATTEMPT="claude-code-action failed before the agent started: it wrote no transcript, so no agent session ran. Its own error line could not be read from inside the job (check-run annotations and the job log are only populated once the job completes), so it is not quoted here; it is in the log of the agent step.${PF_BOT}"
            PF_RECO="Read the first lines of the agent step's log in the run for the action's error. If it says 'non-human actor' or allowed_bots, the run was started by a bot: re-dispatch it as a person (the hub's Plan / Retry runs under GITHUB_MERGE_TOKEN as sgibson53, which passes). Any other pre-flight error is an action setup problem, not a budget or agent failure: fix what the log names, then re-dispatch."
          fi
          echo "::notice::design-to-planning-callable: agent result cause=${CAUSE} subtype=${R_SUBTYPE:-?} is_error=${R_ERR:-?} turns=${R_TURNS:-?}/${CAP:-?} bg_started=${R_BG:-?} bg_completed=${R_DONE:-?} stop_reason=${R_STOP:-?}"

          # The transcript is the only record of the agent's final message ("why did it stop"); the
          # runner's temp dir is wiped at job end. Hand it to the upload step below.
          TRANSCRIPT_NOTE=""
          if [ -f "$EXEC_FILE" ]; then
            TRANSCRIPT_NOTE=" The agent's full transcript is attached to the run as the artifact design-to-planning-transcript-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1} (7-day retention); its last result message is the agent's own account of why it stopped."
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "transcript_path=$EXEC_FILE" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Only what the result object supports is asserted; the phase advice (exploration over-ran,
          # loop thrashing) is reserved for an actual max-turns death. Keep the quoting simple: these
          # strings are interpolated into the JSON body below. Every RECO ends with the Plan
          # interactively prompt (appended after the case), as does the `ask`.
          case "$CAUSE" in
            max-turns)
              ATTEMPT="claude-code-action used ${R_TURNS} of ${CAP} turns (result subtype ${R_SUBTYPE}), at or near its turn cap, before the skill's own exit path."
              RECO="Died at phase '${LAST_PHASE}'. preflight/mapping → exploration likely over-ran the budget (the spec and the top REPORT.md section are the scope — don't re-derive the whole repo); planning/adversary → the milestone may be too big for one implementer-sized plan (split for cost) or the plan-reviewer loop is thrashing; committing → check the ci-commit / canonical-doc-update tail. If the spec is genuinely too big to plan in one pass, split or re-scope it with feature-spec." ;;
            crash)
              if [ "$R_KIND" = "none" ]; then
                ATTEMPT="claude-code-action ended without a result object in its transcript (a crash or infra error) before the skill's own exit path."
              else
                ATTEMPT="claude-code-action ended in error (result subtype ${R_SUBTYPE:-unknown}, is_error ${R_ERR:-unknown}, ${R_TURNS:-unknown} of ${CAP:-unknown} turns) before the skill's own exit path."
              fi
              RECO="Died at phase '${LAST_PHASE}'. This reads as a crash or infra error, not a budget death: re-dispatching with the Plan button is apt. If it recurs at the same phase, read the run log before changing anything. If the phase was committing, check whether another plan PR touching docs/planning.json was still open (the two PRs conflict and the second fails at commit): merge it, then Plan again." ;;
            clean-exit)
              if [ -n "$BG_WAIT" ]; then
                # Signature of STANDARDS 28.6 (a headless agent has no next turn).
                ATTEMPT="The agent's result object reports success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap, stop_reason ${R_STOP:-unreported}) yet the step is marked failed: the agent spawned ${R_BG} subagent(s) in the background, none completed (${R_DONE} completed), and it ended its turn waiting for one, most likely the plan-reviewer. A headless session has no next turn, so that ended the session without running its exit path (STANDARDS 28.6)."
                RECO="Died at phase '${LAST_PHASE}'. Not a budget or infra failure: do not re-scope the spec as too big on this evidence. The fix is the skill's dispatch instruction (Headless mode, Step 4 on a runner, STANDARDS 28.6), and a re-dispatch before that fix lands stops the same way. Nothing is parked: design-to-planning holds no WIP checkpoint, so the lost work is the drafted plan, which only ever lived in the runner workspace. The agent's final message in the transcript artifact should say what it was waiting for."
              else
                ATTEMPT="The agent's result object reports success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap) yet the step is marked failed."
                RECO="Not a budget or infra failure. Read the run log around the end of the agent step, and the agent's final message in the transcript artifact, to see why the step was marked failed (last phase '${LAST_PHASE}')."
              fi ;;
            pre-flight)
              ATTEMPT="$PF_ATTEMPT"
              RECO="$PF_RECO" ;;
            *)
              ATTEMPT="claude-code-action failed before the skill's own exit path; cause unknown (the agent step's result object could not be read from this job)."
              RECO="Cause unknown - read the run log (and the transcript artifact, if one is attached) before choosing between re-dispatching and planning manually. The last phase reached was '${LAST_PHASE}'." ;;
          esac
          ATTEMPT="${ATTEMPT} Last phase reached: ${LAST_PHASE}. Run: ${RUN_URL}"
          ATTEMPT="${ATTEMPT}${RUN_ID_NOTE}${TRANSCRIPT_NOTE}"
          RECO="${RECO} Plan interactively: ${PLAN_PROMPT}"
          ASK="Inspect the run log; re-dispatch with the Plan button, or plan interactively: ${PLAN_PROMPT}"

          if [ -n "$QUEUE_SERVICE_ROLE_KEY" ]; then
            REQUEST_ID=$(printf '%s' "${GITHUB_RUN_ID}design-to-planning-failed" | sha256sum | cut -d' ' -f1)
            curl -sf -X POST "${HUB}/api/v1/queue/entries" \
              -H "Content-Type: application/json" \
              -H "x-service-role-key: $QUEUE_SERVICE_ROLE_KEY" \
              -H "User-Agent: aethrix-fleet-ci/1.0 (design-to-planning-callable)" \
              -d "{
                \"request_id\": \"$REQUEST_ID\",
                \"entry_type\": \"exception\",
                \"variant\": \"design-to-planning-failed\",
                ${RUN_ID_FIELD}
                \"agent_name\": \"design-to-planning\",
                \"product_slug\": \"$SLUG\",
                \"title\": \"[$SLUG] design-to-planning failed on spec ${SPEC}\",
                \"goal\": \"Plan the spec into one milestone in docs/planning.json\",
                \"attempts\": [\"$ATTEMPT\"],
                \"artifacts\": [{\"label\": \"Workflow run\", \"href\": \"$RUN_URL\", \"artifact_type\": \"doc\"}],
                \"ask\": \"$ASK\",
                \"recommendation\": \"$RECO\"
              }" \
            || echo "::warning::design-to-planning-callable: failure queue-entry POST failed"
          else
            echo "::warning::design-to-planning-callable: QUEUE_SERVICE_ROLE_KEY missing; skipping failure queue entry"
          fi

      - name: Upload the agent transcript (failure path only)
        # The agent step runs with show_full_output: false, so the log carries the result object but
        # not the agent's final message, and the transcript is deleted with the runner's temp dir.
        # An artifact rather than show_full_output: true — that would print every tool result,
        # secrets included, into a log anyone with read access can open. The guard above sets
        # `transcript_path` only when it ran, i.e. the agent step failed.
        if: always() && steps.failure-entry.outputs.transcript_path != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: design-to-planning-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.failure-entry.outputs.transcript_path }}
          if-no-files-found: warn
          retention-days: 7
