# security-review.yml — central fleet workflow
#
# Deployed at:   Aethrix-Labs/.github:.github/workflows/security-review.yml
# Convention:    STANDARDS.md §17 (Fleet CI)
# Spec:          SECURITY_REVIEW_REDESIGN.md §9 (§9.0 supersedes the per-repo vend model)
# Authoring src: fleet-command-center:/skills/security-review/ (canonical; workflow YAML lives only at .github)
# Helper src:    fleet-command-center:/skills/security-review/{*.py,SKILL.md}
#                → vended to Aethrix-Labs/fleet-skills:ci/security-review/ (STANDARDS §19.6)
#                  and fetched at runtime via the second checkout into .fleet-ci/
#
# This workflow is deployed once at the org level. Every in-org repo inherits
# it via the org ruleset (required workflow). No per-repo workflow file needed.
# Helpers are fetched at runtime via a second checkout of this repo into
# .fleet-ci/ (§17.3). See STANDARDS.md §17.7 for the out-of-org install path.

name: security-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read # harmless without PR-comment integrations; kept for future use

# Runner (STANDARDS §28.1 / §17.12). Private repos run on the fleet PC's self-hosted runners
# — GitHub-hosted minutes on a private repo are the cost this avoids. When the runners are
# offline the jobs queue until one is back (no hosted fallback, by design). Public repos
# keep ubuntu-latest: they don't bill minutes, and the self-hosted runner group is
# private-repos-only. The self-hosted runner has no sudo, no pip and a persistent home, so
# every tool below installs into the per-runner tool cache instead of /usr/local.
#
# Spill-over (STANDARDS §9 "Spill-over", §28.1). In a private repo the three jobs below do
# not name a host: they take the label the choose-runner job emits, `fleet` (the PC) or
# `fleet-mac` (the Mac, when the PC is saturated). So nothing in them may assume Linux: the
# runner is `[self-hosted, <label>]` with no OS label (the Mac carries macOS/ARM64 and no
# `linux`), and every downloaded binary resolves its own OS and architecture. A job that
# only works on the PC would fail on exactly the runs that spill, the hardest to reproduce.

jobs:
  # Picks the host for the jobs below. It runs on ubuntu-latest, the one sanctioned hosted-
  # runner job in a private repo (STANDARDS §28.1): on `fleet` it would queue behind the very
  # saturation it exists to detect, and on a bare `[self-hosted]` it could land on, and
  # consume, the Mac instance it is protecting. Do not move it to a self-hosted runner. It is
  # seconds of work, billed as GitHub's one-minute minimum. Skipped in a public repo, which
  # is on ubuntu-latest already.
  #
  # Rule: `fleet` if any fleet instance is online and idle. Otherwise `fleet-mac`, but only
  # if a fleet-mac instance is itself online and idle. The Mac is manual-start, and a job
  # routed to a label with no online instance sits queued for ~24 h, where waiting on a
  # saturated PC drains in minutes (STANDARDS §9 "Manual-start operational model";
  # DECISIONS 2026-10-05). It is a snapshot, not a reservation: PRs opened together read the
  # same state and all pick `fleet`.
  #
  # FAILS OPEN TO `fleet`, never to `fleet-mac`, on any error: unset credential, non-200,
  # unparseable or truncated body, or an unexpected failure in the script. `fleet-mac` would
  # send a web job to the one host a mobile job cannot do without. A degraded read must be
  # loud: the milestone-test gate's equivalent check sat behind an unset secret and silently
  # took its fail-open branch in six repos for months. Hence the ::warning:: on every
  # degraded path. The job itself never fails.
  choose-runner:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # checks out nothing and uses no job token; the runners read uses the PAT below
    outputs:
      runner_label: ${{ steps.pick.outputs.runner_label }}
    steps:
      - name: Pick the runner label
        id: pick
        env:
          # Fine-grained PAT, org permission "Self-hosted runners: Read" only, private repos
          # only. GITHUB_TOKEN and the merge PAT both 403 on the org runners endpoint.
          RUNNERS_READ_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set +e
          fail_open() {
            echo "::warning::security-review runner chooser DEGRADED: $1. Falling open to fleet; spill-over to fleet-mac was NOT evaluated for this PR."
            echo "runner_label=fleet" >> "$GITHUB_OUTPUT"
            exit 0
          }
          trap 'fail_open "unexpected error at line $LINENO"' ERR

          if [ -z "${RUNNERS_READ_TOKEN:-}" ]; then
            fail_open "RUNNERS_READ_TOKEN is not set or not visible to this repo"
          fi
          command -v jq >/dev/null 2>&1 || fail_open "jq is not on PATH"

          BODY="$RUNNER_TEMP/org-runners.json"
          CODE="$(curl -sS -m 20 -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer $RUNNERS_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${ORG}/actions/runners?per_page=100")" \
            || fail_open "the runners request could not reach GitHub"
          [ "$CODE" = "200" ] || fail_open "the runners endpoint returned HTTP $CODE"

          # Parseable AND complete. A second page of runners would make the counts below a
          # silent undercount, which could read a busy PC as idle or an idle Mac as absent.
          jq -e '(.runners | type) == "array" and (.total_count | type) == "number" and .total_count <= (.runners | length)' "$BODY" >/dev/null 2>&1 \
            || fail_open "the runners response was unparseable or spans more than one page"

          IDLE='[.runners[] | select(.status == "online" and .busy == false and any((.labels // [])[]; .name == $l))] | length'
          FLEET_IDLE="$(jq -r --arg l fleet "$IDLE" "$BODY")"
          MAC_IDLE="$(jq -r --arg l fleet-mac "$IDLE" "$BODY")"
          case "${FLEET_IDLE}x${MAC_IDLE}" in
            *[!0-9x]* | x* | *x) fail_open "could not count idle instances (fleet='${FLEET_IDLE}', fleet-mac='${MAC_IDLE}')" ;;
          esac

          if [ "$FLEET_IDLE" -gt 0 ]; then
            LABEL=fleet
            WHY="$FLEET_IDLE fleet instance(s) online and idle"
          elif [ "$MAC_IDLE" -gt 0 ]; then
            LABEL=fleet-mac
            WHY="no fleet instance is idle; $MAC_IDLE fleet-mac instance(s) online and idle"
          else
            LABEL=fleet
            WHY="no fleet instance is idle, but no fleet-mac instance is online and idle either; the job waits on the PC"
          fi
          echo "runner_label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "::notice::security-review runs on $LABEL: $WHY"

  deterministic:
    needs: choose-runner
    # choose-runner is skipped in a public repo, and a skipped dependency would skip this job
    # too, which here would silently pass a required check without scanning. So: run unless
    # the workflow is cancelled, whatever the chooser did. A failed or skipped chooser reads as
    # an empty label below and falls back to `fleet`.
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event.repository.private && fromJSON(format('["self-hosted","{0}"]', needs.choose-runner.outputs.runner_label || 'fleet')) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # consumer repo at $GITHUB_WORKSPACE
        with:
          fetch-depth: 0 # gitleaks needs full history; fetch-depth: 1 will silently scan ~nothing

      - uses: actions/checkout@v4 # central repo (helpers + SKILL.md)
        with:
          repository: Aethrix-Labs/fleet-skills
          path: .fleet-ci
          ref: main
          token: ${{ secrets.FLEET_SKILLS_PAT }} # fleet-skills is private; default GITHUB_TOKEN can't cross repos

      - name: Install gitleaks
        run: |
          set -ex
          GITLEAKS_VERSION=8.24.3
          # The job may land on the PC (Linux x86_64) or the Mac (Darwin arm64), so resolve the
          # release asset instead of hardcoding it. gitleaks' asset vocabulary is NOT uname's:
          # linux/darwin for the OS, x64/arm64 for the architecture (x86_64 -> x64, not amd64).
          # An unmapped value fails here, loudly, rather than guessing an asset that 404s or,
          # worse, downloads one that runs on the wrong architecture.
          case "$(uname -s)" in
            Linux)  GL_OS=linux ;;
            Darwin) GL_OS=darwin ;;
            *) echo "::error::Install gitleaks: no release asset mapping for OS '$(uname -s)'"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64)        GL_ARCH=x64 ;;
            arm64|aarch64) GL_ARCH=arm64 ;;
            *) echo "::error::Install gitleaks: no release asset mapping for architecture '$(uname -m)'"; exit 1 ;;
          esac
          # Tool cache, not /usr/local/bin: the self-hosted runner has no sudo. Cached per
          # runner by version AND os_arch, so only the first run on each runner downloads and
          # one cache entry can never serve the wrong architecture.
          DIR="${RUNNER_TOOL_CACHE}/gitleaks/${GITLEAKS_VERSION}/${GL_OS}_${GL_ARCH}"
          if [ ! -x "$DIR/gitleaks" ]; then
            URL="https://github.com/zricethezav/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${GL_OS}_${GL_ARCH}.tar.gz"
            # zricethezav (the original org) hosts release artifacts; the
            # gitleaks/gitleaks rename's redirect does NOT cover asset URLs.
            # `curl -fsSL` fails loudly on 404 instead of silently downloading
            # an HTML error page that tar then chokes on.
            mkdir -p "$DIR"
            curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "$URL"
            tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$DIR" gitleaks
            rm -f "$RUNNER_TEMP/gitleaks.tar.gz"
          fi
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/gitleaks" version

      - name: Install uv (runs Semgrep)
        run: |
          set -ex
          # The self-hosted runner's python3 has no pip/venv, so Semgrep runs through uvx
          # (uv builds its own environments). Same path on ubuntu-latest.
          UV_VERSION=0.12.19
          DIR="${RUNNER_TOOL_CACHE}/uv/${UV_VERSION}"
          if [ ! -x "$DIR/uv" ]; then
            mkdir -p "$DIR"
            curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh"               | env UV_INSTALL_DIR="$DIR" UV_NO_MODIFY_PATH=1 sh
          fi
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/uv" --version

      - name: Run gitleaks
        run: |
          # The fleet baseline config is always the foundation: it carries the full
          # default ruleset (`[extend] useDefault = true`) plus the fleet path
          # allowlists (docs/mockups/**, .gitleaksignore — §17.11). A consumer
          # repo may ALSO commit a root .gitleaks.toml to
          # allowlist its own confirmed false positives (public-by-design tokens,
          # synthetic test fixtures). gitleaks loads exactly ONE config file, so we
          # OVERLAY the repo's allowlist onto the baseline at runtime instead of
          # choosing one or the other.
          #
          # Why overlay rather than swap to the repo config: swapping would let a
          # repo whose .gitleaks.toml omits `[extend] useDefault = true` silently
          # scan with zero rules (a coverage regression), and would let a repo
          # disable org-mandated rules. Overlaying keeps default scanning fully on
          # for every repo while honoring per-repo allowlists across the entire
          # git history (inline `gitleaks:allow` hints do NOT apply retroactively to
          # earlier commits, so a config allowlist is the only durable suppression
          # for a triaged historical false positive). See STANDARDS §17.11.
          CONFIG=.fleet-ci/ci/security-review/gitleaks.toml
          if [ -f .gitleaks.toml ]; then
            cp "$CONFIG" effective-gitleaks.toml
            printf '\n\n# ---- overlay: consumer repo .gitleaks.toml (allowlist only) ----\n' >> effective-gitleaks.toml
            # Append only the consumer config's ALLOWLIST content. Drop its own
            # `title` and `[extend]` block so they don't collide with the baseline's
            # keys (duplicate TOML keys are a parse error) and so a repo can never
            # weaken the baseline ruleset — repos may add allowlists, not remove
            # rules. gitleaks accepts a singular `[allowlist]` and array `[[allowlists]]`
            # side by side, so the baseline's `[[allowlists]]` and the overlay's
            # allowlist tables all apply.
            awk '
              /^[[:space:]]*\[/ {
                if ($0 ~ /^[[:space:]]*\[extend\][[:space:]]*$/) { skip = 1; next }
                else { skip = 0 }
              }
              skip { next }
              /^[[:space:]]*title[[:space:]]*=/ { next }
              { print }
            ' .gitleaks.toml >> effective-gitleaks.toml
            CONFIG=effective-gitleaks.toml
            echo "::notice::Overlaid consumer .gitleaks.toml allowlist onto the fleet baseline."
          fi
          gitleaks detect \
            --source . \
            --config "$CONFIG" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Semgrep
        run: |
          # Pinned so a Semgrep release can't change findings under us; bump deliberately.
          # --exclude .fleet-ci: the helper checkout lives inside the workspace and is not the PR's code.
          uvx --from 'semgrep==1.178.0' semgrep --config p/security-audit --exclude docs/mockups --exclude .gitleaksignore --exclude .fleet-ci --json --output semgrep-results.json || true

      # --- DEP-AUDIT VARIANT (pick ONE; delete the others) ---

      # npm:
      - name: Dep audit (npm)
        run: npm audit --omit=dev --json > npm-audit.json || true

      # pnpm:  (also requires `- uses: pnpm/action-setup@v4` BEFORE this step)
      # - name: Dep audit (pnpm)
      #   run: pnpm audit --json > npm-audit.json || true

      # yarn (Berry):
      # - name: Dep audit (yarn)
      #   run: yarn npm audit --json --recursive > npm-audit.json || true

      # non-Node: delete this step AND the "Fail on critical" step below.
      # --- end DEP-AUDIT VARIANT ---

      - name: Fail on critical dep-audit findings
        run: |
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit.json)
          echo "dep-audit: critical=$CRITICAL high=$HIGH"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::$CRITICAL critical dep-audit findings — blocking"
            exit 1
          fi

      - name: Aggregate deterministic findings
        if: always()
        run: |
          python3 .fleet-ci/ci/security-review/aggregator.py \
            --gitleaks gitleaks.sarif \
            --semgrep semgrep-results.json \
            --npm-audit npm-audit.json \
            --output deterministic-findings.json

      - name: Upload deterministic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-findings
          path: |
            gitleaks.sarif
            semgrep-results.json
            npm-audit.json
            deterministic-findings.json
          if-no-files-found: ignore

  semantic:
    # Same host as the deterministic job: both read the one label choose-runner emitted.
    runs-on: ${{ github.event.repository.private && fromJSON(format('["self-hosted","{0}"]', needs.choose-runner.outputs.runner_label || 'fleet')) || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [choose-runner, deterministic]
    if: always() # run the semantic step even on deterministic failure — triage whatever the deterministic tools found
    permissions:
      contents: read
      pull-requests: write # write needed by pr-body-composer to PATCH the PR body via the GitHub REST API
      id-token: write # required by anthropics/claude-code-action@v1 for OIDC token exchange
    steps:
      - uses: actions/checkout@v4 # consumer repo at $GITHUB_WORKSPACE
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4 # central repo (helpers + SKILL.md)
        with:
          repository: Aethrix-Labs/fleet-skills
          path: .fleet-ci
          ref: main
          token: ${{ secrets.FLEET_SKILLS_PAT }} # fleet-skills is private; default GITHUB_TOKEN can't cross repos

      - name: Download deterministic findings
        uses: actions/download-artifact@v4
        with:
          name: deterministic-findings

      - name: Conditional gate (§3.3)
        id: gate
        run: |
          python3 .fleet-ci/ci/security-review/should-run-semantic.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --deterministic-findings deterministic-findings.json

      - name: Run Claude semantic review
        if: steps.gate.outputs.run == 'true'
        id: semantic
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            You are running as the security-review semantic step in CI.

            Read `.fleet-ci/ci/security-review/SKILL.md` and follow it
            exactly. It defines the three semantic checks, the triage rules,
            and the required output schema.

            Runtime context:
            - Working directory has the full repo (fetch-depth: 0).
            - PR diff: get it with `git diff origin/${{ github.base_ref }}...HEAD`
              or read $GITHUB_BASE_REF / $GITHUB_HEAD_REF.
            - Deterministic-tools output: `deterministic-findings.json` is in
              the working directory.
            - Output: write `semantic-findings.json` in the working directory
              matching the schema in SKILL.md exactly. The downstream step
              parses this file to gate the workflow.

            Do not ask questions. Produce the JSON.
          # Exact id, not an alias (DECISIONS 2026-10-13): no hub is in this workflow's trigger path
          # (a PR event), so the YAML names the model that ran. It matches what /settings resolves to.
          claude_args: |
            --model claude-sonnet-5-5
            --effort medium
            --max-turns 25
            --allowedTools Read,Bash,Write

      - name: Emit security-review queue entry (semantic failure)
        if: failure() && steps.semantic.outcome == 'failure' && steps.gate.outputs.run == 'true'
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .fleet-ci/ci/security-review/queue-emit.py \
            --semantic-failed \
            --fail-reason "Semantic step failed; see workflow run for details"

      - name: Fail on critical semantic findings
        if: success() && steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f semantic-findings.json ]; then
            echo "::error::semantic-findings.json not produced by Claude step"
            exit 1
          fi
          CRITICAL=$(jq '.summary.critical // 0' semantic-findings.json)
          IMPORTANT=$(jq '.summary.important // 0' semantic-findings.json)
          ADVISORY=$(jq '.summary.advisory // 0' semantic-findings.json)
          echo "semantic: critical=$CRITICAL important=$IMPORTANT advisory=$ADVISORY"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::$CRITICAL critical semantic findings — blocking merge"
            exit 1
          fi

      - name: Note skipped semantic review
        if: steps.gate.outputs.run != 'true'
        run: |
          echo "semantic: skipped per §3.3 conditional rules."
          echo "${{ steps.gate.outputs.reasons }}"

      - name: Compose PR body section
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ steps.gate.outputs.run }}" != "true" ]; then
            python3 .fleet-ci/ci/security-review/pr-body-composer.py \
              --deterministic-findings deterministic-findings.json \
              --semantic-findings semantic-findings.json \
              --semantic-skipped \
              --skip-reason "${{ steps.gate.outputs.reasons }}"
          else
            python3 .fleet-ci/ci/security-review/pr-body-composer.py \
              --deterministic-findings deterministic-findings.json \
              --semantic-findings semantic-findings.json
          fi

      - name: Upload semantic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-findings
          path: semantic-findings.json
          if-no-files-found: ignore

      - name: Emit security-review queue entry
        if: always()
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .fleet-ci/ci/security-review/queue-emit.py \
            --deterministic-findings deterministic-findings.json \
            --semantic-findings semantic-findings.json

  # M26.3 (DECISIONS.md 2026-06-03) — CI-green trigger for the low-risk
  # autonomous self-merge path. The fleet's CI topology has security-review as
  # a SEPARATE org-level required workflow (not a check inside the implementer's
  # own run), so a low-risk PR is NOT mergeable at tick-report time. The hub
  # therefore holds the session in `paused-merge` and waits for a CI-completion
  # event to release it (AUTONOMOUS_DEV.md §3 step 5 "event-released" shape;
  # MERGE_FLOW_SPEC.md §5 option (a)). This job is that event: when the required
  # workflow goes green it pings the hub, which correlates the PR to a waiting
  # `paused-merge` session and fires the synchronous `mergePr()`.
  #
  # `needs: [deterministic, semantic]` + the success gate on both means this
  # job runs ONLY when both gating jobs succeeded — i.e. the required workflow
  # is green. A critical dep-audit or semantic finding fails its job, so this
  # never fires on a red PR. A legitimately-skipped semantic review (§3.3 gate)
  # still leaves the semantic job green, so green-with-skip correctly pings.
  #
  # choose-runner is in `needs` only to read its label, and it is skipped in a public repo,
  # which would skip a plain `if: success()` job. So the condition names the two gating jobs
  # and ignores the chooser: the same "both gating jobs succeeded" meaning, spelled out.
  merge-ready:
    runs-on: ${{ github.event.repository.private && fromJSON(format('["self-hosted","{0}"]', needs.choose-runner.outputs.runner_label || 'fleet')) || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: [choose-runner, deterministic, semantic]
    if: ${{ !cancelled() && needs.deterministic.result == 'success' && needs.semantic.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Notify hub that the PR is merge-ready
        env:
          # m2m bearer — same scoped secret M21 uses for tick-reports
          # (STANDARDS §14; OAuth = user context, m2m secret = system context).
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          HUB_URL: https://sethgibson.com
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Best-effort by design: the PR is green and merge-worthy regardless
          # of whether this ping lands. A non-2xx or transport failure is
          # recovered by the hub's defensive `paused-merge` reconcile — so this
          # step must NEVER fail the required workflow (no `set -e`, no exit 1).
          if [ -z "$AUTONOMOUS_TICK_TOKEN" ]; then
            echo "::warning::AUTONOMOUS_TICK_TOKEN not set — skipping merge-ready ping"
            exit 0
          fi
          code=$(curl -sS -m 15 -o "$RUNNER_TEMP/merge-ready.out" -w '%{http_code}' \
            -X POST "$HUB_URL/api/autonomous/merge-ready" \
            -H "Authorization: Bearer $AUTONOMOUS_TICK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"pr_url\":\"$PR_URL\"}") \
            || { echo "::warning::merge-ready ping could not reach the hub — reconcile will recover"; exit 0; }
          echo "merge-ready → HTTP $code for $PR_URL"
          cat "$RUNNER_TEMP/merge-ready.out" 2>/dev/null || true
          if [ "$code" -ge 400 ]; then
            echo "::warning::merge-ready returned HTTP $code — hub reconcile will recover"
          fi
