name: lite-planner (callable)

# No-design planning for an APPROVED auto-feature suggestion (STANDARDS §24.6).
# The hub workflow_dispatches the thin per-product .github/workflows/lite-planner.yml
# (on auto-feature approval), which `uses:` this. Flow: fetch the approved entry ->
# Step-0 size/risk re-check (bounce if not "small") -> plan ONE no-design milestone ->
# plan-reviewer -> commit PLANNING.md via ci-commit (low-tier auto-ship). The
# autonomous implementer loop builds it; this skill never implements.
#
# Requires the lite-planner bundle vended to fleet-skills `ci/lite-planner/`,
# reached here at .fleet-ci/ci/lite-planner/.

on:
  workflow_call:
    inputs:
      product_slug:
        description: "Product slug (defaults to repo basename)."
        type: string
        required: false
        default: ""
      hub_url:
        description: "Hub base URL for the entry fetch + queue POST. Defaults to https://sethgibson.com."
        type: string
        required: false
        default: "https://sethgibson.com"
      queue_entry_id:
        description: "Approved auto-feature entry id; lite-planner fetches goal + recommendation (scope/acceptance) from the hub."
        type: string
        required: true
      model:
        description: "Claude model for the agent: an alias (sonnet|opus|haiku|fable) or an exact id. Chosen per run by the hub; the default is the pre-parameterization pin."
        type: string
        required: false
        default: "claude-sonnet-5-5"
      effort:
        description: "Reasoning effort for the agent: low|medium|high|xhigh|max. Chosen per run by the hub."
        type: string
        required: false
        default: "medium"

permissions:
  contents: write       # commit the PLANNING.md edit (low-tier auto-ship)
  pull-requests: write  # ci-commit opens the PR
  id-token: write       # required by anthropics/claude-code-action@v1

concurrency:
  # Serialize per product so two approvals can't race the PLANNING.md edit.
  group: lite-planner-${{ github.repository }}
  cancel-in-progress: false

jobs:
  lite-planner:
    # Fleet PC (WSL2) self-hosted runner. See ~/products/docs/SELF_HOSTED_RUNNER.md.
    runs-on: [self-hosted, linux, fleet]
    # STANDARDS §28.6. Observed max 14m; --max-turns 180 is ~60m at the implementer's
    # worst observed ~20s/turn, so a legitimately long plan is never cut off.
    timeout-minutes: 60
    env:
      # One source for the turn cap: the agent step's --max-turns and the failure guard's
      # "did it run out of turns?" test both read it, so they cannot drift apart.
      AGENT_MAX_TURNS: "180"
    steps:
      - uses: actions/checkout@v4        # consumer repo at $GITHUB_WORKSPACE
        with:
          fetch-depth: 0                 # planner reads code + git history

      - uses: actions/checkout@v4        # fleet-skills (CI skills under ci/)
        with:
          repository: Aethrix-Labs/fleet-skills
          path: .fleet-ci
          ref: main
          token: ${{ secrets.FLEET_SKILLS_PAT }}

      - name: Set up gh CLI
        run: gh --version

      - name: Configure git for commits
        run: |
          git config user.name  "lite-planner[bot]"
          git config user.email "lite-planner@aethrix-labs.local"

      - name: Run lite-planner agent
        id: agent
        uses: anthropics/claude-code-action@v1
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          LP_PRODUCT_SLUG: ${{ inputs.product_slug }}
          LP_HUB_URL: ${{ inputs.hub_url }}
          LP_QUEUE_ENTRY_ID: ${{ inputs.queue_entry_id }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running as the **lite-planner agent** in CI.

            Read `.fleet-ci/ci/lite-planner/SKILL.md` and follow it exactly.

            The APPROVED auto-feature is queue entry $LP_QUEUE_ENTRY_ID — fetch it
            from the hub to read its `goal` (value case) and `recommendation`
            (SCOPE + ACCEPTANCE sketch).

            Step 0 safety valve: re-verify it is genuinely "small" (no new screens /
            no design-system divergence, ONE implementer milestone, no
            auth/payments/PII/migration). If it FAILS any clause, emit the `exception`
            queue entry the skill specifies and STOP — do not write a plan.

            Otherwise: plan ONE no-design milestone (with the `**Auto-feature:**`
            marker), run plan-reviewer, then commit the PLANNING.md edit by reading
            `.fleet-ci/ci/ci-commit/SKILL.md` and following it (Tier Low, auto-ship).
            Do NOT implement — the autonomous implementer loop builds it.

            Runtime context:
            - Working directory has the full consumer repo (fetch-depth: 0).
            - Product slug: $LP_PRODUCT_SLUG (or derive from $GITHUB_REPOSITORY).
            - Hub base URL: $LP_HUB_URL.
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --max-turns ${{ env.AGENT_MAX_TURNS }}
            --allowedTools Read,Bash,Write,Edit,Glob,Grep
            # --max-turns 180 matches implementer-callable. lite-planner shares the
            # same commit tax (plan-reviewer up to 3 passes -> ci-commit ->
            # canonical-doc-update across docs -> tier-classify) plus open-ended
            # repo exploration to map the candidate; 80 left no headroom and a
            # correctly-sized small auto-feature still over-ran it (run 27623308777,
            # 2026-06-16). Raised 80 -> 100 on 2026-06-16, 100 -> 180 on 2026-07-07
            # (parity with the implementer's 130 -> 180 turn-budget recalibration).
            # The durable fix is the skill's Step-0 cheap bounce + bounded
            # exploration (and plan-reviewer's margin sizing), not raising further.

      - name: Emit failure queue entry on agent death
        # The agent step failed before its own exit path — surface it in the decision queue so an
        # approved auto-feature doesn't vanish. The cause is read off the agent's result object, not assumed.
        id: failure-entry
        if: failure() && steps.agent.outcome == 'failure'
        env:
          # The action's transcript (a JSON array of SDK messages; the last `result` message carries
          # subtype / is_error / num_turns). Empty when the action died before writing it.
          AGENT_EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          LP_PRODUCT_SLUG: ${{ inputs.product_slug }}
          LP_HUB_URL: ${{ inputs.hub_url }}
          LP_QUEUE_ENTRY_ID: ${{ inputs.queue_entry_id }}
        run: |
          SLUG="${LP_PRODUCT_SLUG:-$(basename "$GITHUB_REPOSITORY")}"
          HUB="${LP_HUB_URL:-https://sethgibson.com}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Phase breadcrumb — the agent overwrites this single-line marker at each
          # phase boundary (lite-planner SKILL.md "Phase breadcrumb"). On a
          # max-turns/crash death the agent never reached its exit path, so this
          # file is the only signal for WHERE it died. Localizes the failure to a
          # phase (fetch | size-recheck | mapping | planning | adversary |
          # committing) instead of a bare death. Absent → "unknown". Mirrors
          # implementer-callable's handler (2026-06-16 parity).
          PHASE_FILE="${GITHUB_WORKSPACE:-.}/.lite-planner-phase"
          LAST_PHASE="unknown"
          if [ -f "$PHASE_FILE" ]; then
            LAST_PHASE="$(tr -d '\r\n' < "$PHASE_FILE" | head -c 200)"
          fi
          echo "::notice::lite-planner-callable: workflow failed at phase=${LAST_PHASE}"

          # Run-id breadcrumb — written by the skill at the moment it generates the loop's run_id
          # (STANDARDS §18.1a), named after the agent like the phase marker above. The packet carries
          # it so the queue entry cross-links to the agent's activity trail. Absent, empty or
          # malformed → omit the field and say so in `attempts`. NEVER substitute $GITHUB_RUN_ID:
          # that names the workflow run, not the agent's loop, and a packet keyed to the wrong
          # identifier space reads as a confident empty trail.
          RUN_ID_FILE="${GITHUB_WORKSPACE:-.}/.lite-planner-run-id"
          AGENT_RUN_ID=""
          if [ -f "$RUN_ID_FILE" ]; then
            AGENT_RUN_ID="$(tr -d '\r\n' < "$RUN_ID_FILE" | head -c 128)"
          fi
          RUN_ID_FIELD=""
          RUN_ID_NOTE=""
          case "$AGENT_RUN_ID" in
            "")
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.lite-planner-run-id) was missing or empty, so this entry carries no run_id and is not linked to an activity trail." ;;
            *[!A-Za-z0-9_-]*)
              # Interpolated into the JSON body below; anything outside a plain id is not trusted.
              AGENT_RUN_ID=""
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.lite-planner-run-id) was malformed, so this entry carries no run_id and is not linked to an activity trail." ;;
            *)
              RUN_ID_FIELD="\"run_id\": \"$AGENT_RUN_ID\"," ;;
          esac

          # What the agent step actually reported. claude-code-action writes its transcript to
          # $RUNNER_TEMP/claude-execution-output.json and prints a {"type":"result", ...} object to the
          # log. Asserting "max-turns, crash, or infra" without looking names a cause the log can
          # contradict, so branch on the result object; where it cannot be read, say so.
          #   max-turns   subtype error_max_turns, or num_turns at/near the cap
          #   crash       is_error true, a non-success subtype, or no result object in the transcript
          #   clean-exit  subtype success, is_error false, turns well under the cap
          #   unknown     transcript or jq unavailable, or a field would not parse
          EXEC_FILE="${AGENT_EXECUTION_FILE:-}"
          if [ -z "$EXEC_FILE" ]; then
            EXEC_FILE="${RUNNER_TEMP:-}/claude-execution-output.json"
          fi
          CAP="${AGENT_MAX_TURNS:-}"
          case "$CAP" in ""|*[!0-9]*) CAP="" ;; esac
          R_KIND=""; R_SUBTYPE=""; R_ERR=""; R_TURNS=""; R_BG=""; R_DONE=""; R_STOP=""
          if [ -f "$EXEC_FILE" ] && command -v jq >/dev/null 2>&1; then
            R_LINE="$(jq -r -s '
                [.[] | if type == "array" then .[] else . end | select(type == "object" and .type == "result")] | last
                | if . == null then "none"
                  else ["result", (.subtype | tostring), (.is_error | tostring), (.num_turns | tostring),
                       ((.subagent_stats | objects | .started_in_background | numbers) // "" | tostring),
                       ((.subagent_stats | objects | .completed | numbers) // "" | tostring),
                       ((.stop_reason | strings) // "")] | join("|")
                  end' "$EXEC_FILE" 2>/dev/null || true)"
            IFS='|' read -r R_KIND R_SUBTYPE R_ERR R_TURNS R_BG R_DONE R_STOP <<< "$R_LINE" || true
            # These land in the JSON body below: keep them to plain tokens.
            R_SUBTYPE="$(printf '%s' "$R_SUBTYPE" | tr -cd 'A-Za-z0-9_-' | head -c 64)"
            case "$R_ERR" in true|false) ;; *) R_ERR="" ;; esac
            case "$R_TURNS" in ""|*[!0-9]*) R_TURNS="" ;; esac
            # subagent_stats is absent on older transcripts: absent or unparseable is no evidence, never 0.
            case "$R_BG" in ""|*[!0-9]*) R_BG="" ;; esac
            case "$R_DONE" in ""|*[!0-9]*) R_DONE="" ;; esac
            R_STOP="$(printf '%s' "$R_STOP" | tr -cd 'A-Za-z0-9_-' | head -c 32)"
          fi
          CAUSE="unknown"
          BG_WAIT=""
          if [ "$R_KIND" = "none" ]; then
            CAUSE="crash"
          elif [ "$R_KIND" = "result" ]; then
            if [ "$R_SUBTYPE" = "error_max_turns" ] || { [ -n "$R_TURNS" ] && [ -n "$CAP" ] && [ "$R_TURNS" -ge $((CAP * 9 / 10)) ]; }; then
              CAUSE="max-turns"
            elif [ "$R_ERR" = "true" ] || { [ -n "$R_SUBTYPE" ] && [ "$R_SUBTYPE" != "success" ]; }; then
              CAUSE="crash"
            elif [ "$R_SUBTYPE" = "success" ] && [ "$R_ERR" = "false" ] && [ -n "$R_TURNS" ] && [ -n "$CAP" ]; then
              CAUSE="clean-exit"
              # Sub-flag, not a fifth cause: the agent dispatched subagents in the background, none had
              # completed, and it ended its turn waiting (STANDARDS 28.6). Needs both fields present.
              if [ -n "$R_BG" ] && [ -n "$R_DONE" ] && [ "$R_BG" -ge 1 ] && [ "$R_DONE" -eq 0 ]; then
                BG_WAIT=1
              fi
            fi
          fi
          echo "::notice::lite-planner-callable: agent result cause=${CAUSE} subtype=${R_SUBTYPE:-?} is_error=${R_ERR:-?} turns=${R_TURNS:-?}/${CAP:-?} bg_started=${R_BG:-?} bg_completed=${R_DONE:-?} stop_reason=${R_STOP:-?}"

          # The transcript is the only record of the agent's final message ("why did it stop"); the
          # runner's temp dir is wiped at job end. Hand it to the upload step below.
          TRANSCRIPT_NOTE=""
          if [ -f "$EXEC_FILE" ]; then
            TRANSCRIPT_NOTE=" The agent's full transcript is attached to the run as the artifact lite-planner-transcript-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1} (7-day retention); its last result message is the agent's own account of why it stopped."
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "transcript_path=$EXEC_FILE" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Only what the result object supports is asserted; the phase advice (exploration over-ran,
          # loop thrashing) is reserved for an actual max-turns death. Keep the quoting simple: these
          # strings are interpolated into the JSON body below.
          case "$CAUSE" in
            max-turns)
              ATTEMPT="claude-code-action used ${R_TURNS} of ${CAP} turns (result subtype ${R_SUBTYPE}), at or near its turn cap, before the skill's own exit path."
              RECO="Died at phase '${LAST_PHASE}'. mapping → exploration likely over-ran the budget (the candidate's scope/acceptance is the plan — don't re-derive the whole repo); planning/adversary → the candidate may not be 'small' (Step 0 should have bounced it to feature-spec / design) or the plan-reviewer loop is thrashing; committing → check the ci-commit / canonical-doc-update tail. If the candidate was genuinely too big for auto-feature, route it to feature-spec / design instead." ;;
            crash)
              if [ "$R_KIND" = "none" ]; then
                ATTEMPT="claude-code-action ended without a result object in its transcript (a crash or infra error) before the skill's own exit path."
              else
                ATTEMPT="claude-code-action ended in error (result subtype ${R_SUBTYPE:-unknown}, is_error ${R_ERR:-unknown}, ${R_TURNS:-unknown} of ${CAP:-unknown} turns) before the skill's own exit path."
              fi
              RECO="Died at phase '${LAST_PHASE}'. This reads as a crash or infra error, not a budget death: re-dispatching is apt. If it recurs at the same phase, read the run log before changing anything." ;;
            clean-exit)
              if [ -n "$BG_WAIT" ]; then
                # Signature of STANDARDS 28.6 (a headless agent has no next turn).
                ATTEMPT="The agent's result object reports success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap, stop_reason ${R_STOP:-unreported}) yet the step is marked failed: the agent spawned ${R_BG} subagent(s) in the background, none completed (${R_DONE} completed), and it ended its turn waiting for one, most likely the plan-reviewer. A headless session has no next turn, so that ended the session without running its exit path (STANDARDS 28.6)."
                RECO="Died at phase '${LAST_PHASE}'. Not a budget or infra failure: do not bounce the candidate to feature-spec or design as too big on this evidence. The fix is the skill's dispatch instruction (Step 3, STANDARDS 28.6), and a re-dispatch before that fix lands stops the same way. Nothing is parked: lite-planner holds no WIP checkpoint, so the lost work is the drafted plan, which only ever lived in the runner workspace. The agent's final message in the transcript artifact should say what it was waiting for."
              else
                ATTEMPT="The agent's result object reports success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap) yet the step is marked failed."
                RECO="Not a budget or infra failure. Read the run log around the end of the agent step, and the agent's final message in the transcript artifact, to see why the step was marked failed (last phase '${LAST_PHASE}')."
              fi ;;
            *)
              ATTEMPT="claude-code-action failed before the skill's own exit path; cause unknown (the agent step's result object could not be read from this job)."
              RECO="Cause unknown - read the run log (and the transcript artifact, if one is attached) before choosing between re-dispatching and re-planning manually. The last phase reached was '${LAST_PHASE}'." ;;
          esac
          ATTEMPT="${ATTEMPT} Last phase reached: ${LAST_PHASE}. Run: ${RUN_URL}"
          ATTEMPT="${ATTEMPT}${RUN_ID_NOTE}${TRANSCRIPT_NOTE}"

          if [ -n "$QUEUE_SERVICE_ROLE_KEY" ]; then
            REQUEST_ID=$(printf '%s' "${GITHUB_RUN_ID}lite-planner-failed" | sha256sum | cut -d' ' -f1)
            curl -sf -X POST "${HUB}/api/v1/queue/entries" \
              -H "Content-Type: application/json" \
              -H "x-service-role-key: $QUEUE_SERVICE_ROLE_KEY" \
              -H "User-Agent: aethrix-fleet-ci/1.0 (lite-planner-callable)" \
              -d "{
                \"request_id\": \"$REQUEST_ID\",
                \"entry_type\": \"exception\",
                \"variant\": \"lite-planner-failed\",
                ${RUN_ID_FIELD}
                \"agent_name\": \"lite-planner\",
                \"product_slug\": \"$SLUG\",
                \"title\": \"[$SLUG] lite-planner failed on auto-feature ${LP_QUEUE_ENTRY_ID}\",
                \"goal\": \"Plan the approved auto-feature into one no-design milestone\",
                \"attempts\": [\"$ATTEMPT\"],
                \"artifacts\": [{\"label\": \"Workflow run\", \"href\": \"$RUN_URL\", \"artifact_type\": \"doc\"}],
                \"ask\": \"Inspect the run log; re-plan manually or re-dispatch\",
                \"recommendation\": \"$RECO\"
              }" \
            || echo "::warning::lite-planner-callable: failure queue-entry POST failed"
          else
            echo "::warning::lite-planner-callable: QUEUE_SERVICE_ROLE_KEY missing; skipping failure queue entry"
          fi

      - name: Upload the agent transcript (failure path only)
        # The agent step runs with show_full_output: false, so the log carries the result object but
        # not the agent's final message, and the transcript is deleted with the runner's temp dir.
        # An artifact rather than show_full_output: true — that would print every tool result,
        # secrets included, into a log anyone with read access can open. The guard above sets
        # `transcript_path` only when it ran, i.e. the agent step failed.
        if: always() && steps.failure-entry.outputs.transcript_path != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lite-planner-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.failure-entry.outputs.transcript_path }}
          if-no-files-found: warn
          retention-days: 7
