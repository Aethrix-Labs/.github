name: model-watch

# Weekly: publish the model catalog to the hub and flag any agent pinned to an
# older model than Anthropic now lists (MODEL_SELECTION_PROPOSAL.md §3; STANDARDS §14).
# The staleness check reads the hub's STORED pins, not workflow YAML. Deterministic —
# no Claude call, no Anthropic spend. Posts ONE deduped `follow-up` queue entry
# (variant `model-stale`) when an exact-id pin is behind (request_id = hash of the
# newest ids + the stale pins, so an unchanged state never re-nags).
# Fails loudly (red run) if the models page can't be parsed or the pins can't be read,
# posting nothing so the hub keeps last-known-good; it never reports an all-clear it
# couldn't verify.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the queue entry instead of posting it."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: model-watch
  cancel-in-progress: false

jobs:
  model-watch:
    # STANDARDS §28.6: this repo is PUBLIC and the org runner group disallows public repos, so a
    # self-hosted label here is never claimed (the job sits `queued`, no log). GitHub-hosted instead;
    # same as security-review.yml. Stdlib Python, no private checkout, so no fleet hardware is needed.
    runs-on: ubuntu-latest
    # STANDARDS §28.6. Two HTTP GETs, a file scan and at most two POSTs.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s .github/scripts/model-watch -v

      - name: Publish the catalog and check pins against the latest releases
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          EXTRA=""
          if [ "$DRY_RUN" = "true" ]; then EXTRA="--dry-run"; fi
          python3 .github/scripts/model-watch/check.py --repo "$GITHUB_REPOSITORY" $EXTRA
