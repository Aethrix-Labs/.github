name: implementer (callable)

on:
  workflow_call:
    inputs:
      product_slug:
        description: "Product slug (defaults to repo basename)"
        type: string
        required: false
        default: ""
      session_id:
        description: "Autonomous session ID from the hub play-button loop."
        type: string
        required: false
        default: ""
      hub_url:
        description: "Hub base URL for posting tick-reports. Defaults to https://sethgibson.com."
        type: string
        required: false
        default: "https://sethgibson.com"
      target_kind:
        description: "Directed target kind from the hub picker: 'backlog' | 'milestone'. Empty trips the skill's Guard 2 — manual dispatch is unsupported."
        type: string
        required: false
        default: ""
      target_ref:
        description: "Directed target ref: BL-<n> for a backlog item, M<n> for a milestone."
        type: string
        required: false
        default: ""
      runner_label:
        description: "Self-hosted runner label to dispatch to (STANDARDS §9 surface routing). 'fleet' = PC (web/backend), 'fleet-mac' = Mac (mobile/both; has simulator)."
        type: string
        required: false
        default: "fleet"
      model:
        description: "Claude model for the agent: an alias (sonnet|opus|haiku|fable) or an exact id. Chosen per run by the hub; the default is the pre-parameterization pin."
        type: string
        required: false
        default: "claude-sonnet-5-5"
      effort:
        description: "Reasoning effort for the agent: low|medium|high|xhigh|max. Chosen per run by the hub."
        type: string
        required: false
        default: "medium"
      # TODO(STAFF_ENGINEER_PROPOSAL §7, queue-redesign Phase 6): staff_direction is declared
      # ahead of the staff-engineer agent so product repos forward it in the same pass as
      # model/effort. It is forwarded to the agent step as IMPLEMENTER_STAFF_DIRECTION but NOT yet
      # referenced in the prompt or read by implementer/SKILL.md — wire both when Phase 6 lands.
      staff_direction:
        description: "Diagnosis and direction from a staff-engineer `return`; authoritative context for a retry. Empty = ordinary run."
        type: string
        required: false
        default: ""

permissions:
  contents: write # commit + push from the implementer agent
  pull-requests: write # gh pr create / merge
  id-token: write # required by anthropics/claude-code-action@v1

concurrency:
  # Serialize per product — never run two implementer invocations on the same
  # repo at once. Default `cancel-in-progress: false` so a queued second run
  # waits rather than killing the in-flight one.
  group: implementer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  implementer:
    # Self-hosted runner, label set per dispatch (STANDARDS §9 surface routing):
    # 'fleet' (default) is the Fleet PC (WSL2, web/backend); 'fleet-mac' is Seth's
    # Mac (mobile/both; has the simulator). Avoids GitHub-hosted minute billing.
    # See ~/products/docs/SELF_HOSTED_RUNNER.md.
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    # STANDARDS §28.6. Observed max 60m on either runner (a 181-turn max-turns death;
    # 180 turns ~= 50-60m). 120 = 2x.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4 # consumer repo at $GITHUB_WORKSPACE
        with:
          fetch-depth: 0 # needed for full git history (commit skill reads log)

      - uses: actions/checkout@v4 # fleet-skills repo (CI skills under ci/)
        with:
          repository: Aethrix-Labs/fleet-skills
          path: .fleet-ci
          ref: main
          token: ${{ secrets.FLEET_SKILLS_PAT }} # fleet-skills is private; default GITHUB_TOKEN can't cross repos

      - name: Set up gh CLI
        # The commit skill uses `gh pr create`, `gh pr merge --auto`, etc.
        # `gh` is preinstalled on ubuntu-latest runners; nothing to do.
        run: gh --version

      - name: Configure git for commits
        run: |
          git config user.name  "implementer-agent[bot]"
          git config user.email "implementer-agent@aethrix-labs.local"

      - name: Probe verification tooling (Playwright / Maestro / simulator)
        # Records what THIS runner can actually launch, so the run log and the agent start from
        # facts instead of the runner label's promise (STANDARDS §23.9 "When the tool can't run").
        # Advisory: never a gate and never fails the job. The agent's own probe run is authoritative
        # (it can heal, and it is scoped to the repo's Playwright version). A missing script only means
        # the fleet-skills vending PR has not landed yet; that must not break CI for every product.
        # Bounded: a hung probe must not hold this product's concurrency group for the default 6h.
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          # Through env, never interpolated into the script body.
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          PROBE=".fleet-ci/ci/implementer/tooling-probe.mjs"
          if [ ! -f "$PROBE" ]; then
            echo "::notice::tooling-probe not present in .fleet-ci (fleet-skills vending not landed yet); skipping"
            exit 0
          fi
          if ! command -v node >/dev/null 2>&1; then
            echo "::notice::node is not on PATH for this runner; skipping the tooling probe"
            exit 0
          fi
          # The probe prints only single-line values behind fixed prefixes, so its output cannot start a
          # workflow command (`::…`) at column 0.
          node "$PROBE" --runner --github-env 2> "$RUNNER_TEMP/tooling-probe.txt" >/dev/null || true
          cat "$RUNNER_TEMP/tooling-probe.txt"
          {
            echo "### Verification tooling on \`${RUNNER_LABEL}\`"
            echo '```'
            cat "$RUNNER_TEMP/tooling-probe.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/tooling-probe.txt"

      - name: Run implementer agent
        id: agent
        uses: anthropics/claude-code-action@v1
        env:
          # Used by the implementer's queue packets + activity records and the
          # commit skill's queue emission path (per STANDARDS §14
          # multi-storage credentials). Same secret security-review uses.
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          # Tick-report auth token (separate from QUEUE_SERVICE_ROLE_KEY per m2m convention).
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          # Shared password for the local-only test accounts (vault `fleet-test-local`,
          # STANDARDS §23.5). Product seed scripts (`seed:test`, `seed:review`, …) and
          # UI self-checks that sign in to the local stack read it. Empty when the org
          # secret is unset — scripts that need it fail fast with their own message.
          FLEET_TEST_PASSWORD: ${{ secrets.FLEET_TEST_PASSWORD }}
          # Dispatch payload passed through to the agent via env.
          IMPLEMENTER_PRODUCT_SLUG: ${{ inputs.product_slug }}
          IMPLEMENTER_SESSION_ID: ${{ inputs.session_id }}
          IMPLEMENTER_HUB_URL: ${{ inputs.hub_url }}
          # Directed target — required by the skill's Guard 2.
          IMPLEMENTER_TARGET_KIND: ${{ inputs.target_kind }}
          IMPLEMENTER_TARGET_REF: ${{ inputs.target_ref }}
          # Staff-engineer `return` direction (STAFF_ENGINEER_PROPOSAL §7). Empty on ordinary
          # runs. Not yet read by the skill or prompt — see the TODO on the input.
          IMPLEMENTER_STAFF_DIRECTION: ${{ inputs.staff_direction }}
          # Runner-capability flag for the mobile self-check (STANDARDS §23.9
          # Track A). The implementer keys off this flag, not off the milestone's
          # Surface marker directly, so a mobile step that lands on `fleet` (no
          # simulator) does not thrash: it takes the blocked path and the loop is held
          # (`verification-unavailable`, STANDARDS §23.9) — it no longer silently no-ops.
          UI_SELF_CHECK_MOBILE: ${{ inputs.runner_label == 'fleet-mac' && '1' || '0' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running as the **implementer agent** in CI.

            Read `.fleet-ci/ci/implementer/SKILL.md` and follow
            it exactly. It defines the pre-flight guards, the flow (resolve
            the directed target → implement the next unblocked step → invoke
            commit → exit), and the failure modes.

            When ready to commit, read `.fleet-ci/ci/ci-commit/SKILL.md`
            and follow its flow. The commit skill handles tier classification,
            PR body composition, queue emission, and merge routing.

            Runtime context:
            - Working directory has the full consumer repo (fetch-depth: 0).
            - Directed target: $IMPLEMENTER_TARGET_KIND / $IMPLEMENTER_TARGET_REF.
            - Product slug: $IMPLEMENTER_PRODUCT_SLUG (or derive from $GITHUB_REPOSITORY).

            Exit after ONE step. The verify gate is the loop boundary.
            Do not chain into the next step.
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --max-turns 180
            --allowedTools Read,Bash,Write,Edit,Glob,Grep

      - name: Ensure the hub heard back (tick-report guard)
        # Always-run backstop (widened 2026-07-08 from an `if: failure()`-only handler).
        # Fires whenever the skill's `.tick-report-sent` breadcrumb is ABSENT at job end
        # — covering BOTH (a) the agent step dying (crash, infra error) and (b) the step
        # exiting `success` while the agent never sent a tick-report, most importantly a
        # `--max-turns` cutoff: claude-code-action reports max-turns as a SUCCESSFUL
        # step, so the old `if: failure()` form silently missed it and the session
        # stranded until the 30-min reconcile cron force-errored it as "tick-report
        # drop". In both cases the agent produced no in-band queue entry or tick-report:
        # surface the death in the decision queue and tell the orchestrator the tick
        # failed so the session goes `errored` instead of hanging. When the breadcrumb
        # IS present the skill already reported and this guard no-ops.
        # Writes are observability, not gates — POSTs warn-and-continue.
        if: always()
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          IMPLEMENTER_PRODUCT_SLUG: ${{ inputs.product_slug }}
          IMPLEMENTER_SESSION_ID: ${{ inputs.session_id }}
          IMPLEMENTER_HUB_URL: ${{ inputs.hub_url }}
          IMPLEMENTER_TARGET_KIND: ${{ inputs.target_kind }}
          IMPLEMENTER_TARGET_REF: ${{ inputs.target_ref }}
          GH_TOKEN: ${{ github.token }} # merge reconcile below
        run: |
          # If the skill delivered its own tick-report it dropped this breadcrumb —
          # the hub already heard back, so this guard has nothing to do. Absent → fall
          # through and report on the workflow's behalf.
          if [ -f "${GITHUB_WORKSPACE:-.}/.tick-report-sent" ]; then
            echo "::notice::implementer-callable: skill already sent its tick-report; ensure-report guard idle"
            exit 0
          fi

          SLUG="${IMPLEMENTER_PRODUCT_SLUG:-$(basename "$GITHUB_REPOSITORY")}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          HUB="${IMPLEMENTER_HUB_URL:-https://sethgibson.com}"

          # Phase breadcrumb — the agent overwrites this single-line marker at
          # each phase boundary (implementer SKILL.md "Phase breadcrumb"). On a
          # max-turns/crash death the agent never reached its exit path, so this
          # file is the only signal for WHERE it died. Localizes the failure to
          # a phase (step-identified | building | testing | adversary |
          # committing) instead of a bare workflow-failed. Absent → "unknown".
          PHASE_FILE="${GITHUB_WORKSPACE:-.}/.implementer-phase"
          LAST_PHASE="unknown"
          if [ -f "$PHASE_FILE" ]; then
            LAST_PHASE="$(tr -d '\r\n' < "$PHASE_FILE" | head -c 200)"
          fi
          echo "::notice::implementer-callable: workflow failed at phase=${LAST_PHASE}"

          # Merge reconcile (implementer PACKETS.md, workflow-failed).
          # The exit contract is NOT atomic with the commit side effects: on a
          # commit-phase death the PR may have opened, gone green and been merged
          # by the hub while only the in-band tick-report died. Reporting that as
          # workflow-failed tells Seth to retry an already-closed step.
          # Only reachable from `committing` — no PR can exist before it.
          # Best-effort and racy by design; the hub's merge-webhook reconcile
          # stays authoritative. This is the early exit so the common case never
          # shows a spurious retry card.
          RECONCILED=""
          PR_URL=""
          if [ "$LAST_PHASE" = "committing" ]; then
            WORK_BRANCH="$(git -C "${GITHUB_WORKSPACE:-.}" rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
            case "$WORK_BRANCH" in
              ""|HEAD|main|master)
                echo "::notice::implementer-callable: no working branch to reconcile (HEAD=${WORK_BRANCH:-none})" ;;
              *)
                PR_URL="$(gh pr list --head "$WORK_BRANCH" --state merged --limit 1 --json url --jq '.[0].url // empty' 2>/dev/null || true)"
                if [ -n "$PR_URL" ]; then
                  RECONCILED=1
                  echo "::notice::implementer-callable: reconciled - ${PR_URL} merged; the work landed, only the acknowledgment died"
                else
                  echo "::notice::implementer-callable: no merged PR for ${WORK_BRANCH}; genuine mid-commit death"
                fi ;;
            esac
          fi

          # Queue entry — exception, variant `workflow-failed`. request_id is rooted in the
          # GitHub run ID (one entry per failed run; reruns get a new run ID,
          # which is correct — a new failure is a new event). Shape per
          # implementer PACKETS.md § workflow-failed.
          if [ -n "$RECONCILED" ]; then
            echo "::notice::implementer-callable: skipping workflow-failed entry (reconciled); the hub emits completed-unacknowledged off the tick-report"
          elif [ -n "$QUEUE_SERVICE_ROLE_KEY" ]; then
            REQUEST_ID=$(printf '%s' "${GITHUB_RUN_ID}workflow-failed" | sha256sum | cut -d' ' -f1)
            curl -sf -X POST "${HUB}/api/v1/queue/entries" \
              -H "Content-Type: application/json" \
              -H "x-service-role-key: $QUEUE_SERVICE_ROLE_KEY" \
              -H "User-Agent: aethrix-fleet-ci/1.0 (implementer-callable)" \
              -d "{
                \"request_id\": \"$REQUEST_ID\",
                \"entry_type\": \"exception\",
                \"variant\": \"workflow-failed\",
                \"agent_name\": \"implementer\",
                \"product_slug\": \"$SLUG\",
                \"title\": \"[$SLUG] implementer workflow failed on ${IMPLEMENTER_TARGET_REF:-unknown target}\",
                \"goal\": \"Advance ${IMPLEMENTER_TARGET_KIND:-?}/${IMPLEMENTER_TARGET_REF:-?} by one step\",
                \"attempts\": [\"claude-code-action step failed (max-turns, crash, or infra error) before the skill's own exit path; no in-band queue entry or tick-report was sent. Last phase reached: ${LAST_PHASE}. Run: $RUN_URL\"],
                \"ask\": \"Inspect the workflow run log; decide retry, fix the step/criteria, or restructure the target\",
                \"recommendation\": \"Died at phase '${LAST_PHASE}'. building/testing/adversary → the step is likely over-sized for the effective build budget (split it) or a green command is stuck (see the Step 4 debug cap); committing → check the commit skill's mid-flight activity records; step-identified → the agent may have walked into work outside its lane (e.g. an unmarked human-only step).\"
              }" \
            || echo "::warning::implementer-callable: failure queue-entry POST failed"
          else
            echo "::warning::implementer-callable: QUEUE_SERVICE_ROLE_KEY missing; skipping failure queue entry"
          fi

          # Tick-report — outcome `workflow-failed` (reserved for this handler
          # per implementer SKILL.md Step 7; orchestrator maps it to `errored`).
          if [ -n "$IMPLEMENTER_SESSION_ID" ] && [ -n "$AUTONOMOUS_TICK_TOKEN" ]; then
            # pr_url is z.string().url().optional() hub-side, so omit it entirely
            # rather than sending an empty string.
            TICK_OUTCOME="workflow-failed"
            PR_FIELD=""
            if [ -n "$RECONCILED" ]; then
              TICK_OUTCOME="completed-unacknowledged"
              PR_FIELD="\"pr_url\": \"$PR_URL\","
            fi
            TICK_SENT=""
            for attempt in 1 2 3; do
              if curl -sf -X POST \
                  -H "Authorization: Bearer $AUTONOMOUS_TICK_TOKEN" \
                  -H "Content-Type: application/json" \
                  "${HUB}/api/autonomous/tick-report" \
                  -d "{
                    \"session_id\": \"$IMPLEMENTER_SESSION_ID\",
                    \"run_id\": \"$GITHUB_RUN_ID\",
                    \"outcome\": \"$TICK_OUTCOME\",
                    ${PR_FIELD}
                    \"run_url\": \"$RUN_URL\",
                    \"last_phase\": \"$LAST_PHASE\"
                  }"; then
                TICK_SENT=1
                break
              fi
              echo "::warning::implementer-callable: ensure-report tick-report POST attempt ${attempt}/3 failed"
              sleep $((attempt * 3))
            done
            if [ -z "$TICK_SENT" ]; then
              echo "::error::implementer-callable: ensure-report tick-report POST failed after 3 attempts; defensive cron sweep will reconcile"
            fi
          fi
