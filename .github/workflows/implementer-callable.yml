name: implementer (callable)

on:
  workflow_call:
    inputs:
      product_slug:
        description: "Product slug (defaults to repo basename)"
        type: string
        required: false
        default: ""
      session_id:
        description: "Autonomous session ID from the hub play-button loop."
        type: string
        required: false
        default: ""
      hub_url:
        description: "Hub base URL for posting tick-reports. Defaults to https://sethgibson.com."
        type: string
        required: false
        default: "https://sethgibson.com"
      target_kind:
        description: "Directed target kind from the hub picker: 'backlog' | 'milestone'. Empty trips the skill's Guard 2 — manual dispatch is unsupported."
        type: string
        required: false
        default: ""
      target_ref:
        description: "Directed target ref: BL-<n> for a backlog item, M<n> for a milestone."
        type: string
        required: false
        default: ""
      runner_label:
        description: "Self-hosted runner label to dispatch to (STANDARDS §9 surface routing). 'fleet' = PC (web/backend), 'fleet-mac' = Mac (mobile/both; has simulator)."
        type: string
        required: false
        default: "fleet"
      model:
        description: "Claude model for the agent: an alias (sonnet|opus|haiku|fable) or an exact id. Chosen per run by the hub; the default is the pre-parameterization pin."
        type: string
        required: false
        default: "claude-sonnet-5-5"
      effort:
        description: "Reasoning effort for the agent: low|medium|high|xhigh|max. Chosen per run by the hub."
        type: string
        required: false
        default: "medium"
      # TODO(STAFF_ENGINEER_PROPOSAL §7, queue-redesign Phase 6): staff_direction is declared
      # ahead of the staff-engineer agent so product repos forward it in the same pass as
      # model/effort. It is forwarded to the agent step as IMPLEMENTER_STAFF_DIRECTION but NOT yet
      # referenced in the prompt or read by implementer/SKILL.md — wire both when Phase 6 lands.
      staff_direction:
        description: "Diagnosis and direction from a staff-engineer `return`; authoritative context for a retry. Empty = ordinary run."
        type: string
        required: false
        default: ""

permissions:
  contents: write # commit + push from the implementer agent
  pull-requests: write # gh pr create / merge
  id-token: write # required by anthropics/claude-code-action@v1

concurrency:
  # Serialize per product — never run two implementer invocations on the same
  # repo at once. Default `cancel-in-progress: false` so a queued second run
  # waits rather than killing the in-flight one.
  group: implementer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  implementer:
    # Self-hosted runner, label set per dispatch (STANDARDS §9 surface routing):
    # 'fleet' (default) is the Fleet PC (WSL2, web/backend); 'fleet-mac' is Seth's
    # Mac (mobile/both; has the simulator). Avoids GitHub-hosted minute billing.
    # See ~/products/docs/SELF_HOSTED_RUNNER.md.
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    # STANDARDS §28.6. Observed max 60m on either runner (a 181-turn max-turns death;
    # 180 turns ~= 50-60m). 120 = 2x.
    timeout-minutes: 120
    env:
      # One source for the turn cap: the agent step's --max-turns and the ensure-report guard's
      # "did it run out of turns?" test both read it, so they cannot drift apart.
      AGENT_MAX_TURNS: "180"
    steps:
      - uses: actions/checkout@v4 # consumer repo at $GITHUB_WORKSPACE
        with:
          fetch-depth: 0 # needed for full git history (commit skill reads log)

      - uses: actions/checkout@v4 # fleet-skills repo (CI skills under ci/)
        with:
          repository: Aethrix-Labs/fleet-skills
          path: .fleet-ci
          ref: main
          token: ${{ secrets.FLEET_SKILLS_PAT }} # fleet-skills is private; default GITHUB_TOKEN can't cross repos

      - name: Set up gh CLI
        # The commit skill uses `gh pr create`, `gh pr merge --auto`, etc.
        # `gh` is preinstalled on ubuntu-latest runners; nothing to do.
        run: gh --version

      - name: Configure git for commits
        run: |
          git config user.name  "implementer-agent[bot]"
          git config user.email "implementer-agent@aethrix-labs.local"

      - name: Probe verification tooling (Playwright / Maestro / simulator)
        # Records what THIS runner can actually launch, so the run log and the agent start from
        # facts instead of the runner label's promise (STANDARDS §23.9 "When the tool can't run").
        # Advisory: never a gate and never fails the job. The agent's own probe run is authoritative
        # (it can heal, and it is scoped to the repo's Playwright version). A missing script only means
        # the fleet-skills vending PR has not landed yet; that must not break CI for every product.
        # Bounded: a hung probe must not hold this product's concurrency group for the default 6h.
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          # Through env, never interpolated into the script body.
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          PROBE=".fleet-ci/ci/implementer/tooling-probe.mjs"
          if [ ! -f "$PROBE" ]; then
            echo "::notice::tooling-probe not present in .fleet-ci (fleet-skills vending not landed yet); skipping"
            exit 0
          fi
          if ! command -v node >/dev/null 2>&1; then
            echo "::notice::node is not on PATH for this runner; skipping the tooling probe"
            exit 0
          fi
          # The probe prints only single-line values behind fixed prefixes, so its output cannot start a
          # workflow command (`::…`) at column 0.
          node "$PROBE" --runner --github-env 2> "$RUNNER_TEMP/tooling-probe.txt" >/dev/null || true
          cat "$RUNNER_TEMP/tooling-probe.txt"
          {
            echo "### Verification tooling on \`${RUNNER_LABEL}\`"
            echo '```'
            cat "$RUNNER_TEMP/tooling-probe.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/tooling-probe.txt"

      - name: Run implementer agent
        id: agent
        uses: anthropics/claude-code-action@v1
        env:
          # Used by the implementer's queue packets + activity records and the
          # commit skill's queue emission path (per STANDARDS §14
          # multi-storage credentials). Same secret security-review uses.
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          # Tick-report auth token (separate from QUEUE_SERVICE_ROLE_KEY per m2m convention).
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          # Shared password for the local-only test accounts (vault `fleet-test-local`,
          # STANDARDS §23.5). Product seed scripts (`seed:test`, `seed:review`, …) and
          # UI self-checks that sign in to the local stack read it. Empty when the org
          # secret is unset — scripts that need it fail fast with their own message.
          FLEET_TEST_PASSWORD: ${{ secrets.FLEET_TEST_PASSWORD }}
          # Dispatch payload passed through to the agent via env.
          IMPLEMENTER_PRODUCT_SLUG: ${{ inputs.product_slug }}
          IMPLEMENTER_SESSION_ID: ${{ inputs.session_id }}
          IMPLEMENTER_HUB_URL: ${{ inputs.hub_url }}
          # Directed target — required by the skill's Guard 2.
          IMPLEMENTER_TARGET_KIND: ${{ inputs.target_kind }}
          IMPLEMENTER_TARGET_REF: ${{ inputs.target_ref }}
          # Staff-engineer `return` direction (STAFF_ENGINEER_PROPOSAL §7). Empty on ordinary
          # runs. Not yet read by the skill or prompt — see the TODO on the input.
          IMPLEMENTER_STAFF_DIRECTION: ${{ inputs.staff_direction }}
          # Runner-capability flag for the mobile self-check (STANDARDS §23.9
          # Track A). The implementer keys off this flag, not off the milestone's
          # Surface marker directly, so a mobile step that lands on `fleet` (no
          # simulator) does not thrash: it takes the blocked path and the loop is held
          # (`verification-unavailable`, STANDARDS §23.9) — it no longer silently no-ops.
          UI_SELF_CHECK_MOBILE: ${{ inputs.runner_label == 'fleet-mac' && '1' || '0' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running as the **implementer agent** in CI.

            Read `.fleet-ci/ci/implementer/SKILL.md` and follow
            it exactly. It defines the pre-flight guards, the flow (resolve
            the directed target → implement the next unblocked step → invoke
            commit → exit), and the failure modes.

            When ready to commit, read `.fleet-ci/ci/ci-commit/SKILL.md`
            and follow its flow. The commit skill handles tier classification,
            PR body composition, queue emission, and merge routing.

            Runtime context:
            - Working directory has the full consumer repo (fetch-depth: 0).
            - Directed target: $IMPLEMENTER_TARGET_KIND / $IMPLEMENTER_TARGET_REF.
            - Product slug: $IMPLEMENTER_PRODUCT_SLUG (or derive from $GITHUB_REPOSITORY).

            Exit after ONE step. The verify gate is the loop boundary.
            Do not chain into the next step.
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --max-turns ${{ env.AGENT_MAX_TURNS }}
            --allowedTools Read,Bash,Write,Edit,Glob,Grep

      - name: Print the agent's activity breadcrumb
        # STANDARDS §18.2 (breadcrumb rule, added 2026-10-06) — this step is the PRINTING HALF that
        # rule names, and the §11.1 row (a) owed against it (fleet #184). The agent-side writers
        # append one line per ATTEMPTED hub write — `<agent> <action> <http_code>` — to
        # $GITHUB_WORKSPACE/.agent-activity; until this step existed the file was written and never
        # surfaced.
        #
        # It exists because an agent's own `::warning::` is invisible: the agent step runs with
        # show_full_output: false and its transcript is uploaded only on failure, so NOTHING an agent
        # echoes from a Bash call reaches this log. Without the breadcrumb a lost activity write is
        # indistinguishable from a write never attempted — which is exactly how FIVE successful runs
        # across two products lost their whole activity bracket undetected: moneycomb M39 twice on
        # 2026-10-04 (23:07:09, 23:13:55), then sethgibson-com M52 (2026-10-05 08:56:02), BL-115
        # (18:19:51) and M54.10 (2026-10-06 11:19:05). Their run logs are identical in shape and
        # wording to their healthy neighbours (STANDARDS_HISTORY §18; hub BL-128).
        #
        # Placed here, directly after the agent step, so the writes read in the log next to the
        # session that attempted them and ahead of the guard's own notices. The file carries no agent
        # name on purpose: implementer, ci-commit and staff-engineer all append to the same file in
        # the same workspace, so this one step prints every AGENT-side write of the run. The
        # workflow's own writes are not in it — they echo their status directly, which the log keeps.
        #
        # Lines are printed verbatim rather than parsed. The three-token form is the common case, but
        # a write can record `no-key` or `no-encoder` in place of a code, and §18.2's block sends
        # curl's stderr to the same file (`2>>"$CRUMB"`), so raw transport errors legitimately appear
        # between the breadcrumbs. Those are the diagnosis, so print them too.
        #
        # Observability, not a gate (§18.2): notices only, and it exits 0 on every path.
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Nothing below may fail the run.
          set +e

          FILE="${GITHUB_WORKSPACE:-.}/.agent-activity"
          if [ ! -f "$FILE" ]; then
            # Not an error on its own, and the three causes are not distinguishable from here, so
            # name all three rather than asserting one. The third is routine right now: §18.2's
            # breadcrumb rule binds only three skills so far, and a product repo whose vendored
            # `.fleet-ci` copy predates 2026-10-06 writes its records without a breadcrumb — the same
            # vending lag the verification probe above already allows for.
            echo "::notice::implementer-callable: no activity breadcrumb (.agent-activity absent); either no hub write was attempted, or the agent died before its first one, or this repo's vendored skill copy predates the breadcrumb rule"
            exit 0
          fi

          # `grep -c ''` rather than `wc -l`: the writers append with printf and a crashed one can
          # leave the last line unterminated, which wc undercounts by one while the loop below still
          # prints it. A line count, not a write count — curl's stderr lands here too.
          LINES="$(grep -c '' "$FILE" 2>/dev/null | tr -d ' \t')"
          case "$LINES" in ""|*[!0-9]*) LINES="?" ;; esac
          echo "::notice::implementer-callable: activity breadcrumb present (${LINES} line(s)); hub writes read as <agent> <action> <http_code>, interleaved with any transport error the writers redirected here"

          # Bounded on both axes. The file is appended to by an LLM-driven Bash call, so its size is
          # not trusted: cap the bytes read, the lines printed and each line's length rather than
          # letting a runaway write flood the log. A `::notice::` inside a line cannot inject an
          # annotation (a workflow command must start its own line), but strip CR and non-printables
          # so a mangled line still reads as text.
          head -c 20000 "$FILE" | head -n 200 | while IFS= read -r LINE || [ -n "$LINE" ]; do
            LINE="$(printf '%s' "$LINE" | tr -d '\r' | tr -cd '[:print:]' | cut -c1-200)"
            [ -n "$LINE" ] || continue
            echo "::notice::implementer-callable: activity ${LINE}"
          done
          exit 0

      - name: Ensure the hub heard back (tick-report guard)
        id: ensure-report
        # Always-run backstop (widened 2026-07-08 from an `if: failure()`-only handler).
        # Fires whenever the skill's `.tick-report-sent` breadcrumb is ABSENT at job end
        # — covering BOTH (a) the agent step dying (crash, infra error) and (b) the step
        # exiting `success` while the agent never sent a tick-report, most importantly a
        # `--max-turns` cutoff: claude-code-action reports max-turns as a SUCCESSFUL
        # step, so the old `if: failure()` form silently missed it and the session
        # stranded until the 30-min reconcile cron force-errored it as "tick-report
        # drop". In both cases the agent produced no in-band queue entry or tick-report:
        # surface the death in the decision queue and tell the orchestrator the tick
        # failed so the session goes `errored` instead of hanging. When the breadcrumb
        # IS present the skill already reported and this guard no-ops.
        # Writes are observability, not gates — POSTs warn-and-continue.
        if: always()
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          IMPLEMENTER_PRODUCT_SLUG: ${{ inputs.product_slug }}
          IMPLEMENTER_SESSION_ID: ${{ inputs.session_id }}
          IMPLEMENTER_HUB_URL: ${{ inputs.hub_url }}
          IMPLEMENTER_TARGET_KIND: ${{ inputs.target_kind }}
          IMPLEMENTER_TARGET_REF: ${{ inputs.target_ref }}
          GH_TOKEN: ${{ github.token }} # merge reconcile below
          # The action's transcript (a JSON array of SDK messages; the last `result` message carries
          # subtype / is_error / num_turns). Empty when the action died before writing it.
          AGENT_EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          # If the skill delivered its own tick-report it dropped this breadcrumb —
          # the hub already heard back, so this guard has nothing to do. Absent → fall
          # through and report on the workflow's behalf.
          if [ -f "${GITHUB_WORKSPACE:-.}/.tick-report-sent" ]; then
            echo "::notice::implementer-callable: skill already sent its tick-report; ensure-report guard idle"
            exit 0
          fi

          SLUG="${IMPLEMENTER_PRODUCT_SLUG:-$(basename "$GITHUB_REPOSITORY")}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          HUB="${IMPLEMENTER_HUB_URL:-https://sethgibson.com}"

          # Phase breadcrumb — the agent overwrites this single-line marker at
          # each phase boundary (implementer SKILL.md "Phase breadcrumb"). On a
          # max-turns/crash death the agent never reached its exit path, so this
          # file is the only signal for WHERE it died. Localizes the failure to
          # a phase (step-identified | building | testing | adversary |
          # committing) instead of a bare workflow-failed. Absent → "unknown".
          PHASE_FILE="${GITHUB_WORKSPACE:-.}/.implementer-phase"
          LAST_PHASE="unknown"
          if [ -f "$PHASE_FILE" ]; then
            LAST_PHASE="$(tr -d '\r\n' < "$PHASE_FILE" | head -c 200)"
          fi
          echo "::notice::implementer-callable: workflow failed at phase=${LAST_PHASE}"

          # Run-id breadcrumb — written by the skill at the moment it generates the loop's run_id
          # (STANDARDS §18.1a). The packet carries it so the queue entry cross-links to the agent's
          # activity trail. Absent, empty or malformed → omit the field and say so in `attempts`.
          # NEVER substitute $GITHUB_RUN_ID: that names the workflow run, not the agent's loop, and
          # a packet keyed to the wrong identifier space reads as a confident empty trail.
          RUN_ID_FILE="${GITHUB_WORKSPACE:-.}/.implementer-run-id"
          AGENT_RUN_ID=""
          if [ -f "$RUN_ID_FILE" ]; then
            AGENT_RUN_ID="$(tr -d '\r\n' < "$RUN_ID_FILE" | head -c 128)"
          fi
          RUN_ID_FIELD=""
          RUN_ID_NOTE=""
          case "$AGENT_RUN_ID" in
            "")
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.implementer-run-id) was missing or empty, so this entry carries no run_id and is not linked to an activity trail." ;;
            *[!A-Za-z0-9_-]*)
              # Interpolated into the JSON body below; anything outside a plain id is not trusted.
              AGENT_RUN_ID=""
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.implementer-run-id) was malformed, so this entry carries no run_id and is not linked to an activity trail." ;;
            *)
              RUN_ID_FIELD="\"run_id\": \"$AGENT_RUN_ID\"," ;;
          esac

          # What the agent step actually reported. claude-code-action writes its transcript to
          # $RUNNER_TEMP/claude-execution-output.json and prints a {"type":"result", ...} object to the
          # log; this guard is `if: always()`, so it also fires when the step concluded `success` and
          # the agent simply ended its session without running its exit path. Asserting "max-turns,
          # crash, or infra" for that case names a cause the log contradicts. Branch on the result
          # object instead; where it cannot be read, say so rather than guess.
          #   max-turns   subtype error_max_turns, or num_turns at/near the cap
          #   crash       is_error true, a non-success subtype, or no result object in the transcript
          #   clean-exit  subtype success, is_error false, turns well under the cap
          #   unknown     transcript or jq unavailable, or a field would not parse
          EXEC_FILE="${AGENT_EXECUTION_FILE:-}"
          if [ -z "$EXEC_FILE" ]; then
            EXEC_FILE="${RUNNER_TEMP:-}/claude-execution-output.json"
          fi
          CAP="${AGENT_MAX_TURNS:-}"
          case "$CAP" in ""|*[!0-9]*) CAP="" ;; esac
          R_KIND=""; R_SUBTYPE=""; R_ERR=""; R_TURNS=""; R_BG=""; R_DONE=""; R_STOP=""
          if [ -f "$EXEC_FILE" ] && command -v jq >/dev/null 2>&1; then
            R_LINE="$(jq -r -s '
                [.[] | if type == "array" then .[] else . end | select(type == "object" and .type == "result")] | last
                | if . == null then "none"
                  else ["result", (.subtype | tostring), (.is_error | tostring), (.num_turns | tostring),
                       ((.subagent_stats | objects | .started_in_background | numbers) // "" | tostring),
                       ((.subagent_stats | objects | .completed | numbers) // "" | tostring),
                       ((.stop_reason | strings) // "")] | join("|")
                  end' "$EXEC_FILE" 2>/dev/null || true)"
            IFS='|' read -r R_KIND R_SUBTYPE R_ERR R_TURNS R_BG R_DONE R_STOP <<< "$R_LINE" || true
            # These land in the JSON body below: keep them to plain tokens.
            R_SUBTYPE="$(printf '%s' "$R_SUBTYPE" | tr -cd 'A-Za-z0-9_-' | head -c 64)"
            case "$R_ERR" in true|false) ;; *) R_ERR="" ;; esac
            case "$R_TURNS" in ""|*[!0-9]*) R_TURNS="" ;; esac
            # subagent_stats is absent on older transcripts: absent or unparseable is no evidence, never 0.
            case "$R_BG" in ""|*[!0-9]*) R_BG="" ;; esac
            case "$R_DONE" in ""|*[!0-9]*) R_DONE="" ;; esac
            R_STOP="$(printf '%s' "$R_STOP" | tr -cd 'A-Za-z0-9_-' | head -c 32)"
          fi
          CAUSE="unknown"
          BG_WAIT=""
          if [ "$R_KIND" = "none" ]; then
            CAUSE="crash"
          elif [ "$R_KIND" = "result" ]; then
            if [ "$R_SUBTYPE" = "error_max_turns" ] || { [ -n "$R_TURNS" ] && [ -n "$CAP" ] && [ "$R_TURNS" -ge $((CAP * 9 / 10)) ]; }; then
              CAUSE="max-turns"
            elif [ "$R_ERR" = "true" ] || { [ -n "$R_SUBTYPE" ] && [ "$R_SUBTYPE" != "success" ]; }; then
              CAUSE="crash"
            elif [ "$R_SUBTYPE" = "success" ] && [ "$R_ERR" = "false" ] && [ -n "$R_TURNS" ] && [ -n "$CAP" ]; then
              CAUSE="clean-exit"
              # Sub-flag, not a fifth cause: the agent dispatched subagents in the background, none had
              # completed, and it ended its turn waiting (STANDARDS 28.6). Needs both fields present.
              if [ -n "$R_BG" ] && [ -n "$R_DONE" ] && [ "$R_BG" -ge 1 ] && [ "$R_DONE" -eq 0 ]; then
                BG_WAIT=1
              fi
            fi
          fi
          echo "::notice::implementer-callable: agent result cause=${CAUSE} subtype=${R_SUBTYPE:-?} is_error=${R_ERR:-?} turns=${R_TURNS:-?}/${CAP:-?} bg_started=${R_BG:-?} bg_completed=${R_DONE:-?} stop_reason=${R_STOP:-?}"

          # Merge reconcile (implementer PACKETS.md, workflow-failed).
          # The exit contract is NOT atomic with the commit side effects: on a
          # commit-phase death the PR may have opened, gone green and been merged
          # by the hub while only the in-band tick-report died. Reporting that as
          # workflow-failed tells Seth to retry an already-closed step.
          # Only reachable from `committing` — no PR can exist before it.
          # Best-effort and racy by design; the hub's merge-webhook reconcile
          # stays authoritative. This is the early exit so the common case never
          # shows a spurious retry card.
          RECONCILED=""
          PR_URL=""
          if [ "$LAST_PHASE" = "committing" ]; then
            WORK_BRANCH="$(git -C "${GITHUB_WORKSPACE:-.}" rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
            case "$WORK_BRANCH" in
              ""|HEAD|main|master)
                echo "::notice::implementer-callable: no working branch to reconcile (HEAD=${WORK_BRANCH:-none})" ;;
              *)
                PR_URL="$(gh pr list --head "$WORK_BRANCH" --state merged --limit 1 --json url --jq '.[0].url // empty' 2>/dev/null || true)"
                if [ -n "$PR_URL" ]; then
                  RECONCILED=1
                  echo "::notice::implementer-callable: reconciled - ${PR_URL} merged; the work landed, only the acknowledgment died"
                else
                  echo "::notice::implementer-callable: no merged PR for ${WORK_BRANCH}; genuine mid-commit death"
                fi ;;
            esac
          fi

          # The transcript is the only record of the agent's final message ("why did it stop"); the
          # runner's temp dir is wiped at job end. Hand it to the upload step below — failure path
          # only, so a reconciled (work landed) run uploads nothing.
          TRANSCRIPT_NOTE=""
          if [ -z "$RECONCILED" ] && [ -f "$EXEC_FILE" ]; then
            TRANSCRIPT_NOTE=" The agent's full transcript is attached to the run as the artifact implementer-transcript-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1} (7-day retention); its last result message is the agent's own account of why it stopped."
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "transcript_path=$EXEC_FILE" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Cause-specific text. Only what the result object supports is asserted; the over-sized-step
          # advice is reserved for an actual max-turns death. Plain ASCII, no double quotes or
          # backslashes: these are interpolated into the JSON body below.
          case "$CAUSE" in
            max-turns)
              ATTEMPT="claude-code-action used ${R_TURNS} of ${CAP} turns (result subtype ${R_SUBTYPE}), at or near its turn cap, before the skill's own exit path; no in-band queue entry or tick-report was sent."
              RECO="Died at phase '${LAST_PHASE}'. building/testing/adversary → the step is likely over-sized for the effective build budget (split it) or a green command is stuck (see the Step 4 debug cap); committing → check the commit skill's mid-flight activity records; step-identified → the agent may have walked into work outside its lane (e.g. an unmarked human-only step)." ;;
            crash)
              if [ "$R_KIND" = "none" ]; then
                ATTEMPT="claude-code-action ended without a result object in its transcript (a crash or infra error) before the skill's own exit path; no in-band queue entry or tick-report was sent."
              else
                ATTEMPT="claude-code-action ended in error (result subtype ${R_SUBTYPE:-unknown}, is_error ${R_ERR:-unknown}, ${R_TURNS:-unknown} of ${CAP:-unknown} turns) before the skill's own exit path; no in-band queue entry or tick-report was sent."
              fi
              RECO="Died at phase '${LAST_PHASE}'. This reads as a crash or infra error, not a budget death: retry is apt. If it recurs at the same phase, read the run log before changing the step." ;;
            clean-exit)
              if [ -n "$BG_WAIT" ]; then
                # Signature of STANDARDS 28.6 (a headless agent has no next turn).
                ATTEMPT="The agent step concluded success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap, stop_reason ${R_STOP:-unreported}) but the agent spawned ${R_BG} subagent(s) in the background, none completed (${R_DONE} completed), and it ended its turn waiting for one. A headless session has no next turn, so that ended the session without running its exit path (STANDARDS 28.6): no queue entry or tick-report was sent."
                RECO="Died at phase '${LAST_PHASE}'. Do not retry and do not split the step: the step was the right size and the run was nowhere near its budget. The fix is the skill's dispatch instruction (STANDARDS 28.6), and a re-dispatch before that fix lands stops the same way. The finished work should be on the WIP checkpoint branch implementer-wip/${IMPLEMENTER_TARGET_REF:-unknown} (check the ref exists), not on a PR. The agent's final message in the transcript artifact should say what it was waiting for."
              else
                ATTEMPT="The agent step concluded success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap) but the agent ended its session without running its exit path: no queue entry or tick-report was sent."
                RECO="Not a budget or infra failure - do not recommend splitting the step on this evidence. The agent stopped on its own at phase '${LAST_PHASE}'; read its final message in the transcript artifact to see why, then re-dispatch or fix the skill. If the phase is committing, check the PR state first: the work may have landed."
              fi ;;
            *)
              ATTEMPT="The agent ended without sending a tick-report or queue entry; cause unknown (the agent step's result object could not be read from this job)."
              RECO="Cause unknown - read the run log (and the transcript artifact, if one is attached) before choosing between retry and splitting the step. The last phase reached was '${LAST_PHASE}'." ;;
          esac
          ATTEMPT="${ATTEMPT} Last phase reached: ${LAST_PHASE}. Run: ${RUN_URL}${RUN_ID_NOTE}${TRANSCRIPT_NOTE}"

          # Queue entry — exception, variant `workflow-failed`. request_id is rooted in the
          # GitHub run ID (one entry per failed run; reruns get a new run ID,
          # which is correct — a new failure is a new event). Shape per
          # implementer PACKETS.md § workflow-failed.
          if [ -n "$RECONCILED" ]; then
            echo "::notice::implementer-callable: skipping workflow-failed entry (reconciled); the hub emits completed-unacknowledged off the tick-report"
          elif [ -n "$QUEUE_SERVICE_ROLE_KEY" ]; then
            REQUEST_ID=$(printf '%s' "${GITHUB_RUN_ID}workflow-failed" | sha256sum | cut -d' ' -f1)
            curl -sf -X POST "${HUB}/api/v1/queue/entries" \
              -H "Content-Type: application/json" \
              -H "x-service-role-key: $QUEUE_SERVICE_ROLE_KEY" \
              -H "User-Agent: aethrix-fleet-ci/1.0 (implementer-callable)" \
              -d "{
                \"request_id\": \"$REQUEST_ID\",
                \"entry_type\": \"exception\",
                \"variant\": \"workflow-failed\",
                ${RUN_ID_FIELD}
                \"agent_name\": \"implementer\",
                \"product_slug\": \"$SLUG\",
                \"title\": \"[$SLUG] implementer workflow failed on ${IMPLEMENTER_TARGET_REF:-unknown target}\",
                \"goal\": \"Advance ${IMPLEMENTER_TARGET_KIND:-?}/${IMPLEMENTER_TARGET_REF:-?} by one step\",
                \"attempts\": [\"$ATTEMPT\"],
                \"artifacts\": [{\"label\": \"Workflow run\", \"href\": \"$RUN_URL\", \"artifact_type\": \"doc\"}],
                \"ask\": \"Inspect the workflow run log; decide retry, fix the step/criteria, or restructure the target\",
                \"recommendation\": \"$RECO\"
              }" \
            || echo "::warning::implementer-callable: failure queue-entry POST failed"
          else
            echo "::warning::implementer-callable: QUEUE_SERVICE_ROLE_KEY missing; skipping failure queue entry"
          fi

          # Tick-report — outcome `workflow-failed` (reserved for this handler
          # per implementer SKILL.md Step 7; orchestrator maps it to `errored`).
          if [ -n "$IMPLEMENTER_SESSION_ID" ] && [ -n "$AUTONOMOUS_TICK_TOKEN" ]; then
            # pr_url is z.string().url().optional() hub-side, so omit it entirely
            # rather than sending an empty string.
            TICK_OUTCOME="workflow-failed"
            PR_FIELD=""
            if [ -n "$RECONCILED" ]; then
              TICK_OUTCOME="completed-unacknowledged"
              PR_FIELD="\"pr_url\": \"$PR_URL\","
            fi
            TICK_SENT=""
            for attempt in 1 2 3; do
              if curl -sf -X POST \
                  -H "Authorization: Bearer $AUTONOMOUS_TICK_TOKEN" \
                  -H "Content-Type: application/json" \
                  "${HUB}/api/autonomous/tick-report" \
                  -d "{
                    \"session_id\": \"$IMPLEMENTER_SESSION_ID\",
                    \"run_id\": \"$GITHUB_RUN_ID\",
                    \"outcome\": \"$TICK_OUTCOME\",
                    ${PR_FIELD}
                    \"run_url\": \"$RUN_URL\",
                    \"last_phase\": \"$LAST_PHASE\"
                  }"; then
                TICK_SENT=1
                break
              fi
              echo "::warning::implementer-callable: ensure-report tick-report POST attempt ${attempt}/3 failed"
              sleep $((attempt * 3))
            done
            if [ -z "$TICK_SENT" ]; then
              echo "::error::implementer-callable: ensure-report tick-report POST failed after 3 attempts; defensive cron sweep will reconcile"
            fi
          fi

      - name: Record the run's model and turns (calibration)
        id: record-run
        # MODEL_CALIBRATION_PROPOSAL §3.7: the workflow-side half of the producer minimum. The agent
        # cannot write these - claude-code-action writes the result object AFTER the agent's session
        # ends, so an agent cannot read its own num_turns. Do not move this back into the agent.
        #
        # A step of its own, NOT a block inside the ensure-report guard above: that guard exits at its
        # top whenever the skill sent its own tick-report, which is every healthy run, so a write
        # placed there would record only the dead agents and leave no denominator to calibrate
        # against. Here the guard's tick-report/queue behavior cannot be reached by anything this step
        # does, and this step cannot be skipped by anything the guard does.
        #
        # Observability, not a gate (STANDARDS §18.2): every failure path warns and continues, the
        # step never exits non-zero, and continue-on-error backstops the rest.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          IMPLEMENTER_PRODUCT_SLUG: ${{ inputs.product_slug }}
          IMPLEMENTER_SESSION_ID: ${{ inputs.session_id }}
          IMPLEMENTER_HUB_URL: ${{ inputs.hub_url }}
          IMPLEMENTER_TARGET_KIND: ${{ inputs.target_kind }}
          IMPLEMENTER_TARGET_REF: ${{ inputs.target_ref }}
          # The two chosen values, verbatim: an alias (sonnet) or an exact id. Not the resolution.
          RECORD_MODEL_AS_CHOSEN: ${{ inputs.model }}
          RECORD_EFFORT: ${{ inputs.effort }}
          AGENT_EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          # Nothing below may fail the run. -e is on by default for this shell; turn it off so a
          # failed jq/curl reaches its own warning instead of ending the step silently.
          set +e

          if [ -z "$QUEUE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::implementer-callable: QUEUE_SERVICE_ROLE_KEY missing; skipping the run-metrics activity record"
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::implementer-callable: jq is not on PATH for this runner; skipping the run-metrics activity record"
            exit 0
          fi

          # run_id comes ONLY from the agent's breadcrumb (STANDARDS §18.1a). The hub requires a
          # non-empty run_id, and inventing a second scheme (or substituting $GITHUB_RUN_ID, which
          # names the workflow run, not the agent's loop) is exactly what §18.1a exists to stop. A run
          # that died before the skill generated its id has no loop to attach to: skip, and say so.
          RUN_ID_FILE="${GITHUB_WORKSPACE:-.}/.implementer-run-id"
          AGENT_RUN_ID=""
          if [ -f "$RUN_ID_FILE" ]; then
            AGENT_RUN_ID="$(tr -d '\r\n' < "$RUN_ID_FILE" | head -c 128)"
          fi
          case "$AGENT_RUN_ID" in
            ""|*[!A-Za-z0-9_-]*)
              echo "::notice::implementer-callable: no usable run-id breadcrumb (.implementer-run-id missing, empty or malformed); the agent died before generating its run_id, so there is no loop to attach a run-metrics record to"
              exit 0 ;;
          esac

          # step_id_hint — the work-item id out of the `<phase>:<work-item-id>` phase breadcrumb this
          # workflow already parses for the failure handler (implementer PACKETS.md, run-metrics;
          # hub BL-128). The hub fills run_metrics.step_id / outcome / iterations_used by copying
          # them off this run's agent-written `run-completed`; no run-completed, no values, and the
          # table cannot tell that case from a crashed run. This is the callable's own second-best
          # answer to "which step was this", and NEVER the authority — hence the name: a hint is
          # what a workflow inferred from a local file, `step_id` is what the agent asserted about
          # its own run. The hub prefers run-completed and falls back to this.
          #
          # The key is OMITTED, not sent as null, when there is no usable id — the published rule is
          # "format ^(M\d+\.\d+[a-z]?|BL-\d+)$, or the key is omitted", and a reader owes the same
          # degradation for an omitted key as for a run whose breadcrumb was missing. Absent, empty,
          # malformed, or the literal `unknown` (what the skill writes before Step 1 resolves the
          # work item — implementer SKILL.md, "Phase breadcrumb") all take that path: a literal
          # "unknown" in run_metrics.step_id is worse than NULL, because the **Sizing:** join would
          # match it against nothing while looking answered.
          #
          # The regex is the validation, not a charset check, and that distinction is the point: it
          # rejects a bare `M54`, which is what the dispatch inputs carry. The hint must name the STEP
          # (M54.10); the target is not a second-best answer to that question, it is a wrong one.
          #
          # There is deliberately NO hint for `outcome` or `iterations_used`. The callable cannot
          # know either one without the agent's own record, and inventing them breaks
          # MODEL_CALIBRATION_PROPOSAL §4 — absent is NULL, never 0. A missing `iterations_used`
          # means "unrecorded"; a 0 means "the adversary never ran", and those are different runs.
          PHASE_FILE="${GITHUB_WORKSPACE:-.}/.implementer-phase"
          WORK_ITEM=""
          if [ -f "$PHASE_FILE" ]; then
            # First line only (the skill overwrites a single line; a stray second one is noise), and
            # the half after the first colon. No colon at all is malformed, not a bare work-item id.
            PHASE_RAW="$(head -n 1 "$PHASE_FILE" | tr -d '\r\n' | head -c 200)"
            case "$PHASE_RAW" in
              *:*) WORK_ITEM="${PHASE_RAW#*:}" ;;
            esac
          fi

          # Two values off one breadcrumb, deliberately not the same test:
          #   STEP_RESOLVED — did the agent get past Step 1 at all? Any work-item half that is not
          #     empty and not `unknown` answers yes. Used ONLY by the bracket check below, which must
          #     not demand a well-formed id: a real trail loss on a run whose breadcrumb reads
          #     `committing:M39` (a target where a step id was expected) is still a real trail loss,
          #     and coupling the alarm to the strict format would silence exactly those.
          #   STEP_ID_HINT — is it a step id fit to SEND? That is the published format, below.
          STEP_RESOLVED=""
          case "$WORK_ITEM" in
            ""|unknown) ;;
            *) STEP_RESOLVED=1 ;;
          esac
          STEP_ID_HINT="$WORK_ITEM"
          if ! printf '%s' "$STEP_ID_HINT" | grep -Eq '^(M[0-9]+\.[0-9]+[a-z]?|BL-[0-9]+)$'; then
            STEP_ID_HINT=""
          fi
          if [ -n "$STEP_ID_HINT" ]; then
            echo "::notice::implementer-callable: step_id_hint=${STEP_ID_HINT} (from .implementer-phase; the agent's run-completed stays authoritative)"
          else
            echo "::notice::implementer-callable: no usable step_id_hint (.implementer-phase missing, empty, unresolved or not a step id); omitting the key rather than guessing from the dispatch target"
          fi

          # sha256sum is GNU coreutils; the macOS runner may only have shasum.
          if command -v sha256sum >/dev/null 2>&1; then
            SHA="sha256sum"
          elif command -v shasum >/dev/null 2>&1; then
            SHA="shasum -a 256"
          else
            echo "::warning::implementer-callable: no sha256 tool on PATH; skipping the run-metrics activity record"
            exit 0
          fi

          EXEC_FILE="${AGENT_EXECUTION_FILE:-}"
          if [ -z "$EXEC_FILE" ]; then
            EXEC_FILE="${RUNNER_TEMP:-}/claude-execution-output.json"
          fi

          SLUG="${IMPLEMENTER_PRODUCT_SLUG:-$(basename "$GITHUB_REPOSITORY")}"
          HUB="${IMPLEMENTER_HUB_URL:-https://sethgibson.com}"
          CAP="${AGENT_MAX_TURNS:-}"
          ATTEMPT_NO="${GITHUB_RUN_ATTEMPT:-1}"

          # One request per workflow-run ATTEMPT. §18.1a: run_id repeats across a rerun at an
          # unchanged HEAD, so keying on run_id + action alone would dedup a second attempt away.
          REQUEST_ID="$(printf '%s' "${AGENT_RUN_ID}run-metrics${GITHUB_RUN_ID}:${ATTEMPT_NO}" | $SHA | cut -d' ' -f1)"

          # The whole body is built by jq, so nothing from the transcript or the inputs is ever
          # spliced into JSON by the shell. Every result-derived field is null when the object, or
          # that field in it, is absent or the wrong type: absent is "unknown", never 0 (§4).
          # The result file is a JSON array of SDK messages (or an object stream); take the last
          # {"type":"result"} and the system/init message.
          #
          # model_resolved is the key of modelUsage with the highest costUSD: the model that actually
          # served the bulk of the tokens, ground truth that needs no trust in the agent (§3.3 a).
          # modelUsage also lists small helper models (claude-haiku-4-5 shows up on every run), so the
          # highest-cost key, not "the only key", is the primary. The init message's model is the
          # fallback when modelUsage is absent, and models_used keeps the full per-model breakdown so
          # a mixed run is visible instead of collapsed.
          # Two jq traps, both bitten in testing: the "alternative" operator treats false as absent (so
          # is_error is typed explicitly rather than defaulted), and the program is single-quoted shell,
          # so it must never contain an apostrophe, comments included.
          #
          # An absent or unparseable result file still yields a record (the chosen model, effort and
          # session, every result field null): a crashed run is the population most worth calibrating.
          BODY=""
          for SRC in "$EXEC_FILE" /dev/null; do
            [ -f "$SRC" ] || [ "$SRC" = "/dev/null" ] || continue
            BODY="$(jq -s -c \
            --arg request_id "$REQUEST_ID" \
            --arg slug "$SLUG" \
            --arg run_id "$AGENT_RUN_ID" \
            --arg github_run_id "${GITHUB_RUN_ID:-}" \
            --arg github_run_attempt "$ATTEMPT_NO" \
            --arg step_id_hint "$STEP_ID_HINT" \
            --arg session_id "${IMPLEMENTER_SESSION_ID:-}" \
            --arg target_kind "${IMPLEMENTER_TARGET_KIND:-}" \
            --arg target_ref "${IMPLEMENTER_TARGET_REF:-}" \
            --arg model_as_chosen "${RECORD_MODEL_AS_CHOSEN:-}" \
            --arg effort "${RECORD_EFFORT:-}" \
            --arg cap "$CAP" '
              def nz: if . == "" then null else . end;
              ([.[] | if type == "array" then .[] else . end | select(type == "object")]) as $msgs
              | ($msgs | map(select(.type == "result")) | last) as $r
              | ($msgs | map(select(.type == "system" and .subtype == "init")) | first) as $init
              | (($r.modelUsage // null) | if type == "object" then . else null end) as $mu
              | ($mu | if . == null or length == 0 then null
                       else to_entries | max_by(.value.costUSD // 0) | .key end) as $top
              | def slim: {
                  input_tokens: (.inputTokens | numbers // null),
                  output_tokens: (.outputTokens | numbers // null),
                  cache_read_input_tokens: (.cacheReadInputTokens | numbers // null),
                  cache_creation_input_tokens: (.cacheCreationInputTokens | numbers // null),
                  cost_usd: (.costUSD | numbers // null)
                };
              {
                request_id: $request_id,
                product_slug: $slug,
                agent_name: "implementer",
                action: "run-metrics",
                run_id: $run_id,
                payload: ({
                  source: "implementer-callable",
                  github_run_id: $github_run_id,
                  github_run_attempt: $github_run_attempt
                }
                + (if $step_id_hint == "" then {} else {step_id_hint: $step_id_hint} end)
                + {
                  session_id: ($session_id | nz),
                  target_kind: ($target_kind | nz),
                  target_ref: ($target_ref | nz),
                  model_as_chosen: ($model_as_chosen | nz),
                  model_resolved: ($top // ($init.model | strings // null)),
                  model_resolved_source: (if $top != null then "modelUsage"
                                          elif ($init.model | strings // null) != null then "init"
                                          else null end),
                  effort: ($effort | nz),
                  num_turns: ($r.num_turns | numbers // null),
                  max_turns: (if ($cap | test("^[0-9]+$")) then ($cap | tonumber) else null end),
                  result_subtype: ($r.subtype | strings // null),
                  is_error: (if ($r.is_error | type) == "boolean" then $r.is_error else null end),
                  stop_reason: ($r.stop_reason | strings // null),
                  terminal_reason: ($r.terminal_reason | strings // null),
                  duration_ms: ($r.duration_ms | numbers // null),
                  duration_api_ms: ($r.duration_api_ms | numbers // null),
                  total_cost_usd: ($r.total_cost_usd | numbers // null),
                  usage: (($r.usage // null) | if type == "object" then {
                      input_tokens: (.input_tokens | numbers // null),
                      output_tokens: (.output_tokens | numbers // null),
                      cache_read_input_tokens: (.cache_read_input_tokens | numbers // null),
                      cache_creation_input_tokens: (.cache_creation_input_tokens | numbers // null)
                    } else null end),
                  models_used: (if $mu == null then null
                                else ($mu | with_entries(.value |= (if type == "object" then slim else {} end))) end)
                })
              }' "$SRC" 2>/dev/null)"
            [ -n "$BODY" ] && break
          done
          if [ -z "$BODY" ]; then
            echo "::warning::implementer-callable: could not build the run-metrics activity record (jq failed); skipping it"
            exit 0
          fi

          # Up to 3 attempts, only on a network failure or a 5xx: the write is idempotent on
          # request_id, so a retry cannot double-insert, and a 4xx will not improve by repeating.
          # --max-time so a hung hub cannot hold this product's concurrency group.
          SENT=""
          CODE=""
          for attempt in 1 2 3; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "${HUB}/api/v1/activity/entries" \
              -H "Content-Type: application/json" \
              -H "x-service-role-key: $QUEUE_SERVICE_ROLE_KEY" \
              -H "User-Agent: aethrix-fleet-ci/1.0 (implementer-callable)" \
              -d "$BODY")"
            case "$CODE" in
              2??) SENT=1; break ;;
              4??) break ;;
            esac
            [ "$attempt" -lt 3 ] && sleep $((attempt * 2))
          done
          if [ -n "$SENT" ]; then
            echo "::notice::implementer-callable: run-metrics activity record written (HTTP ${CODE}, run_id ${AGENT_RUN_ID})"
          else
            echo "::warning::implementer-callable: run-metrics activity record POST failed (last HTTP ${CODE:-none}); the run is unaffected"
          fi

          # ── Bracket check: the third NULL case, detected at the source (hub BL-128) ──
          #
          # The hub fills run_metrics.step_id / outcome / iterations_used by copying them off this
          # run's agent-written `run-completed`. No run-completed, no values — and the table cannot
          # tell that case from the crashed run those NULLs were built to mean. Five runs across two
          # products did exactly this: moneycomb M39 twice on 2026-10-04 (consecutive runs in one
          # session), then sethgibson-com M52, BL-115 and M54.10 on 2026-10-05/06 — all `success`,
          # 23-49 of 180 turns, PRs shipped, no bracket at all, and run logs indistinguishable in
          # shape and wording from their healthy neighbours (STANDARDS_HISTORY §18). This step is
          # already holding the agent's run_id and the result object, so it is the one place that can
          # say so while the evidence is live, instead of leaving it to a query weeks later.
          #
          # Reads the trail through the scoped agent read API (STANDARDS §18.3,
          # GET /api/v1/activity/entries?run_id=<id>, service-role auth, same key as the POST).
          # Gated on `success` on purpose: on a non-success run the absent run-completed is already
          # explained by the death, and the ensure-report guard above has already surfaced it.
          #
          # Every unreadable path reports UNVERIFIED, never missing: a 401/400/5xx or an unparseable
          # body must not be able to raise a false alarm about the agent's writes. Never non-zero.
          #
          # And one case where writing nothing is CORRECT, which the alarm must not claim as a loss:
          # `.implementer-run-id` is written at Step 1 the moment the run_id is generated, but three
          # clean exits happen after that and before `run-started` — directed milestone not found,
          # milestone with no unblocked step, backlog item gone from `## Open`. All three exit
          # `success` with tick-outcome `guard-tripped`, and implementer PACKETS.md says they
          # "write no activity records (tick-report only)". That is routine: SKILL.md Step 1 calls the
          # second one the defensive path for a step consumed between enumeration and dispatch. So the
          # warning is gated on STEP_RESOLVED — the phase breadcrumb showing the agent got past Step 1
          # — and NOT on run-started being present, which is 0 on the five real incidents too.
          SUBTYPE="$(printf '%s' "$BODY" | jq -r '.payload.result_subtype // empty' 2>/dev/null)"
          if [ "$SUBTYPE" != "success" ]; then
            echo "::notice::implementer-callable: bracket check skipped (result_subtype ${SUBTYPE:-unreadable}); a missing run-completed on a non-success run is explained by the death itself"
            exit 0
          fi

          TRAIL_FILE="${RUNNER_TEMP:-/tmp}/implementer-trail-${GITHUB_RUN_ID:-0}-${ATTEMPT_NO}.json"
          TRAIL_CODE="$(curl -s -o "$TRAIL_FILE" -w '%{http_code}' --max-time 20 \
            -H "x-service-role-key: $QUEUE_SERVICE_ROLE_KEY" \
            -H "User-Agent: aethrix-fleet-ci/1.0 (implementer-callable)" \
            "${HUB}/api/v1/activity/entries?run_id=${AGENT_RUN_ID}")"
          case "$TRAIL_CODE" in
            2??) ;;
            *)
              echo "::notice::implementer-callable: bracket check unverified (trail read returned HTTP ${TRAIL_CODE:-none}); the bracket is unread, not known missing"
              rm -f "$TRAIL_FILE"
              exit 0 ;;
          esac

          # `na` whenever the body is not the documented {count, entries[]} shape — an error object
          # answers `[.entries[]?] | length` with 0, which would read as a missing bracket.
          COUNTS="$(jq -r 'if (.entries | type) == "array"
              then [([.entries[] | select(.action == "run-completed")] | length),
                    ([.entries[] | select(.action == "run-started")] | length),
                    (.entries | length)] | join(" ")
              else "na" end' "$TRAIL_FILE" 2>/dev/null)"
          rm -f "$TRAIL_FILE"
          # Plain word-splitting, not a `<<<` herestring: this step is otherwise POSIX-clean and pins
          # no shell, and a herestring is a PARSE-time construct — under a non-bash shell the script
          # would die before its first line and take the shipping run-metrics POST with it. The values
          # are digits or `na`, so there is nothing for globbing to expand.
          N_COMPLETED=""; N_STARTED=""; N_TOTAL=""
          # shellcheck disable=SC2086
          set -- $COUNTS
          N_COMPLETED="${1:-}"; N_STARTED="${2:-}"; N_TOTAL="${3:-}"

          # §18.1a: run_id repeats across a rerun at an unchanged HEAD, so on attempt 2+ a
          # `run-completed` in the trail may belong to the earlier attempt. The record this step
          # writes is keyed per attempt; this read cannot be, so say so rather than imply otherwise.
          ATTEMPT_CAVEAT=""
          if [ "$ATTEMPT_NO" != "1" ]; then
            ATTEMPT_CAVEAT=" (attempt ${ATTEMPT_NO}: a record found here may be from an earlier attempt of this run_id)"
          fi
          # What is left to attribute the row by, said exactly: the hint when one was sent, and
          # nothing when it was omitted. "the step_id_hint above" would be a claim about a key that
          # may not be in the record.
          if [ -n "$STEP_ID_HINT" ]; then
            HINT_NOTE="step_id_hint ${STEP_ID_HINT} is this row's only step attribution"
          else
            HINT_NOTE="no step_id_hint was usable either, so the row names no step at all"
          fi
          case "$N_COMPLETED" in
            ""|*[!0-9]*)
              echo "::notice::implementer-callable: bracket check unverified (the trail read returned nothing parseable); the bracket is unread, not known missing" ;;
            0)
              if [ -n "$STEP_RESOLVED" ]; then
                echo "::warning::implementer-callable: run finished success with no run-completed; run_metrics step_id/outcome/iterations_used will be NULL (trail holds ${N_TOTAL:-?} record(s) for this run_id, run-started x${N_STARTED:-?}). ${HINT_NOTE} - see STANDARDS_HISTORY 18 / hub BL-128"
              else
                echo "::notice::implementer-callable: no activity bracket, and no resolved work item either (phase breadcrumb absent or unresolved); a guard trip or a Step-1 target-not-found exit writes no activity records by design, so this is not a lost trail"
              fi ;;
            *)
              echo "::notice::implementer-callable: activity bracket intact (run-completed x${N_COMPLETED}, run-started x${N_STARTED:-?}, ${N_TOTAL:-?} record(s) for run_id ${AGENT_RUN_ID})${ATTEMPT_CAVEAT}" ;;
          esac
          exit 0

      - name: Upload the agent transcript (failure path only)
        # The agent step runs with show_full_output: false, so the log carries the result object but
        # not the agent's final message, and the transcript is deleted with the runner's temp dir.
        # An artifact rather than show_full_output: true — that would print every tool result,
        # secrets included, into a log anyone with read access can open. The guard sets
        # `transcript_path` only when it filed a failure (no tick-report, not reconciled).
        if: always() && steps.ensure-report.outputs.transcript_path != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: implementer-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.ensure-report.outputs.transcript_path }}
          if-no-files-found: warn
          retention-days: 7
