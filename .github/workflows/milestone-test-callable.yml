name: milestone-test (callable)

# Per-milestone testing session, autonomous mode (STANDARDS §23.7 Mode A).
#
# The thin per-product .github/workflows/milestone-test.yml `uses:` this. Its gate job
# turns a push to `main` into (milestone, runner) — a milestone close is the merge of the
# PR that archived the milestone into docs/PLANNING_ARCHIVE.md — and dispatches here.
#
# Flow: scope from the milestone diff -> classify each built behavior (e2e / checklist /
# neither) -> author + run the e2e headless to green -> headless visual pass with
# screenshots -> route residual findings via shakedown's autonomous posture -> commit via
# ci-commit. Emits a `follow-up` ONLY when something actually needs Seth; a clean session
# emits nothing, which is the whole point of the mode.
#
# Requires these bundles vended to fleet-skills `ci/`, reached at .fleet-ci/ci/<name>/:
# milestone-test, shakedown, ci-commit (incl. PACKETS.md — the `verification-unavailable`
# template), and implementer (its tooling-probe.mjs, run pre-agent and by the skill's Step 0).

on:
  workflow_call:
    inputs:
      product_slug:
        description: "Product slug (defaults to repo basename)."
        type: string
        required: false
        default: ""
      hub_url:
        description: "Hub base URL for the queue POST. Defaults to https://sethgibson.com."
        type: string
        required: false
        default: "https://sethgibson.com"
      milestone:
        description: "The closed milestone to test, e.g. M35. Resolved by the caller's gate job."
        type: string
        required: true
      runner_label:
        description: "Self-hosted runner label (STANDARDS §9 surface routing). 'fleet' = PC (web/backend), 'fleet-mac' = Mac (mobile; has the simulator)."
        type: string
        required: false
        default: "fleet"

permissions:
  contents: write # the session commits specs, seed scripts and docs
  pull-requests: write # ci-commit opens the PR
  id-token: write # required by anthropics/claude-code-action@v1

concurrency:
  # Serialize milestone-test runs per product. Deliberately NOT shared with the
  # implementer's group: a queued implementer run strands its hub session (the dispatch
  # endpoint returns 204 with no body, so the hub never learns the run id).
  group: milestone-test-${{ github.repository }}
  cancel-in-progress: false

jobs:
  milestone-test:
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    # STANDARDS §28.6. No completed run yet to measure; sized off the implementer (same
    # 180-turn budget, observed max 60m) plus e2e suite runs inside those turns. fleet-mac
    # adds 30 for Maestro calls queueing on the fleet_maestro lock (FLEET_MAESTRO_LOCK_WAIT_SECS=1800).
    timeout-minutes: ${{ inputs.runner_label == 'fleet-mac' && 180 || 150 }}
    env:
      # One source for the turn cap: the agent step's --max-turns and the failure guard's
      # "did it run out of turns?" test both read it, so they cannot drift apart.
      AGENT_MAX_TURNS: "180"
    steps:
      - name: Guard — claude-code-action supports only some events
        # A reusable workflow inherits the CALLER's event, and anthropics/claude-code-action@v1 throws
        # "Unsupported event type" ~200 ms into its step for anything outside this list — before any
        # skill phase runs, with nothing to say why. Fail here instead, naming the cause.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            issues|issue_comment|pull_request|pull_request_target|pull_request_review|pull_request_review_comment|workflow_dispatch|repository_dispatch|schedule|workflow_run) ;;
            *)
              echo "::error::claude-code-action cannot run under '$EVENT_NAME'; dispatch via workflow_dispatch. The caller's milestone-test.yml must hand off with 'gh workflow run' and run this job only under workflow_dispatch (STANDARDS §28.6)."
              echo "### milestone-test cannot run under \`$EVENT_NAME\`" >> "$GITHUB_STEP_SUMMARY"
              echo "claude-code-action rejects this event, so the session was not started and the milestone is UNTESTED. The caller must re-dispatch as workflow_dispatch (see skills/e2e-setup/assets/milestone-test.yml)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4 # consumer repo at $GITHUB_WORKSPACE
        with:
          fetch-depth: 0 # the session reads the milestone's diff + git history

      - uses: actions/checkout@v4 # fleet-skills (CI skills under ci/)
        with:
          repository: Aethrix-Labs/fleet-skills
          path: .fleet-ci
          ref: main
          token: ${{ secrets.FLEET_SKILLS_PAT }} # fleet-skills is private

      - name: Set up gh CLI
        run: gh --version

      - name: Configure git for commits
        run: |
          git config user.name  "milestone-test[bot]"
          git config user.email "milestone-test@aethrix-labs.local"

      - name: Probe verification tooling (Playwright / Maestro / simulator)
        # Records what THIS runner can actually launch, so the run log and the agent start from
        # facts instead of the runner label's promise (STANDARDS §23.9 "When the tool can't run").
        # Advisory: never a gate and never fails the job. The agent's own probe run is authoritative
        # (it can heal, and it is scoped to the repo's Playwright version). A missing script only means
        # the fleet-skills vending PR has not landed yet; that must not break CI for every product.
        # Bounded: a hung probe must not hold this product's concurrency group for the default 6h.
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          # Through env, never interpolated into the script body.
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          PROBE=".fleet-ci/ci/implementer/tooling-probe.mjs"
          if [ ! -f "$PROBE" ]; then
            echo "::notice::tooling-probe not present in .fleet-ci (fleet-skills vending not landed yet); skipping"
            exit 0
          fi
          if ! command -v node >/dev/null 2>&1; then
            echo "::notice::node is not on PATH for this runner; skipping the tooling probe"
            exit 0
          fi
          # The probe prints only single-line values behind fixed prefixes, so its output cannot start a
          # workflow command (`::…`) at column 0.
          node "$PROBE" --runner --github-env 2> "$RUNNER_TEMP/tooling-probe.txt" >/dev/null || true
          cat "$RUNNER_TEMP/tooling-probe.txt"
          {
            echo "### Verification tooling on \`${RUNNER_LABEL}\`"
            echo '```'
            cat "$RUNNER_TEMP/tooling-probe.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/tooling-probe.txt"

      - name: Heal a stale dev client on this slot
        # STANDARDS section 27.7 "Dev clients on slot simulators", "Who repairs it". A native-dependency change
        # leaves the dev client stale on EVERY slot (fleet-slot-1..3), and each slot used to file its own
        # `dev-client-stale` card: 15 of them between 2026-10-31 and 2026-11-11 (puzzle-pop, petcare-companion),
        # every one cleared by Seth running `dev-client:rebuild` on the Mac and re-dispatching. Seth approved
        # healing it HERE on 2026-11-16: a deterministic workflow step may rebuild. The agent still never does,
        # because the client is shared by every job on the slot and a native build is open-ended work; its own
        # probe stays authoritative and files the card if this step could not fix things.
        #
        # Runs before the agent (and, in the implementer, before the token re-minter), so a rebuild spends none
        # of the agent's token window. It only ever touches THIS job's own slot: `fleet_slot` must resolve to
        # 1..9, never 0 (a human's simulator), and the simulator is `fleet_sim_target`'s, the same one the agent's
        # probe will check. The checks are the product's own vendored scripts/lib/fleet-slot.sh and
        # scripts/lib/dev-client-check.mjs (exit 0 fresh or n/a, 21 stale or missing, 2 undecided), and the
        # rebuild is the product's own `dev-client:rebuild` script.
        #
        # A check that exits 2 on a checkout with no node_modules is not a verdict: the helper runs the
        # product's own `expo` and `expo-updates`, and actions/checkout deletes node_modules. So that case
        # installs once (frozen, from the lockfile) and asks again. Only a 21 is acted on.
        #
        # Heals go one at a time machine-wide, under ~/.fleet/locks (same atomic mkdir and dead-owner recovery
        # as fleet_maestro): the three Mac instances share the CocoaPods cache and the CPU. It waits up to 20
        # minutes for the lock and then gives up. The step's 35 minutes are a budget too: a heal that reaches
        # the lock with less than 15 of them left gives up rather than start a build the timeout would kill.
        # The implementer's 120-minute job timeout is hard-coded by the hub and is not raised for this.
        #
        # NEVER a gate: continue-on-error, and every path exits 0. Any failure is a ::warning:: and the agent's
        # probe files the dev-client-stale card exactly as it did before this step existed. Afterwards the work
        # tree holds no tracked changes (prebuild --clean regenerates the gitignored ios/, but if anything
        # tracked moved it is restored), so the agent can never commit what the rebuild touched.
        #
        # Same step, same script in implementer-callable.yml and milestone-test-callable.yml: change them
        # together. dev-client-heal-test.yml lifts both and fails if they differ.
        if: inputs.runner_label == 'fleet-mac'
        continue-on-error: true
        timeout-minutes: 35
        shell: bash
        run: |
          # Every path below ends in exit 0: this step repairs, it never gates. The shell has -e on by default.
          set +e

          LIB="scripts/lib/fleet-slot.sh"
          HELPER="scripts/lib/dev-client-check.mjs"
          REBUILD="dev-client:rebuild"
          TMP="${RUNNER_TEMP:-/tmp}"
          BUILD_LOG="$TMP/dev-client-heal-build.log"
          INSTALL_LOG="$TMP/dev-client-heal-install.log"
          SIM_ERR="$TMP/dev-client-heal-sim.err"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # The lock lives where fleet_maestro's does (fleet-slot.sh `_fleet_lock_dir`): $HOME, not $TMPDIR, so a
          # human's Terminal and every runner LaunchAgent share ONE lock. The FLEET_HEAL_* overrides are for tests.
          LOCK_DIR="${FLEET_MAESTRO_LOCK_DIR:-$HOME/.fleet/locks}"
          LOCK="$LOCK_DIR/fleet-dev-client-heal.lock"
          LOCK_WAIT_SECS="${FLEET_HEAL_LOCK_WAIT_SECS:-1200}"
          # Keep STEP_BUDGET_SECS equal to this step's timeout-minutes. A build the timeout would kill half way
          # is worse than none: it holds the lock and burns the time for nothing.
          STEP_BUDGET_SECS="${FLEET_HEAL_STEP_BUDGET_SECS:-2100}"
          MIN_BUILD_SECS="${FLEET_HEAL_MIN_BUILD_SECS:-900}"

          HELD=0; REBUILD_STARTED=0; TREE_CLEANED=0; DEPS_DONE=0; INSTALL_RAN=0; BUILD_RAN=0
          SLOT=""; UDID=""; PM=""; INSTALL=()
          CHECK_RC=""; CHECK_JSON=""; CHECK_STATE=""
          INSTALL_SECS=0; LOCK_WAIT=0; BUILD_SECS=0; LOCK_AT=""; UNLOCK_AT=""

          skip() { echo "::notice::dev-client heal skipped: $1"; exit 0; }

          fmt() { printf '%dm %02ds' $(( $1 / 60 )) $(( $1 % 60 )); }

          # Last lines of a log, safe to print and to put in a fenced block: control characters and backticks out.
          tail_of() { tail -n "${2:-40}" "$1" 2>/dev/null | tr -d '\r' | tr -cd '[:print:]\n' | tr '`' "'"; }

          # Run a command with its output tee'd to a log AND printed to the job log with a prefix, so no line of a
          # build can start a workflow command (`::...`) at column 0. Returns the command's own exit code.
          run_logged() {
            local log="$1"; shift
            : > "$log"
            "$@" 2>&1 | tee -a "$log" | awk '{ print "  | " $0; fflush() }'
            return "${PIPESTATUS[0]}"
          }

          json_field() {
            printf '%s' "$CHECK_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s)[process.argv[1]];process.stdout.write(String(v==null?"":v).replace(/\s+/g," ").slice(0,300))}catch(e){}})' "$1"
          }

          # Sets CHECK_RC (0 fresh or n/a, 21 stale or missing, 2 undecided) and CHECK_STATE. The helper's own
          # human line goes to the job log on stderr; its JSON verdict is the last line of stdout.
          run_check() {
            local out
            out="$(fleet_dev_client_check "$UDID")"
            CHECK_RC=$?
            CHECK_JSON="$(printf '%s\n' "$out" | tail -n 1)"
            CHECK_STATE="$(json_field state)"
            [ -n "$CHECK_STATE" ] || CHECK_STATE="unknown"
          }

          release_lock() {
            if [ "$HELD" = 1 ]; then
              rm -rf "$LOCK"
              HELD=0
              UNLOCK_AT="$(date +%s)"
            fi
          }

          # Same atomic mkdir and dead-owner recovery as fleet_maestro. Returns 1 after LOCK_WAIT_SECS.
          acquire_lock() {
            local owner waited=0 nopid=0
            until mkdir "$LOCK" 2>/dev/null; do
              owner="$(cat "$LOCK/pid" 2>/dev/null)" || owner=""
              # Reclaim a lock whose owner died without releasing it.
              if [ -n "$owner" ] && ! kill -0 "$owner" 2>/dev/null; then
                echo "dev-client heal: reclaiming the lock from dead pid $owner"
                rm -rf "$LOCK"; nopid=0; continue
              fi
              # No pid file: either the winner has not written it yet or it died between mkdir and the write.
              if [ -z "$owner" ]; then
                nopid=$((nopid + 2))
                if [ "$nopid" -ge 10 ]; then
                  echo "dev-client heal: reclaiming a lock that never recorded a pid"
                  rm -rf "$LOCK"; nopid=0; continue
                fi
              else
                nopid=0
              fi
              waited=$((waited + 2))
              [ "$waited" -ge "$LOCK_WAIT_SECS" ] && return 1
              if [ $((waited % 60)) -eq 0 ]; then
                echo "dev-client heal: waiting ${waited}s for another heal (held by pid ${owner:-?}: $(cat "$LOCK/owner" 2>/dev/null))"
              fi
              sleep 2
            done
            echo $$ > "$LOCK/pid"
            echo "${GITHUB_REPOSITORY:-?} on ${RUNNER_NAME:-?}" > "$LOCK/owner"
            HELD=1
            LOCK_AT="$(date +%s)"
            return 0
          }

          # The work tree must hold no tracked changes when the agent starts: it could commit them. prebuild
          # --clean regenerates ios/ (normally gitignored), so there is normally nothing to do.
          cleanup_tree() {
            local changed fresh
            TREE_CLEANED=1
            changed="$(git diff --name-only HEAD 2>/dev/null)"
            if [ -n "$changed" ]; then
              git checkout HEAD -- . 2>/dev/null || git reset -q --hard HEAD
              echo "::warning::dev-client heal: the rebuild changed tracked files; restored them so the agent cannot commit them: $(printf '%s' "$changed" | head -n 20 | tr '\n' ' ')"
            fi
            # New files that are not gitignored are not tracked changes and are left alone (deleting what this step
            # did not create is not its call), but the agent should hear about them.
            git ls-files --others --exclude-standard 2>/dev/null | sort > "$TMP/dev-client-heal-untracked.after"
            fresh="$(comm -13 "$TMP/dev-client-heal-untracked.before" "$TMP/dev-client-heal-untracked.after" 2>/dev/null)"
            if [ -n "$fresh" ]; then
              echo "::warning::dev-client heal: the rebuild left new untracked files that are not gitignored (not removed): $(printf '%s' "$fresh" | head -n 20 | tr '\n' ' ')"
            fi
          }

          on_exit() {
            release_lock
            if [ "$REBUILD_STARTED" = 1 ] && [ "$TREE_CLEANED" != 1 ]; then cleanup_tree; fi
          }
          trap on_exit EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT

          # A failed heal. The agent's own probe still files the dev-client-stale card, exactly as before this step.
          give_up() {
            echo "::warning::dev-client heal gave up on slot $SLOT: $1. The agent's probe will file the dev-client-stale card as before."
            {
              echo "### Dev client heal: gave up (slot $SLOT)"
              echo ""
              echo "$1. The agent's probe will file the dev-client-stale card as before."
              if [ "$INSTALL_RAN" = 1 ] && [ "$BUILD_RAN" != 1 ]; then
                echo ""; echo "Last lines of the dependency install:"; echo '```'; tail_of "$INSTALL_LOG" 40; echo '```'
              fi
              if [ "$BUILD_RAN" = 1 ]; then
                echo ""; echo "Last lines of the rebuild:"; echo '```'; tail_of "$BUILD_LOG" 40; echo '```'
              fi
            } >> "$SUMMARY"
            exit 0
          }

          # ---- Guards: nothing here is an error, the product just is not in scope ----------------------------
          [ -f "$LIB" ] && [ -f "$HELPER" ] || skip "$LIB and $HELPER are not both vendored in this repo (STANDARDS section 27.7)"
          command -v node >/dev/null 2>&1 || skip "node is not on PATH"
          node -e 'try{process.exit(JSON.parse(require("fs").readFileSync("package.json","utf8")).scripts[process.argv[1]]?0:1)}catch(e){process.exit(1)}' "$REBUILD" \
            || skip "package.json declares no \"$REBUILD\" script"

          # ---- Which slot, which simulator. Never slot 0: that is a human's own simulator --------------------
          . "$LIB"
          SLOT="$(fleet_slot)"
          case "$SLOT" in
            ''|*[!0-9]*|0)
              echo "::warning::dev-client heal refused: this job's fleet slot resolves to '${SLOT:-nothing}' (FLEET_SLOT='${FLEET_SLOT:-}', RUNNER_NAME='${RUNNER_NAME:-}'). It only ever touches its own slot 1..9, never slot 0, which is a human's simulator."
              echo "### Dev client heal: refused" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
              echo "The job's fleet slot did not resolve to 1..9, so nothing was touched." >> "$SUMMARY"
              exit 0 ;;
          esac
          UDID="$(fleet_sim_target 2>"$SIM_ERR")"
          case "$UDID" in
            ''|*[!0-9A-Fa-f-]*)
              echo "::warning::dev-client heal skipped: no simulator for slot $SLOT ($(head -c 300 "$SIM_ERR" | tr -d '\r' | tr -cd '[:print:]' ))"
              echo "### Dev client heal: skipped (slot $SLOT)" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
              echo "No simulator for the slot; the agent's own probe decides from here." >> "$SUMMARY"
              exit 0 ;;
          esac

          # The package manager is the one whose lockfile the product commits. A workspace's lockfile is at the root.
          if   [ -f pnpm-lock.yaml ]; then PM=pnpm; INSTALL=(pnpm install --frozen-lockfile)
          elif [ -f yarn.lock ]; then
            PM=yarn
            if [ -f .yarnrc.yml ]; then INSTALL=(yarn install --immutable); else INSTALL=(yarn install --frozen-lockfile); fi
          elif [ -f package-lock.json ]; then PM=npm; INSTALL=(npm ci)
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then PM=bun; INSTALL=(bun install --frozen-lockfile)
          fi

          install_deps() {
            [ -n "$PM" ] || { echo "no lockfile (pnpm-lock.yaml, yarn.lock, package-lock.json, bun.lock) at the repo root"; return 1; }
            command -v "$PM" >/dev/null 2>&1 || { echo "$PM is not on PATH"; return 1; }
            local t0=$SECONDS rc
            echo "dev-client heal: installing dependencies: ${INSTALL[*]}"
            INSTALL_RAN=1
            run_logged "$INSTALL_LOG" "${INSTALL[@]}"
            rc=$?
            INSTALL_SECS=$(( INSTALL_SECS + SECONDS - t0 ))
            if [ "$rc" -eq 0 ]; then DEPS_DONE=1; else echo "${INSTALL[*]} exited $rc"; fi
            return "$rc"
          }

          git ls-files --others --exclude-standard 2>/dev/null | sort > "$TMP/dev-client-heal-untracked.before"

          # ---- State before ----------------------------------------------------------------------------------
          echo "dev-client heal: slot $SLOT, simulator $UDID"
          run_check
          # The check runs the product's own `expo` and `expo-updates`, so on a fresh checkout (actions/checkout
          # deletes node_modules) it cannot decide: exit 2. That is "no deps yet", not a verdict, so install once
          # and ask again. Without this the step would skip exactly the case it exists for.
          if [ "$CHECK_RC" -eq 2 ] && [ ! -d node_modules ]; then
            if install_deps; then run_check; else give_up "the dependency install failed, so the client could not be checked"; fi
          fi
          BEFORE="$CHECK_STATE"
          BEFORE_WHY="$(json_field reason | tr '|' '/')"

          if [ "$CHECK_RC" -ne 21 ]; then
            # 0: fresh, or the product does not use the fingerprint runtimeVersion policy. 2: still undecided; that
            # is not a verdict, so leave it to the agent's probe.
            if [ "$CHECK_RC" -eq 0 ]; then MSG="the dev client on slot $SLOT is $BEFORE; nothing to rebuild"; else MSG="could not decide whether the dev client on slot $SLOT is fresh (${BEFORE_WHY:-no reason given}); leaving it to the agent's probe"; fi
            echo "::notice::dev-client heal: $MSG"
            {
              echo "### Dev client heal: $BEFORE (slot $SLOT)"
              echo ""
              echo "$MSG. Checked in $(fmt "$SECONDS")."
            } >> "$SUMMARY"
            echo "dev-client-heal-result: before=$BEFORE after=$BEFORE rebuilt=no secs=$SECONDS lock_wait=0"
            exit 0
          fi

          # ---- Stale or missing: heal it ---------------------------------------------------------------------
          echo "dev-client heal: the client is $BEFORE (${BEFORE_WHY}); rebuilding on slot $SLOT"
          if [ "$DEPS_DONE" != 1 ]; then
            install_deps || give_up "the dependency install failed"
          fi

          mkdir -p "$LOCK_DIR" 2>/dev/null || give_up "cannot create the lock directory $LOCK_DIR, so heals cannot be serialized"
          T_LOCK0=$SECONDS
          acquire_lock || give_up "waited $(fmt "$LOCK_WAIT_SECS") for another heal on this machine to finish (the three Mac instances build one at a time) and it did not"
          LOCK_WAIT=$(( SECONDS - T_LOCK0 ))
          if [ $(( STEP_BUDGET_SECS - SECONDS )) -lt "$MIN_BUILD_SECS" ]; then
            give_up "only $(fmt $(( STEP_BUDGET_SECS - SECONDS ))) of the step's $(fmt "$STEP_BUDGET_SECS") are left after waiting for the lock, which is not enough for a build"
          fi
          [ "$LOCK_WAIT" -lt 2 ] || echo "dev-client heal: waited $(fmt "$LOCK_WAIT") for the lock"

          REBUILD_STARTED=1; BUILD_RAN=1
          T_BUILD0=$SECONDS
          run_logged "$BUILD_LOG" env "DEV_CLIENT_UDID=$UDID" "$PM" run "$REBUILD"
          BUILD_RC=$?
          BUILD_SECS=$(( SECONDS - T_BUILD0 ))
          release_lock
          cleanup_tree

          run_check
          AFTER="$CHECK_STATE"
          TOTAL=$SECONDS

          if [ "$CHECK_RC" -eq 0 ]; then
            echo "::notice::dev-client heal: slot $SLOT was $BEFORE, now $AFTER ($(fmt "$TOTAL"))"
            {
              echo "### Dev client heal: rebuilt (slot $SLOT)"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Before | \`$BEFORE\`: ${BEFORE_WHY} |"
              echo "| After | \`$AFTER\` |"
              echo "| Time | $(fmt "$TOTAL"): install $(fmt "$INSTALL_SECS"), waited for the lock $(fmt "$LOCK_WAIT"), rebuild $(fmt "$BUILD_SECS") |"
            } >> "$SUMMARY"
            [ "$BUILD_RC" -eq 0 ] || echo "::warning::dev-client heal: \`$PM run $REBUILD\` exited $BUILD_RC but the client now checks out, so it was kept"
          else
            give_up "\`$PM run $REBUILD\` exited $BUILD_RC and the client on the slot is still $AFTER after $(fmt "$TOTAL")"
          fi
          echo "dev-client-heal-result: before=$BEFORE after=$AFTER rebuilt=yes secs=$TOTAL install=$INSTALL_SECS lock_wait=$LOCK_WAIT build=$BUILD_SECS lock_at=$LOCK_AT unlock_at=$UNLOCK_AT"
          exit 0

      - name: Install Claude Code CLI (job-private HOME)
        # Pre-installs the CLI under a job-private HOME so concurrent jobs do not collide in the
        # shared ~/.claude/downloads (2026-10-09: 3 of 5 simultaneous dev-watchdog runs failed with
        # `Checksum verification failed`). Why, and what the fallback is: implementer-callable.yml's
        # step of the same name. Same script in every callable; change them together.
        id: claude-cli
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          CLI_HOME="$RUNNER_TEMP/claude-cli-home"
          PIN_SRC="$RUNNER_WORKSPACE/../_actions/anthropics/claude-code-action/v1/src/entrypoints/run.ts"
          fall_back() {
            echo "::warning::claude-cli pre-install skipped: $1. claude-code-action will install the CLI itself into the shared ~/.claude/downloads, where a concurrent job can make that fail with 'Checksum verification failed'."
            exit 0
          }
          VERSION="$(sed -n 's/.*claudeCodeVersion = "\([0-9][0-9.]*\)".*/\1/p' "$PIN_SRC" 2>/dev/null | head -n 1)" || VERSION=""
          [ -n "$VERSION" ] || fall_back "could not read the pinned CLI version from $PIN_SRC"
          rm -rf "$CLI_HOME"
          mkdir -p "$CLI_HOME" || fall_back "could not create $CLI_HOME"
          for ATTEMPT in 1 2 3; do
            env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_CACHE_HOME -u XDG_STATE_HOME -u CLAUDE_CONFIG_DIR HOME="$CLI_HOME" \
              bash -c 'set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash -s -- "$1"' _ "$VERSION" && break
            echo "claude-cli pre-install: attempt $ATTEMPT failed"
            [ "$ATTEMPT" -lt 3 ] && sleep 5
          done
          BIN="$CLI_HOME/.local/bin/claude"
          [ -x "$BIN" ] || fall_back "the installer left no executable at $BIN"
          GOT="$(env HOME="$CLI_HOME" "$BIN" --version 2>/dev/null | head -n 1)" || true
          case "$GOT" in
            "$VERSION"*) ;;
            *) fall_back "$BIN reports '$GOT', not the pinned $VERSION" ;;
          esac
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "claude-cli pre-install: $GOT at $BIN (installer HOME was $CLI_HOME)"

      - name: CI headless-rule hooks (--settings, only when vended)
        # The fleet's CI hooks (STANDARDS §19.7 rule 2). Every agent step in this job adds `args` to its
        # claude_args. The hooks are insurance, so a missing file adds nothing, with a ::warning::, and
        # never fails the job. Never use the action's `settings` input instead: the action saves that into
        # the runner user's settings, where it outlives the job. Same step in every callable that runs
        # claude-code-action: change them together.
        id: ci-hooks
        shell: bash
        run: |
          FILE=".fleet-ci/ci/_fleet/ci-hooks/settings.json"
          if [ -f "$FILE" ]; then
            echo "args=--settings $FILE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CI headless-rule hooks not loaded: $FILE is missing"
          fi

      - name: Run milestone-test agent
        id: agent
        uses: anthropics/claude-code-action@v1
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          # Shared password for the local-only test accounts (vault `fleet-test-local`,
          # STANDARDS §23.5). seed:test and any spec that signs in read it. Empty when the
          # org secret is unset — the skill treats that as a stop, not something to work around.
          FLEET_TEST_PASSWORD: ${{ secrets.FLEET_TEST_PASSWORD }}
          # Login email and a throwaway signing key for the product's LOCAL e2e stack, for a
          # product whose harness reads them from the environment (sethgibson-com: scripts/e2e.sh
          # -> get-dev-session.sh; STANDARDS §23.4/§23.5). Per-product REPO secrets: `secrets:
          # inherit` carries them in, and a repo secret shadows an org one of the same name.
          # Empty when unset — the skill treats that as a stop, not something to work around.
          ALLOWED_USER_EMAIL: ${{ secrets.ALLOWED_USER_EMAIL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          MT_PRODUCT_SLUG: ${{ inputs.product_slug }}
          MT_HUB_URL: ${{ inputs.hub_url }}
          MT_MILESTONE: ${{ inputs.milestone }}
          # Runner capability, not the milestone's surface marker — so a mobile milestone
          # that somehow lands on `fleet` STOPS with the `verification-unavailable` hold (the probe
          # reports no simulator) instead of thrashing against one.
          MT_MOBILE_CAPABLE: ${{ inputs.runner_label == 'fleet-mac' && '1' || '0' }}
          MT_ARTIFACT_DIR: ${{ github.workspace }}/.milestone-test-artifacts
        with:
          # Set by the pre-install step above; empty means it fell back and the action installs itself.
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The caller's push-triggered `redispatch` job starts this run with `gh workflow run`
          # under the default GITHUB_TOKEN, so the workflow_dispatch actor is `github-actions`
          # (type Bot). claude-code-action refuses a bot actor unless it is listed, dying at
          # startup with "Workflow initiated by non-human actor: github-actions (type: Bot)"
          # (puzzle-pop M16, run 36913059179). Allow exactly that bot, not '*'.
          allowed_bots: github-actions
          prompt: |
            You are running as the **milestone-test agent** in CI, in **Mode A (autonomous)**.

            Read `.fleet-ci/ci/milestone-test/SKILL.md` and follow it exactly. Every
            "Mode A" rule in it applies to you; every "Mode B" instruction does not.

            The milestone to test is $MT_MILESTONE — it was just closed and archived into
            `docs/PLANNING_ARCHIVE.md` by the PR that merged to `main`. The diff for that
            milestone is your scope. Do not sweep the rest of the app.

            Hard rules, restated because they are the ones that matter unattended:
            - **No harness, or a harness that can't run headless from a cold start?**
              STOP. Emit the `follow-up` pointing at `e2e-setup` and exit without a PR.
              Do NOT bootstrap a harness here.
            - **A required tool (Playwright / Maestro / the simulator) that will not
              launch?** This is decided AFTER the harness check, never before: no harness
              means the non-blocking `follow-up` above, with no probe and no hold. With a
              harness, run the tooling probe exactly as the skill's Step 0 says. Only exit
              `20` means unavailable — then STOP WITHOUT A PR and emit the blocking
              `verification-unavailable` exception INSTEAD OF the follow-up (template:
              `.fleet-ci/ci/ci-commit/PACKETS.md`), and exit cleanly. It holds the next
              dispatch so the loop cannot build on an unverified milestone. Any other exit
              is "could not decide", not a verdict. A missing probe script is never a reason
              to hold. This is not a failure: do not bootstrap, and do not run ci-commit.
            - **Never** delete, skip, `.only`/`.skip`, loosen an assertion, or extend a
              timeout to manufacture a green. A spec you can't fix in 3 attempts is ROUTED
              as a finding.
            - **Never** mark a behavior verified that you did not actually observe. What a
              headless runner can't check (behavior that is inherently unobservable — not
              a tool that failed to launch) is `⏸ not verified — needs human`, and it goes
              in the follow-up `ask`.
            - The session record's `**Tester:**` line reads `CI (autonomous)` with this
              run's URL. Screenshots go to $MT_ARTIFACT_DIR so this workflow uploads them.

            Route residual findings by reading `.fleet-ci/ci/shakedown/SKILL.md` and
            following its **Mode A autonomous routing posture** — tell it you are Mode A.
            Anything ambiguous parks on the routing board with `needs: decision`, in the file
            the skill's routing step says to write (`docs/routing-board.json`, or the legacy
            `docs/ROUTING_BOARD.md` only while the product still has one and no sidecar); do
            not invoke `lite-planner`.

            Then commit by reading `.fleet-ci/ci/ci-commit/SKILL.md` and following it.

            Finally, emit AT MOST ONE queue entry — a `follow-up`, or the blocking
            `verification-unavailable` exception when a required tool would not run — and
            only if the skill's Step 6 table says to. A clean session emits NOTHING — no
            FYI, no "all green" note. Silence is the success case.

            Runtime context:
            - Working directory has the full consumer repo (fetch-depth: 0).
            - Product slug: $MT_PRODUCT_SLUG (or derive from $GITHUB_REPOSITORY).
            - Hub base URL: $MT_HUB_URL.
            - Mobile/simulator capable: $MT_MOBILE_CAPABLE (1 = this runner has one).
          # Exact id, not an alias (DECISIONS 2026-10-13): no hub is in this workflow's trigger path
          # (a milestone close landing on main), so the YAML names the model that ran. It matches
          # what /settings resolves to.
          claude_args: |
            --model claude-sonnet-5-5
            --effort medium
            --max-turns ${{ env.AGENT_MAX_TURNS }}
            --allowedTools Read,Bash,Write,Edit,Glob,Grep
            ${{ steps.ci-hooks.outputs.args }}
            # --max-turns 180 matches implementer-callable and lite-planner-callable. The
            # session shares the same commit tax (shakedown -> ci-commit ->
            # canonical-doc-update) on top of authoring specs, running the suite, and the
            # visual pass. The skill's own turn-budget rule (~120 for Steps 1-4, ~50 in
            # reserve for Step 5) is the durable fix, plus its instruction to stop and
            # route what it has rather than grind into a max-turns death — NOT raising
            # this further.

      - name: Upload session artifacts
        # Screenshots + the suite's report. §23.9 evidence: a verification claim with
        # nothing attached does not satisfy the bar. Never fails the run.
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: milestone-test-${{ inputs.milestone }}
          path: |
            .milestone-test-artifacts/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Emit failure queue entry on agent death
        # The agent step failed before its own exit path — surface it so a closed milestone
        # doesn't silently go untested. The cause is read off the agent's result object, not assumed.
        id: failure-entry
        if: failure() && steps.agent.outcome == 'failure'
        env:
          # The action's transcript (a JSON array of SDK messages; the last `result` message carries
          # subtype / is_error / num_turns). Empty when the action died before writing it.
          AGENT_EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          # The agent step's outcome and who started the run, for the pre-flight cause (the action
          # refuses bot actors).
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          RUN_ACTOR: ${{ github.actor }}
          RUN_ACTOR_TYPE: ${{ github.event.sender.type }}
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          MT_PRODUCT_SLUG: ${{ inputs.product_slug }}
          MT_HUB_URL: ${{ inputs.hub_url }}
          MT_MILESTONE: ${{ inputs.milestone }}
          # Empty when the action died before Claude ran (its `conclusion` output is only set after).
          AGENT_CONCLUSION: ${{ steps.agent.outputs.conclusion }}
        run: |
          SLUG="${MT_PRODUCT_SLUG:-$(basename "$GITHUB_REPOSITORY")}"
          HUB="${MT_HUB_URL:-https://sethgibson.com}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Phase breadcrumb — the agent overwrites this single-line marker at each phase
          # boundary (milestone-test SKILL.md "Phase breadcrumb"). On a max-turns/crash
          # death the agent never reached its exit path, so this file is the only signal
          # for WHERE it died. Localizes the failure to a phase (scope | classify | e2e |
          # visual | routing | committing) instead of a bare death. Mirrors
          # implementer-callable and lite-planner-callable.
          PHASE_FILE="${GITHUB_WORKSPACE:-.}/.milestone-test-phase"
          LAST_PHASE="unknown"
          if [ -f "$PHASE_FILE" ]; then
            LAST_PHASE="$(tr -d '\r\n' < "$PHASE_FILE" | head -c 200)"
          fi
          echo "::notice::milestone-test-callable: workflow failed at phase=${LAST_PHASE}"

          # Run-id breadcrumb — written by the skill at the moment it generates the loop's run_id
          # (STANDARDS §18.1a), named after the agent like the phase marker above. The packet carries
          # it so the queue entry cross-links to the agent's activity trail. Absent, empty or
          # malformed → omit the field and say so in `attempts`. NEVER substitute $GITHUB_RUN_ID:
          # that names the workflow run, not the agent's loop, and a packet keyed to the wrong
          # identifier space reads as a confident empty trail.
          RUN_ID_FILE="${GITHUB_WORKSPACE:-.}/.milestone-test-run-id"
          AGENT_RUN_ID=""
          if [ -f "$RUN_ID_FILE" ]; then
            AGENT_RUN_ID="$(tr -d '\r\n' < "$RUN_ID_FILE" | head -c 128)"
          fi
          RUN_ID_FIELD=""
          RUN_ID_NOTE=""
          case "$AGENT_RUN_ID" in
            "")
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.milestone-test-run-id) was missing or empty, so this entry carries no run_id and is not linked to an activity trail." ;;
            *[!A-Za-z0-9_-]*)
              # Interpolated into the JSON body below; anything outside a plain id is not trusted.
              AGENT_RUN_ID=""
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.milestone-test-run-id) was malformed, so this entry carries no run_id and is not linked to an activity trail." ;;
            *)
              RUN_ID_FIELD="\"run_id\": \"$AGENT_RUN_ID\"," ;;
          esac

          # What the agent step actually reported. claude-code-action writes its transcript to
          # $RUNNER_TEMP/claude-execution-output.json and prints a {"type":"result", ...} object to the
          # log. Asserting "max-turns, crash, or infra" without looking names a cause the log can
          # contradict, so branch on the result object; where it cannot be read, say so.
          #   max-turns   subtype error_max_turns, or num_turns at/near the cap
          #   crash       is_error true, a non-success subtype, or no result object in the transcript
          #   clean-exit  subtype success, is_error false, turns well under the cap
          #   pre-flight  the agent step failed and no transcript exists: the action died in its own setup,
          #               before the agent started
          #   unknown     a transcript exists but jq is unavailable or a field would not parse
          EXEC_FILE="${AGENT_EXECUTION_FILE:-}"
          if [ -z "$EXEC_FILE" ]; then
            EXEC_FILE="${RUNNER_TEMP:-}/claude-execution-output.json"
          fi
          CAP="${AGENT_MAX_TURNS:-}"
          case "$CAP" in ""|*[!0-9]*) CAP="" ;; esac
          R_KIND=""; R_SUBTYPE=""; R_ERR=""; R_TURNS=""; R_BG=""; R_DONE=""; R_STOP=""
          if [ -f "$EXEC_FILE" ] && command -v jq >/dev/null 2>&1; then
            R_LINE="$(jq -r -s '
                [.[] | if type == "array" then .[] else . end | select(type == "object" and .type == "result")] | last
                | if . == null then "none"
                  else ["result", (.subtype | tostring), (.is_error | tostring), (.num_turns | tostring),
                       ((.subagent_stats | objects | .started_in_background | numbers) // "" | tostring),
                       ((.subagent_stats | objects | .completed | numbers) // "" | tostring),
                       ((.stop_reason | strings) // "")] | join("|")
                  end' "$EXEC_FILE" 2>/dev/null || true)"
            IFS='|' read -r R_KIND R_SUBTYPE R_ERR R_TURNS R_BG R_DONE R_STOP <<< "$R_LINE" || true
            # These land in the JSON body below: keep them to plain tokens.
            R_SUBTYPE="$(printf '%s' "$R_SUBTYPE" | tr -cd 'A-Za-z0-9_-' | head -c 64)"
            case "$R_ERR" in true|false) ;; *) R_ERR="" ;; esac
            case "$R_TURNS" in ""|*[!0-9]*) R_TURNS="" ;; esac
            # subagent_stats is absent on older transcripts: absent or unparseable is no evidence, never 0.
            case "$R_BG" in ""|*[!0-9]*) R_BG="" ;; esac
            case "$R_DONE" in ""|*[!0-9]*) R_DONE="" ;; esac
            R_STOP="$(printf '%s' "$R_STOP" | tr -cd 'A-Za-z0-9_-' | head -c 32)"
          fi
          CAUSE="unknown"
          BG_WAIT=""
          if [ "$R_KIND" = "none" ]; then
            CAUSE="crash"
          elif [ "$R_KIND" = "result" ]; then
            if [ "$R_SUBTYPE" = "error_max_turns" ] || { [ -n "$R_TURNS" ] && [ -n "$CAP" ] && [ "$R_TURNS" -ge $((CAP * 9 / 10)) ]; }; then
              CAUSE="max-turns"
            elif [ "$R_ERR" = "true" ] || { [ -n "$R_SUBTYPE" ] && [ "$R_SUBTYPE" != "success" ]; }; then
              CAUSE="crash"
            elif [ "$R_SUBTYPE" = "success" ] && [ "$R_ERR" = "false" ] && [ -n "$R_TURNS" ] && [ -n "$CAP" ]; then
              CAUSE="clean-exit"
              # Sub-flag, not a fifth cause: the agent dispatched subagents in the background, none had
              # completed, and it ended its turn waiting (STANDARDS 28.6). Needs both fields present.
              if [ -n "$R_BG" ] && [ -n "$R_DONE" ] && [ "$R_BG" -ge 1 ] && [ "$R_DONE" -eq 0 ]; then
                BG_WAIT=1
              fi
            fi
          fi
          # Pre-flight: the agent step failed and no transcript exists, so the action died in its own
          # setup (token exchange, trigger or actor checks) before the agent started. A transcript that
          # exists but cannot be parsed is not this case; it stays `unknown`. The action's own error line
          # cannot be quoted from here: check-run annotations are filled in only when the job completes
          # (annotations_count is 0 and the job-logs endpoint returns 404 while it runs, probed
          # 2026-10-18), so the entry sends the reader to the agent step's log. What this step can say
          # without guessing is who started the run, which is what the action's actor check reads.
          PF_ATTEMPT=""; PF_RECO=""
          if [ "$CAUSE" = "unknown" ] && [ "${AGENT_OUTCOME:-}" = "failure" ] && [ ! -f "$EXEC_FILE" ]; then
            CAUSE="pre-flight"
            # Interpolated into the JSON body below: a plain login, capped.
            PF_ACTOR="$(printf '%s' "${RUN_ACTOR:-}" | tr -cd 'A-Za-z0-9_.[]-' | head -c 64)"
            PF_BOT=""
            if [ "${RUN_ACTOR_TYPE:-}" = "Bot" ]; then
              PF_BOT=" This run was started by the bot actor ${PF_ACTOR:-unknown}, and claude-code-action refuses bot actors unless allowed_bots is set; if the agent step's log says 'Workflow initiated by non-human actor', that is the cause."
            fi
            PF_ATTEMPT="claude-code-action failed before the agent started: it wrote no transcript, so no agent session ran. Its own error line could not be read from inside the job (check-run annotations and the job log are only populated once the job completes), so it is not quoted here; it is in the log of the agent step.${PF_BOT}"
            PF_RECO="Read the first lines of the agent step's log in the run for the action's error. If it says 'non-human actor' or allowed_bots, the run was started by a bot: re-dispatch it as a person (the hub's Plan / Retry runs under GITHUB_MERGE_TOKEN as sgibson53, which passes). Any other pre-flight error is an action setup problem, not a budget or agent failure: fix what the log names, then re-dispatch."
          fi
          echo "::notice::milestone-test-callable: agent result cause=${CAUSE} subtype=${R_SUBTYPE:-?} is_error=${R_ERR:-?} turns=${R_TURNS:-?}/${CAP:-?} bg_started=${R_BG:-?} bg_completed=${R_DONE:-?} stop_reason=${R_STOP:-?}"

          # The transcript is the only record of the agent's final message ("why did it stop"); the
          # runner's temp dir is wiped at job end. Hand it to the upload step below.
          TRANSCRIPT_NOTE=""
          if [ -f "$EXEC_FILE" ]; then
            TRANSCRIPT_NOTE=" The agent's full transcript is attached to the run as the artifact milestone-test-transcript-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1} (7-day retention); its last result message is the agent's own account of why it stopped."
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "transcript_path=$EXEC_FILE" >> "$GITHUB_OUTPUT"
            fi
          fi

          # No phase AND no agent result: the action died at startup (it rejected the trigger event,
          # or its own setup failed), so the phase-based advice below would be a wrong guess.
          # Keep the quoting simple: these strings are interpolated into the JSON body below.
          if [ "$LAST_PHASE" = "unknown" ] && [ -z "${AGENT_CONCLUSION:-}" ]; then
            TITLE="[$SLUG] milestone-test did not start on ${MT_MILESTONE} - the milestone is UNTESTED"
            ATTEMPT="claude-code-action failed at startup, before any skill phase ran (no phase breadcrumb, no agent result). Usually the action rejected the trigger event (Unsupported event type) or its setup failed; it is not a large-diff, e2e or Playwright failure. Event: ${GITHUB_EVENT_NAME}. Run: $RUN_URL"
            ASK="${MT_MILESTONE} has NOT been tested. Read the first lines of the failing step to confirm the cause, then choose: fix the trigger (the session must run under workflow_dispatch, not push) and re-dispatch milestone-test for ${MT_MILESTONE}, or run milestone-test interactively (Mode B) in this repo."
            RECO="If the trigger is not already known-fixed, run it interactively now; otherwise fix the trigger first and re-dispatch (Actions, milestone-test, Run workflow, milestone=${MT_MILESTONE})."
            if [ "$CAUSE" = "pre-flight" ]; then
              # The agent step failed and wrote no transcript: say what is known rather than the guess above.
              ATTEMPT="${PF_ATTEMPT} Event: ${GITHUB_EVENT_NAME}. Run: $RUN_URL"
              RECO="$PF_RECO"
            fi
          else
            TITLE="[$SLUG] milestone-test failed on ${MT_MILESTONE}"
            ASK="Inspect the run log, then run milestone-test interactively for ${MT_MILESTONE} or re-dispatch the workflow"
            # Only what the result object supports is asserted; the phase advice (large diff, thrashing
            # spec) is reserved for an actual max-turns death.
            case "$CAUSE" in
              max-turns)
                ATTEMPT="claude-code-action used ${R_TURNS} of ${CAP} turns (result subtype ${R_SUBTYPE}), at or near its turn cap, before the skill's own exit path."
                RECO="Died at phase '${LAST_PHASE}'. scope/classify -> the milestone diff is probably large; consider running the session interactively. e2e -> a spec likely thrashed past the 3-attempt cap, or the harness is not CI-ready (run e2e-setup). visual -> Playwright may lack its OS deps on the runner (SELF_HOSTED_RUNNER.md 'Playwright readiness'). routing/committing -> check the shakedown / ci-commit tail; the specs may already be written and just need committing." ;;
              crash)
                if [ "$R_KIND" = "none" ]; then
                  ATTEMPT="claude-code-action ended without a result object in its transcript (a crash or infra error) before the skill's own exit path."
                else
                  ATTEMPT="claude-code-action ended in error (result subtype ${R_SUBTYPE:-unknown}, is_error ${R_ERR:-unknown}, ${R_TURNS:-unknown} of ${CAP:-unknown} turns) before the skill's own exit path."
                fi
                RECO="Died at phase '${LAST_PHASE}'. This reads as a crash or infra error, not a budget death: re-dispatching is apt. If it recurs at the same phase, read the run log before changing anything." ;;
              clean-exit)
                if [ -n "$BG_WAIT" ]; then
                  # Signature of STANDARDS 28.6 (a headless agent has no next turn).
                  ATTEMPT="The agent's result object reports success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap, stop_reason ${R_STOP:-unreported}) yet the step is marked failed: the agent spawned ${R_BG} subagent(s) in the background, none completed (${R_DONE} completed), and it ended its turn waiting for one. A headless session has no next turn, so that ended the session without running its exit path (STANDARDS 28.6)."
                  RECO="Died at phase '${LAST_PHASE}'. Not a budget or infra failure: do not treat it as one. The fix is the skill's dispatch instruction (STANDARDS 28.6), and a re-dispatch before that fix lands stops the same way; running the session interactively (Mode B) has a next turn and is not affected. Any specs or fixes the agent wrote were in the runner workspace and are gone unless it committed or pushed them; the agent's final message in the transcript artifact should say what it was waiting for."
                else
                  ATTEMPT="The agent's result object reports success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap) yet the step is marked failed."
                  RECO="Not a budget or infra failure. Read the run log around the end of the agent step, and the agent's final message in the transcript artifact, to see why the step was marked failed (last phase '${LAST_PHASE}')."
                fi ;;
              pre-flight)
                ATTEMPT="$PF_ATTEMPT"
                RECO="$PF_RECO" ;;
              *)
                ATTEMPT="claude-code-action failed before the skill's own exit path; cause unknown (the agent step's result object could not be read from this job)."
                RECO="Cause unknown - read the run log (and the transcript artifact, if one is attached) before choosing between re-dispatching and running the session interactively. The last phase reached was '${LAST_PHASE}'." ;;
            esac
            ATTEMPT="${ATTEMPT} Last phase reached: ${LAST_PHASE}. Run: ${RUN_URL}"
          fi
          ATTEMPT="${ATTEMPT}${RUN_ID_NOTE}${TRANSCRIPT_NOTE}"

          if [ -n "$QUEUE_SERVICE_ROLE_KEY" ]; then
            # request_id: the run ID plus, from the second attempt on, the attempt number. A re-run
            # keeps the run ID and only GITHUB_RUN_ATTEMPT changes, so the run ID alone would repeat
            # attempt 1's request_id and the hub would answer with the existing (resolved) entry,
            # filing no card for the second failure. Attempt 1's input is unchanged, so its hash is too.
            REQ_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
            case "$REQ_ATTEMPT" in ""|*[!0-9]*) REQ_ATTEMPT=1 ;; esac
            REQ_SEED="${GITHUB_RUN_ID}milestone-test-failed"
            if [ "$REQ_ATTEMPT" -gt 1 ]; then
              REQ_SEED="${REQ_SEED}:${REQ_ATTEMPT}"
            fi
            REQUEST_ID=$(printf '%s' "$REQ_SEED" | sha256sum | cut -d' ' -f1)
            # Stamp the card the hub auto-retries (fleet DECISIONS 2026-10-31, STANDARDS §29.6): a
            # pre-flight death (no agent session ran) on the FIRST attempt, started by a person. An
            # attempt-2 card is deliberately not stamped, so it stays with Seth; a bot actor is
            # deterministic (the action refuses it every time), so a retry cannot help. Optional
            # field, built like RUN_ID_FIELD and sharing its line below so every other card's body is
            # byte-identical to before.
            CATEGORY_FIELD=""
            if [ "$CAUSE" = "pre-flight" ] && [ "$REQ_ATTEMPT" -eq 1 ] && [ "${RUN_ACTOR_TYPE:-}" != "Bot" ]; then
              CATEGORY_FIELD="\"category\": \"pre-flight\","
            fi
            curl -sf -X POST "${HUB}/api/v1/queue/entries" \
              -H "Content-Type: application/json" \
              -H "x-service-role-key: $QUEUE_SERVICE_ROLE_KEY" \
              -H "User-Agent: aethrix-fleet-ci/1.0 (milestone-test-callable)" \
              -d "{
                \"request_id\": \"$REQUEST_ID\",
                \"entry_type\": \"exception\",
                \"variant\": \"workflow-failed\",
                ${RUN_ID_FIELD}${CATEGORY_FIELD}
                \"agent_name\": \"milestone-test\",
                \"product_slug\": \"$SLUG\",
                \"title\": \"$TITLE\",
                \"goal\": \"Run the per-milestone testing session for ${MT_MILESTONE} (STANDARDS 23.7 Mode A)\",
                \"attempts\": [\"$ATTEMPT\"],
                \"artifacts\": [{\"label\": \"Workflow run\", \"href\": \"$RUN_URL\", \"artifact_type\": \"doc\"}],
                \"ask\": \"$ASK\",
                \"recommendation\": \"$RECO\"
              }" \
            || echo "::warning::milestone-test-callable: failure queue-entry POST failed"
          else
            echo "::warning::milestone-test-callable: QUEUE_SERVICE_ROLE_KEY missing; skipping failure queue entry"
          fi

      - name: Upload the agent transcript (failure path only)
        # The agent step runs with show_full_output: false, so the log carries the result object but
        # not the agent's final message, and the transcript is deleted with the runner's temp dir.
        # An artifact rather than show_full_output: true — that would print every tool result,
        # secrets included, into a log anyone with read access can open. The guard above sets
        # `transcript_path` only when it ran, i.e. the agent step failed.
        if: always() && steps.failure-entry.outputs.transcript_path != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: milestone-test-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.failure-entry.outputs.transcript_path }}
          if-no-files-found: warn
          retention-days: 7
