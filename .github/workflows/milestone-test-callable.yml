name: milestone-test (callable)

# Per-milestone testing session, autonomous mode (STANDARDS §23.7 Mode A).
#
# The thin per-product .github/workflows/milestone-test.yml `uses:` this. Its gate job
# turns a push to `main` into (milestone, runner) — a milestone close is the merge of the
# PR that archived the milestone into docs/PLANNING_ARCHIVE.md — and dispatches here.
#
# Flow: scope from the milestone diff -> classify each built behavior (e2e / checklist /
# neither) -> author + run the e2e headless to green -> headless visual pass with
# screenshots -> route residual findings via shakedown's autonomous posture -> commit via
# ci-commit. Emits a `follow-up` ONLY when something actually needs Seth; a clean session
# emits nothing, which is the whole point of the mode.
#
# Requires these bundles vended to fleet-skills `ci/`, reached at .fleet-ci/ci/<name>/:
# milestone-test, shakedown, ci-commit (incl. PACKETS.md — the `verification-unavailable`
# template), and implementer (its tooling-probe.mjs, run pre-agent and by the skill's Step 0).

on:
  workflow_call:
    inputs:
      product_slug:
        description: "Product slug (defaults to repo basename)."
        type: string
        required: false
        default: ""
      hub_url:
        description: "Hub base URL for the queue POST. Defaults to https://sethgibson.com."
        type: string
        required: false
        default: "https://sethgibson.com"
      milestone:
        description: "The closed milestone to test, e.g. M35. Resolved by the caller's gate job."
        type: string
        required: true
      runner_label:
        description: "Self-hosted runner label (STANDARDS §9 surface routing). 'fleet' = PC (web/backend), 'fleet-mac' = Mac (mobile; has the simulator)."
        type: string
        required: false
        default: "fleet"

permissions:
  contents: write # the session commits specs, seed scripts and docs
  pull-requests: write # ci-commit opens the PR
  id-token: write # required by anthropics/claude-code-action@v1

concurrency:
  # Serialize milestone-test runs per product. Deliberately NOT shared with the
  # implementer's group: a queued implementer run strands its hub session (the dispatch
  # endpoint returns 204 with no body, so the hub never learns the run id).
  group: milestone-test-${{ github.repository }}
  cancel-in-progress: false

jobs:
  milestone-test:
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    # STANDARDS §28.6. No completed run yet to measure; sized off the implementer (same
    # 180-turn budget, observed max 60m) plus e2e suite runs inside those turns. fleet-mac
    # adds 30 for Maestro calls queueing on the fleet_maestro lock (FLEET_MAESTRO_LOCK_WAIT_SECS=1800).
    timeout-minutes: ${{ inputs.runner_label == 'fleet-mac' && 180 || 150 }}
    env:
      # One source for the turn cap: the agent step's --max-turns and the failure guard's
      # "did it run out of turns?" test both read it, so they cannot drift apart.
      AGENT_MAX_TURNS: "180"
    steps:
      - name: Guard — claude-code-action supports only some events
        # A reusable workflow inherits the CALLER's event, and anthropics/claude-code-action@v1 throws
        # "Unsupported event type" ~200 ms into its step for anything outside this list — before any
        # skill phase runs, with nothing to say why. Fail here instead, naming the cause.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            issues|issue_comment|pull_request|pull_request_target|pull_request_review|pull_request_review_comment|workflow_dispatch|repository_dispatch|schedule|workflow_run) ;;
            *)
              echo "::error::claude-code-action cannot run under '$EVENT_NAME'; dispatch via workflow_dispatch. The caller's milestone-test.yml must hand off with 'gh workflow run' and run this job only under workflow_dispatch (STANDARDS §28.6)."
              echo "### milestone-test cannot run under \`$EVENT_NAME\`" >> "$GITHUB_STEP_SUMMARY"
              echo "claude-code-action rejects this event, so the session was not started and the milestone is UNTESTED. The caller must re-dispatch as workflow_dispatch (see skills/e2e-setup/assets/milestone-test.yml)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4 # consumer repo at $GITHUB_WORKSPACE
        with:
          fetch-depth: 0 # the session reads the milestone's diff + git history

      - uses: actions/checkout@v4 # fleet-skills (CI skills under ci/)
        with:
          repository: Aethrix-Labs/fleet-skills
          path: .fleet-ci
          ref: main
          token: ${{ secrets.FLEET_SKILLS_PAT }} # fleet-skills is private

      - name: Set up gh CLI
        run: gh --version

      - name: Configure git for commits
        run: |
          git config user.name  "milestone-test[bot]"
          git config user.email "milestone-test@aethrix-labs.local"

      - name: Probe verification tooling (Playwright / Maestro / simulator)
        # Records what THIS runner can actually launch, so the run log and the agent start from
        # facts instead of the runner label's promise (STANDARDS §23.9 "When the tool can't run").
        # Advisory: never a gate and never fails the job. The agent's own probe run is authoritative
        # (it can heal, and it is scoped to the repo's Playwright version). A missing script only means
        # the fleet-skills vending PR has not landed yet; that must not break CI for every product.
        # Bounded: a hung probe must not hold this product's concurrency group for the default 6h.
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          # Through env, never interpolated into the script body.
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          PROBE=".fleet-ci/ci/implementer/tooling-probe.mjs"
          if [ ! -f "$PROBE" ]; then
            echo "::notice::tooling-probe not present in .fleet-ci (fleet-skills vending not landed yet); skipping"
            exit 0
          fi
          if ! command -v node >/dev/null 2>&1; then
            echo "::notice::node is not on PATH for this runner; skipping the tooling probe"
            exit 0
          fi
          # The probe prints only single-line values behind fixed prefixes, so its output cannot start a
          # workflow command (`::…`) at column 0.
          node "$PROBE" --runner --github-env 2> "$RUNNER_TEMP/tooling-probe.txt" >/dev/null || true
          cat "$RUNNER_TEMP/tooling-probe.txt"
          {
            echo "### Verification tooling on \`${RUNNER_LABEL}\`"
            echo '```'
            cat "$RUNNER_TEMP/tooling-probe.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/tooling-probe.txt"

      - name: Run milestone-test agent
        id: agent
        uses: anthropics/claude-code-action@v1
        env:
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          AUTONOMOUS_TICK_TOKEN: ${{ secrets.AUTONOMOUS_TICK_TOKEN }}
          # Shared password for the local-only test accounts (vault `fleet-test-local`,
          # STANDARDS §23.5). seed:test and any spec that signs in read it. Empty when the
          # org secret is unset — the skill treats that as a stop, not something to work around.
          FLEET_TEST_PASSWORD: ${{ secrets.FLEET_TEST_PASSWORD }}
          MT_PRODUCT_SLUG: ${{ inputs.product_slug }}
          MT_HUB_URL: ${{ inputs.hub_url }}
          MT_MILESTONE: ${{ inputs.milestone }}
          # Runner capability, not the milestone's surface marker — so a mobile milestone
          # that somehow lands on `fleet` STOPS with the `verification-unavailable` hold (the probe
          # reports no simulator) instead of thrashing against one.
          MT_MOBILE_CAPABLE: ${{ inputs.runner_label == 'fleet-mac' && '1' || '0' }}
          MT_ARTIFACT_DIR: ${{ github.workspace }}/.milestone-test-artifacts
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The caller's push-triggered `redispatch` job starts this run with `gh workflow run`
          # under the default GITHUB_TOKEN, so the workflow_dispatch actor is `github-actions`
          # (type Bot). claude-code-action refuses a bot actor unless it is listed, dying at
          # startup with "Workflow initiated by non-human actor: github-actions (type: Bot)"
          # (puzzle-pop M16, run 36913059179). Allow exactly that bot, not '*'.
          allowed_bots: github-actions
          prompt: |
            You are running as the **milestone-test agent** in CI, in **Mode A (autonomous)**.

            Read `.fleet-ci/ci/milestone-test/SKILL.md` and follow it exactly. Every
            "Mode A" rule in it applies to you; every "Mode B" instruction does not.

            The milestone to test is $MT_MILESTONE — it was just closed and archived into
            `docs/PLANNING_ARCHIVE.md` by the PR that merged to `main`. The diff for that
            milestone is your scope. Do not sweep the rest of the app.

            Hard rules, restated because they are the ones that matter unattended:
            - **No harness, or a harness that can't run headless from a cold start?**
              STOP. Emit the `follow-up` pointing at `e2e-setup` and exit without a PR.
              Do NOT bootstrap a harness here.
            - **A required tool (Playwright / Maestro / the simulator) that will not
              launch?** This is decided AFTER the harness check, never before: no harness
              means the non-blocking `follow-up` above, with no probe and no hold. With a
              harness, run the tooling probe exactly as the skill's Step 0 says. Only exit
              `20` means unavailable — then STOP WITHOUT A PR and emit the blocking
              `verification-unavailable` exception INSTEAD OF the follow-up (template:
              `.fleet-ci/ci/ci-commit/PACKETS.md`), and exit cleanly. It holds the next
              dispatch so the loop cannot build on an unverified milestone. Any other exit
              is "could not decide", not a verdict. A missing probe script is never a reason
              to hold. This is not a failure: do not bootstrap, and do not run ci-commit.
            - **Never** delete, skip, `.only`/`.skip`, loosen an assertion, or extend a
              timeout to manufacture a green. A spec you can't fix in 3 attempts is ROUTED
              as a finding.
            - **Never** mark a behavior verified that you did not actually observe. What a
              headless runner can't check (behavior that is inherently unobservable — not
              a tool that failed to launch) is `⏸ not verified — needs human`, and it goes
              in the follow-up `ask`.
            - The session record's `**Tester:**` line reads `CI (autonomous)` with this
              run's URL. Screenshots go to $MT_ARTIFACT_DIR so this workflow uploads them.

            Route residual findings by reading `.fleet-ci/ci/shakedown/SKILL.md` and
            following its **Mode A autonomous routing posture** — tell it you are Mode A.
            Anything ambiguous parks on `ROUTING_BOARD.md` with `needs: decision`; do not
            invoke `lite-planner`.

            Then commit by reading `.fleet-ci/ci/ci-commit/SKILL.md` and following it.

            Finally, emit AT MOST ONE queue entry — a `follow-up`, or the blocking
            `verification-unavailable` exception when a required tool would not run — and
            only if the skill's Step 6 table says to. A clean session emits NOTHING — no
            FYI, no "all green" note. Silence is the success case.

            Runtime context:
            - Working directory has the full consumer repo (fetch-depth: 0).
            - Product slug: $MT_PRODUCT_SLUG (or derive from $GITHUB_REPOSITORY).
            - Hub base URL: $MT_HUB_URL.
            - Mobile/simulator capable: $MT_MOBILE_CAPABLE (1 = this runner has one).
          # Alias, not an exact id: no hub is in this workflow's trigger path (a milestone close landing on main),
          # so nothing would ever bump a pinned id. "sonnet" tracks the current Sonnet on its
          # own (MODEL_SELECTION_PROPOSAL 2.2) and keeps this off the manual bump procedure.
          claude_args: |
            --model sonnet
            --effort medium
            --max-turns ${{ env.AGENT_MAX_TURNS }}
            --allowedTools Read,Bash,Write,Edit,Glob,Grep
            # --max-turns 180 matches implementer-callable and lite-planner-callable. The
            # session shares the same commit tax (shakedown -> ci-commit ->
            # canonical-doc-update) on top of authoring specs, running the suite, and the
            # visual pass. The skill's own turn-budget rule (~120 for Steps 1-4, ~50 in
            # reserve for Step 5) is the durable fix, plus its instruction to stop and
            # route what it has rather than grind into a max-turns death — NOT raising
            # this further.

      - name: Upload session artifacts
        # Screenshots + the suite's report. §23.9 evidence: a verification claim with
        # nothing attached does not satisfy the bar. Never fails the run.
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: milestone-test-${{ inputs.milestone }}
          path: |
            .milestone-test-artifacts/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Emit failure queue entry on agent death
        # The agent step failed before its own exit path — surface it so a closed milestone
        # doesn't silently go untested. The cause is read off the agent's result object, not assumed.
        id: failure-entry
        if: failure() && steps.agent.outcome == 'failure'
        env:
          # The action's transcript (a JSON array of SDK messages; the last `result` message carries
          # subtype / is_error / num_turns). Empty when the action died before writing it.
          AGENT_EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          QUEUE_SERVICE_ROLE_KEY: ${{ secrets.QUEUE_SERVICE_ROLE_KEY }}
          MT_PRODUCT_SLUG: ${{ inputs.product_slug }}
          MT_HUB_URL: ${{ inputs.hub_url }}
          MT_MILESTONE: ${{ inputs.milestone }}
          # Empty when the action died before Claude ran (its `conclusion` output is only set after).
          AGENT_CONCLUSION: ${{ steps.agent.outputs.conclusion }}
        run: |
          SLUG="${MT_PRODUCT_SLUG:-$(basename "$GITHUB_REPOSITORY")}"
          HUB="${MT_HUB_URL:-https://sethgibson.com}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Phase breadcrumb — the agent overwrites this single-line marker at each phase
          # boundary (milestone-test SKILL.md "Phase breadcrumb"). On a max-turns/crash
          # death the agent never reached its exit path, so this file is the only signal
          # for WHERE it died. Localizes the failure to a phase (scope | classify | e2e |
          # visual | routing | committing) instead of a bare death. Mirrors
          # implementer-callable and lite-planner-callable.
          PHASE_FILE="${GITHUB_WORKSPACE:-.}/.milestone-test-phase"
          LAST_PHASE="unknown"
          if [ -f "$PHASE_FILE" ]; then
            LAST_PHASE="$(tr -d '\r\n' < "$PHASE_FILE" | head -c 200)"
          fi
          echo "::notice::milestone-test-callable: workflow failed at phase=${LAST_PHASE}"

          # Run-id breadcrumb — written by the skill at the moment it generates the loop's run_id
          # (STANDARDS §18.1a), named after the agent like the phase marker above. The packet carries
          # it so the queue entry cross-links to the agent's activity trail. Absent, empty or
          # malformed → omit the field and say so in `attempts`. NEVER substitute $GITHUB_RUN_ID:
          # that names the workflow run, not the agent's loop, and a packet keyed to the wrong
          # identifier space reads as a confident empty trail.
          RUN_ID_FILE="${GITHUB_WORKSPACE:-.}/.milestone-test-run-id"
          AGENT_RUN_ID=""
          if [ -f "$RUN_ID_FILE" ]; then
            AGENT_RUN_ID="$(tr -d '\r\n' < "$RUN_ID_FILE" | head -c 128)"
          fi
          RUN_ID_FIELD=""
          RUN_ID_NOTE=""
          case "$AGENT_RUN_ID" in
            "")
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.milestone-test-run-id) was missing or empty, so this entry carries no run_id and is not linked to an activity trail." ;;
            *[!A-Za-z0-9_-]*)
              # Interpolated into the JSON body below; anything outside a plain id is not trusted.
              AGENT_RUN_ID=""
              RUN_ID_NOTE=" The agent's run-id breadcrumb (.milestone-test-run-id) was malformed, so this entry carries no run_id and is not linked to an activity trail." ;;
            *)
              RUN_ID_FIELD="\"run_id\": \"$AGENT_RUN_ID\"," ;;
          esac

          # What the agent step actually reported. claude-code-action writes its transcript to
          # $RUNNER_TEMP/claude-execution-output.json and prints a {"type":"result", ...} object to the
          # log. Asserting "max-turns, crash, or infra" without looking names a cause the log can
          # contradict, so branch on the result object; where it cannot be read, say so.
          #   max-turns   subtype error_max_turns, or num_turns at/near the cap
          #   crash       is_error true, a non-success subtype, or no result object in the transcript
          #   clean-exit  subtype success, is_error false, turns well under the cap
          #   unknown     transcript or jq unavailable, or a field would not parse
          EXEC_FILE="${AGENT_EXECUTION_FILE:-}"
          if [ -z "$EXEC_FILE" ]; then
            EXEC_FILE="${RUNNER_TEMP:-}/claude-execution-output.json"
          fi
          CAP="${AGENT_MAX_TURNS:-}"
          case "$CAP" in ""|*[!0-9]*) CAP="" ;; esac
          R_KIND=""; R_SUBTYPE=""; R_ERR=""; R_TURNS=""; R_BG=""; R_DONE=""; R_STOP=""
          if [ -f "$EXEC_FILE" ] && command -v jq >/dev/null 2>&1; then
            R_LINE="$(jq -r -s '
                [.[] | if type == "array" then .[] else . end | select(type == "object" and .type == "result")] | last
                | if . == null then "none"
                  else ["result", (.subtype | tostring), (.is_error | tostring), (.num_turns | tostring),
                       ((.subagent_stats | objects | .started_in_background | numbers) // "" | tostring),
                       ((.subagent_stats | objects | .completed | numbers) // "" | tostring),
                       ((.stop_reason | strings) // "")] | join("|")
                  end' "$EXEC_FILE" 2>/dev/null || true)"
            IFS='|' read -r R_KIND R_SUBTYPE R_ERR R_TURNS R_BG R_DONE R_STOP <<< "$R_LINE" || true
            # These land in the JSON body below: keep them to plain tokens.
            R_SUBTYPE="$(printf '%s' "$R_SUBTYPE" | tr -cd 'A-Za-z0-9_-' | head -c 64)"
            case "$R_ERR" in true|false) ;; *) R_ERR="" ;; esac
            case "$R_TURNS" in ""|*[!0-9]*) R_TURNS="" ;; esac
            # subagent_stats is absent on older transcripts: absent or unparseable is no evidence, never 0.
            case "$R_BG" in ""|*[!0-9]*) R_BG="" ;; esac
            case "$R_DONE" in ""|*[!0-9]*) R_DONE="" ;; esac
            R_STOP="$(printf '%s' "$R_STOP" | tr -cd 'A-Za-z0-9_-' | head -c 32)"
          fi
          CAUSE="unknown"
          BG_WAIT=""
          if [ "$R_KIND" = "none" ]; then
            CAUSE="crash"
          elif [ "$R_KIND" = "result" ]; then
            if [ "$R_SUBTYPE" = "error_max_turns" ] || { [ -n "$R_TURNS" ] && [ -n "$CAP" ] && [ "$R_TURNS" -ge $((CAP * 9 / 10)) ]; }; then
              CAUSE="max-turns"
            elif [ "$R_ERR" = "true" ] || { [ -n "$R_SUBTYPE" ] && [ "$R_SUBTYPE" != "success" ]; }; then
              CAUSE="crash"
            elif [ "$R_SUBTYPE" = "success" ] && [ "$R_ERR" = "false" ] && [ -n "$R_TURNS" ] && [ -n "$CAP" ]; then
              CAUSE="clean-exit"
              # Sub-flag, not a fifth cause: the agent dispatched subagents in the background, none had
              # completed, and it ended its turn waiting (STANDARDS 28.6). Needs both fields present.
              if [ -n "$R_BG" ] && [ -n "$R_DONE" ] && [ "$R_BG" -ge 1 ] && [ "$R_DONE" -eq 0 ]; then
                BG_WAIT=1
              fi
            fi
          fi
          echo "::notice::milestone-test-callable: agent result cause=${CAUSE} subtype=${R_SUBTYPE:-?} is_error=${R_ERR:-?} turns=${R_TURNS:-?}/${CAP:-?} bg_started=${R_BG:-?} bg_completed=${R_DONE:-?} stop_reason=${R_STOP:-?}"

          # The transcript is the only record of the agent's final message ("why did it stop"); the
          # runner's temp dir is wiped at job end. Hand it to the upload step below.
          TRANSCRIPT_NOTE=""
          if [ -f "$EXEC_FILE" ]; then
            TRANSCRIPT_NOTE=" The agent's full transcript is attached to the run as the artifact milestone-test-transcript-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1} (7-day retention); its last result message is the agent's own account of why it stopped."
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "transcript_path=$EXEC_FILE" >> "$GITHUB_OUTPUT"
            fi
          fi

          # No phase AND no agent result: the action died at startup (it rejected the trigger event,
          # or its own setup failed), so the phase-based advice below would be a wrong guess.
          # Keep the quoting simple: these strings are interpolated into the JSON body below.
          if [ "$LAST_PHASE" = "unknown" ] && [ -z "${AGENT_CONCLUSION:-}" ]; then
            TITLE="[$SLUG] milestone-test did not start on ${MT_MILESTONE} - the milestone is UNTESTED"
            ATTEMPT="claude-code-action failed at startup, before any skill phase ran (no phase breadcrumb, no agent result). Usually the action rejected the trigger event (Unsupported event type) or its setup failed; it is not a large-diff, e2e or Playwright failure. Event: ${GITHUB_EVENT_NAME}. Run: $RUN_URL"
            ASK="${MT_MILESTONE} has NOT been tested. Read the first lines of the failing step to confirm the cause, then choose: fix the trigger (the session must run under workflow_dispatch, not push) and re-dispatch milestone-test for ${MT_MILESTONE}, or run milestone-test interactively (Mode B) in this repo."
            RECO="If the trigger is not already known-fixed, run it interactively now; otherwise fix the trigger first and re-dispatch (Actions, milestone-test, Run workflow, milestone=${MT_MILESTONE})."
          else
            TITLE="[$SLUG] milestone-test failed on ${MT_MILESTONE}"
            ASK="Inspect the run log, then run milestone-test interactively for ${MT_MILESTONE} or re-dispatch the workflow"
            # Only what the result object supports is asserted; the phase advice (large diff, thrashing
            # spec) is reserved for an actual max-turns death.
            case "$CAUSE" in
              max-turns)
                ATTEMPT="claude-code-action used ${R_TURNS} of ${CAP} turns (result subtype ${R_SUBTYPE}), at or near its turn cap, before the skill's own exit path."
                RECO="Died at phase '${LAST_PHASE}'. scope/classify -> the milestone diff is probably large; consider running the session interactively. e2e -> a spec likely thrashed past the 3-attempt cap, or the harness is not CI-ready (run e2e-setup). visual -> Playwright may lack its OS deps on the runner (SELF_HOSTED_RUNNER.md 'Playwright readiness'). routing/committing -> check the shakedown / ci-commit tail; the specs may already be written and just need committing." ;;
              crash)
                if [ "$R_KIND" = "none" ]; then
                  ATTEMPT="claude-code-action ended without a result object in its transcript (a crash or infra error) before the skill's own exit path."
                else
                  ATTEMPT="claude-code-action ended in error (result subtype ${R_SUBTYPE:-unknown}, is_error ${R_ERR:-unknown}, ${R_TURNS:-unknown} of ${CAP:-unknown} turns) before the skill's own exit path."
                fi
                RECO="Died at phase '${LAST_PHASE}'. This reads as a crash or infra error, not a budget death: re-dispatching is apt. If it recurs at the same phase, read the run log before changing anything." ;;
              clean-exit)
                if [ -n "$BG_WAIT" ]; then
                  # Signature of STANDARDS 28.6 (a headless agent has no next turn).
                  ATTEMPT="The agent's result object reports success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap, stop_reason ${R_STOP:-unreported}) yet the step is marked failed: the agent spawned ${R_BG} subagent(s) in the background, none completed (${R_DONE} completed), and it ended its turn waiting for one. A headless session has no next turn, so that ended the session without running its exit path (STANDARDS 28.6)."
                  RECO="Died at phase '${LAST_PHASE}'. Not a budget or infra failure: do not treat it as one. The fix is the skill's dispatch instruction (STANDARDS 28.6), and a re-dispatch before that fix lands stops the same way; running the session interactively (Mode B) has a next turn and is not affected. Any specs or fixes the agent wrote were in the runner workspace and are gone unless it committed or pushed them; the agent's final message in the transcript artifact should say what it was waiting for."
                else
                  ATTEMPT="The agent's result object reports success (result subtype success, is_error false, ${R_TURNS} of ${CAP} turns, well under the cap) yet the step is marked failed."
                  RECO="Not a budget or infra failure. Read the run log around the end of the agent step, and the agent's final message in the transcript artifact, to see why the step was marked failed (last phase '${LAST_PHASE}')."
                fi ;;
              *)
                ATTEMPT="claude-code-action failed before the skill's own exit path; cause unknown (the agent step's result object could not be read from this job)."
                RECO="Cause unknown - read the run log (and the transcript artifact, if one is attached) before choosing between re-dispatching and running the session interactively. The last phase reached was '${LAST_PHASE}'." ;;
            esac
            ATTEMPT="${ATTEMPT} Last phase reached: ${LAST_PHASE}. Run: ${RUN_URL}"
          fi
          ATTEMPT="${ATTEMPT}${RUN_ID_NOTE}${TRANSCRIPT_NOTE}"

          if [ -n "$QUEUE_SERVICE_ROLE_KEY" ]; then
            REQUEST_ID=$(printf '%s' "${GITHUB_RUN_ID}milestone-test-failed" | sha256sum | cut -d' ' -f1)
            curl -sf -X POST "${HUB}/api/v1/queue/entries" \
              -H "Content-Type: application/json" \
              -H "x-service-role-key: $QUEUE_SERVICE_ROLE_KEY" \
              -H "User-Agent: aethrix-fleet-ci/1.0 (milestone-test-callable)" \
              -d "{
                \"request_id\": \"$REQUEST_ID\",
                \"entry_type\": \"exception\",
                \"variant\": \"workflow-failed\",
                ${RUN_ID_FIELD}
                \"agent_name\": \"milestone-test\",
                \"product_slug\": \"$SLUG\",
                \"title\": \"$TITLE\",
                \"goal\": \"Run the per-milestone testing session for ${MT_MILESTONE} (STANDARDS 23.7 Mode A)\",
                \"attempts\": [\"$ATTEMPT\"],
                \"artifacts\": [{\"label\": \"Workflow run\", \"href\": \"$RUN_URL\", \"artifact_type\": \"doc\"}],
                \"ask\": \"$ASK\",
                \"recommendation\": \"$RECO\"
              }" \
            || echo "::warning::milestone-test-callable: failure queue-entry POST failed"
          else
            echo "::warning::milestone-test-callable: QUEUE_SERVICE_ROLE_KEY missing; skipping failure queue entry"
          fi

      - name: Upload the agent transcript (failure path only)
        # The agent step runs with show_full_output: false, so the log carries the result object but
        # not the agent's final message, and the transcript is deleted with the runner's temp dir.
        # An artifact rather than show_full_output: true — that would print every tool result,
        # secrets included, into a log anyone with read access can open. The guard above sets
        # `transcript_path` only when it ran, i.e. the agent step failed.
        if: always() && steps.failure-entry.outputs.transcript_path != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: milestone-test-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.failure-entry.outputs.transcript_path }}
          if-no-files-found: warn
          retention-days: 7
